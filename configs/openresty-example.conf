# /opt/openresty/nginx/conf/nginx.conf
# OpenResty in-path WAF mode:
# - access_by_lua decides whether to proxy to apache or to cfm challenge server
# - CFM bridge is HTTP-over-UNIX-socket, requires X-CFM-Token header
#
# You DNAT 80->9080 and 443->9043.

user root;
worker_processes 2;

error_log /opt/openresty/nginx/logs/error.log info;
pid       /opt/openresty/nginx/logs/nginx.pid;

# Pass env vars to workers (must be set in master env *before* start)
env OPENRESTY_SOCK;
env OPENRESTY_TOKEN;

# Optional tuning for lua client
env CFM_DECISION_TIMEOUT_MS;
env CFM_DECISION_TTL_MS;

events { worker_connections 1024; }

http {
    lua_package_path '/opt/openresty/nginx/lua/?.lua;;';
    lua_shared_dict  cfm_decisions 15m;
    lua_shared_dict sslcache 256m;

init_worker_by_lua_block {
    local sc = require "sslcollector"
    sc.start_background()
}


    # ── Real IP (shared-hosting safe) ───────────────────────────────────────
    # Trust CF-Connecting-IP ONLY from trusted proxy IP ranges.
    # If you don't use CF at all, you can remove these lines.

    #real_ip_header CF-Connecting-IP;
    #real_ip_recursive on;
    #include /opt/openresty/nginx/conf/trusted_proxies.conf;

    # Optional: helpful debug log format
    log_format cfm '$realip_remote_addr host=$host "$request" $status up=$cfm_upstream';
    access_log /opt/openresty/nginx/logs/access.log cfm;

    # ── Upstreams ──────────────────────────────────────────────────────────
    upstream cfm_challenge {
        server 127.0.0.1:9098;
        keepalive 8;
    }

    upstream cfm_apache {
        server 127.0.0.1:80;
        keepalive 32;
    }

    # ── HTTP ───────────────────────────────────────────────────────────────
    server {
        listen 9080;
        server_name _;

        set $cfm_upstream "cfm_apache";
        access_by_lua_file /opt/openresty/nginx/lua/cfm.lua;

        # Bypass Lua for verify (Go must handle /verify)
        location = /__cfm_verify {
            access_by_lua_block { return; }
            proxy_pass         http://cfm_challenge;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $realip_remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto http;
        }

        # Everything else: proxy to chosen upstream
        location / {
            proxy_pass         http://$cfm_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $realip_remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto http;
        }




location = /__ssl_debug {
    allow 127.0.0.1;
    deny all;
    content_by_lua_block {
        local d = ngx.shared.sslcache
        ngx.say("ready=", d:get("meta:ready") or "0")
        ngx.say("version=", d:get("meta:version") or "-")

        ngx.say("has e:pemcert:quic.myip.gr=", d:get("e:pemcert:quic.myip.gr") and "yes" or "no")
        ngx.say("has e:pemkey:quic.myip.gr=",  d:get("e:pemkey:quic.myip.gr") and "yes" or "no")

        ngx.say("has w:pemcert:myip.gr=", d:get("w:pemcert:myip.gr") and "yes" or "no")
        ngx.say("has w:pemkey:myip.gr=",  d:get("w:pemkey:myip.gr") and "yes" or "no")
    }
}



    }

    # ── HTTPS ──────────────────────────────────────────────────────────────
server {

    listen 9043 ssl;        # TCP
    http2 on;               # enable HTTP/2 on TCP listener

    listen 9043 quic reuseport;  # UDP QUIC
    http3 on;

    ssl_protocols TLSv1.2 TLSv1.3;  # TCP can do 1.2+1.3; QUIC uses 1.3

    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    server_name _;

    ssl_certificate     /opt/openresty/nginx/conf/selfsigned/fullchain.pem;
    ssl_certificate_key /opt/openresty/nginx/conf/selfsigned/privkey.pem;



    ssl_certificate_by_lua_block {
        local sc = require "sslcollector"
        sc.set_cert()
    }

    set $cfm_upstream "cfm_apache";
    access_by_lua_file /opt/openresty/nginx/lua/cfm.lua;

    location = /__cfm_verify {
        access_by_lua_block { return; }
        proxy_pass         http://cfm_challenge;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $realip_remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }

    location / {
        proxy_pass         http://$cfm_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $realip_remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }
}

}
