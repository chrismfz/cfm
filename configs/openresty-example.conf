# /usr/local/openresty/nginx/conf/nginx.conf
#
# OpenResty in-path WAF mode (NO CACHE) - Option A (universal, dedicated-IP safe)
#
# REQUIREMENT (IMPORTANT):
#   nftables DNAT must be PORT-ONLY (keep destination IP):
#     tcp dport 80  dnat to :9080
#     tcp dport 443 dnat to :9043
#     udp dport 443 dnat to :9043
#
# ROUTING MODEL (IMPORTANT):
#   cfm.lua sets:
#     - $cfm_pass     (actual proxy target URL)
#     - $cfm_upstream (for logging/debug only)
#
#   Examples:
#     allow (http)  -> $cfm_pass = "http://$server_addr:80"
#     allow (https) -> $cfm_pass = "https://$server_addr:443"
#     challenge     -> $cfm_pass = "http://cfm_challenge"
#     block         -> cfm.lua exits 403
#
# Origin routing:
#   - HTTP  (9080): http://$server_addr:80
#   - HTTPS (9043): https://$server_addr:443 with SNI=$host
#
# Challenge:
#   - always http://127.0.0.1:9098
#
# SSL:
#   - fallback self-signed cert
#   - per-host dynamic certs from sslcollector

user root;
worker_processes 2;

error_log /usr/local/openresty/nginx/logs/error.log warn;
pid       /usr/local/openresty/nginx/logs/nginx.pid;

# Pass env vars to workers (must be set in master env before start)
env OPENRESTY_SOCK;
env OPENRESTY_TOKEN;
env CFM_DECISION_TIMEOUT_MS;
env CFM_DECISION_TTL_MS;

events { worker_connections 1024; }

http {
    lua_package_path '/usr/local/openresty/nginx/lua/?.lua;;';

    lua_shared_dict cfm_decisions 15m;
    lua_shared_dict sslcache 256m;

    init_worker_by_lua_block {
        local sc = require "sslcollector"
        sc.start_background()
    }

    # --- Upload / buffering / timeouts ---
    client_max_body_size         2g;
    client_body_buffer_size     1m;
    client_body_timeout         300s;

    proxy_buffer_size           128k;
    proxy_buffers               32 64k;
    proxy_busy_buffers_size     256k;
    proxy_max_temp_file_size    2048m;

    large_client_header_buffers  8 64k;

    send_timeout                300s;
    keepalive_timeout           65s;

    proxy_connect_timeout       30s;
    proxy_send_timeout          600s;
    proxy_read_timeout          600s;

    # Keep as you had (for origin). Verify location overrides these to off.
    proxy_request_buffering     on;
    proxy_buffering             on;

    # --- Real IP (Cloudflare) ---
    # After this:
    #   $remote_addr        = real visitor IP
    #   $realip_remote_addr = Cloudflare edge IP (original peer)
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;
    include /usr/local/openresty/nginx/conf/trusted_proxies.conf;

    # --- Logging ---
    # client=$remote_addr is the REAL visitor (after realip)
    # peer=$realip_remote_addr is the proxy (Cloudflare edge)
    log_format cfm 'client=$remote_addr peer=$realip_remote_addr cf="$http_cf_connecting_ip" '
                   'host=$host "$request" $status up=$cfm_upstream pass=$cfm_pass dst=$server_addr:$server_port';

    # Log only challenge / verify / blocks
    map "$cfm_upstream|$uri" $log_cfm {
        default                 0;
        "~^cfm_challenge\|"     1;   # challenged traffic
        "~^cfm_block\|"         1;   # blocked traffic (only if Lua sets cfm_block)
        "~\|/__cfm_verify$"     1;   # verify endpoint
    }

    # Focused log
    access_log /usr/local/openresty/nginx/logs/access.cfm.log cfm if=$log_cfm;

    # Full access log (disabled by default; uncomment when needed)
    #access_log /usr/local/openresty/nginx/logs/access.log cfm;

    # --- Challenge upstream (fixed) ---
    upstream cfm_challenge {
        server 127.0.0.1:9098;
        keepalive 8;
    }

    # ---------------------------------------------------------------------
    # HTTP listener (DNAT 80 -> 9080)
    # ---------------------------------------------------------------------
    server {
        listen 9080;
        server_name _;

        # cfm.lua will set these per-request
        set $cfm_pass "";
        set $cfm_upstream "cfm_apache";
        access_by_lua_file /usr/local/openresty/nginx/lua/cfm.lua;

        # Verify endpoint: bypass Lua and ensure correct client identity
        location = /__cfm_verify {
            access_by_lua_block { return; }

            proxy_pass         http://cfm_challenge;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";

            proxy_set_header   Host              $host;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # With realip enabled, $remote_addr is already the REAL visitor IP
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;

            # Optional: keep CF header visible to Go side for debugging
            proxy_set_header   CF-Connecting-IP  $http_cf_connecting_ip;

            # Make POST verify reliable (avoid buffering edge cases)
            proxy_request_buffering off;
            proxy_buffering         off;

            # Never cache/store verify responses anywhere
            add_header Cache-Control "no-store" always;
        }

        # Single proxy path: cfm.lua sets $cfm_pass to challenge or origin
        location / {
            proxy_pass         $cfm_pass;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";

            proxy_set_header   Host              $host;

            # Real visitor IP
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

            proxy_set_header   X-Forwarded-Proto http;

            # Optional: pass CF header too
            proxy_set_header   CF-Connecting-IP  $http_cf_connecting_ip;
        }

        # Debug endpoint for sslcollector dict
        location = /__ssl_debug {
            allow 127.0.0.1;
            deny all;
            content_by_lua_block {
                local d = ngx.shared.sslcache
                ngx.say("ready=", d:get("meta:ready") or "0")
                ngx.say("version=", d:get("meta:version") or "-")
            }
        }
    }

    # ---------------------------------------------------------------------
    # HTTPS listener (DNAT 443 -> 9043)
    # ---------------------------------------------------------------------
    server {
        listen 9043 ssl;             # TCP
        http2 on;

        listen 9043 quic reuseport;  # UDP QUIC
        http3 on;

        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Alt-Svc 'h3=":443"; ma=86400' always;

        server_name _;

        # Fallback cert (used if sslcollector has not loaded yet)
        ssl_certificate     /usr/local/openresty/nginx/conf/selfsigned/fullchain.pem;
        ssl_certificate_key /usr/local/openresty/nginx/conf/selfsigned/privkey.pem;

        # Dynamic per-host certs from sslcollector
        ssl_certificate_by_lua_block {
            local sc = require "sslcollector"
            sc.set_cert()
        }

        # cfm.lua will set these per-request
        set $cfm_pass "";
        set $cfm_upstream "cfm_apache";
        access_by_lua_file /usr/local/openresty/nginx/lua/cfm.lua;

        # Verify endpoint: bypass Lua and ensure correct client identity
        location = /__cfm_verify {
            access_by_lua_block { return; }

            proxy_pass         http://cfm_challenge;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";

            proxy_set_header   Host              $host;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Real visitor IP (after realip)
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;

            proxy_set_header   CF-Connecting-IP  $http_cf_connecting_ip;

            proxy_request_buffering off;
            proxy_buffering         off;

            add_header Cache-Control "no-store" always;
        }

        # Single proxy path: cfm.lua sets $cfm_pass to challenge or origin
        location / {
            proxy_pass $cfm_pass;

            # Safe: only relevant when $cfm_pass is https://...
            proxy_ssl_server_name on;
            proxy_ssl_name $host;

            proxy_http_version 1.1;
            proxy_set_header   Connection "";

            proxy_set_header   Host              $host;

            # Real visitor IP
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

            proxy_set_header   X-Forwarded-Proto https;

            proxy_set_header   CF-Connecting-IP  $http_cf_connecting_ip;
        }
    }
}
