# ── cfm WAF integration snippet for nginx.conf / conf.d/cfm_waf.conf ──────────
#
# Add these to your main nginx.conf (http block):
#
#   lua_package_path "/opt/openresty/nginx/lua/?.lua;;";
#   lua_shared_dict  cfm_decisions 10m;
#
#   # Expose env vars to Lua (must be in http or top level)
#   env CFM_CHALLENGE_SECRET;   # must match Go side
#   env CFM_NGINX_TOKEN;        # must match OPENRESTY_TOKEN in cfm.conf
#   env CFM_NGINX_SOCK;         # optional, default /var/run/cfm/cfm_nginx.sock
#   env CFM_CF_DOMAINS;         # comma-separated CF-proxied domains, e.g. "example.com,foo.net"

# ── Per-server block wiring ────────────────────────────────────────────────────
#
# Option A: apply globally to all vhosts (simplest):
#
#   http {
#       ...
#       access_by_lua_file /opt/openresty/nginx/lua/cfm_access.lua;
#   }
#
# Option B: per server block (more control):

server {
    listen 9080;
    listen 9043 ssl;
    server_name _;

    # cfm WAF — runs before every proxied request
    access_by_lua_file /opt/openresty/nginx/lua/cfm_access.lua;

    # PoW verify endpoint (JS posts here after solving)
    # Must be a content_by_lua_file so it can write its own response.
    location = /cfm_verify {
        # No proxy_pass here — Lua handles the full response.
        content_by_lua_file /opt/openresty/nginx/lua/cfm_access.lua;
    }

    # Your normal proxy rules below
    location / {
        proxy_pass http://127.0.0.1:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
