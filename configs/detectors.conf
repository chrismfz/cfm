; ─────────────────────────────────────────────────────────────────────────────
; Autoblock options (per section)
; ─────────────────────────────────────────────────────────────────────────────
; BLOCK =
;   no | off | 0        → Do NOT block (default).
;   dryrun | alert      → Do not touch the firewall; just log “would block …”.
;   permanent | perm    → Block permanently (no expiry) in block_v4 / block_v6.
;   <duration>          → Block with TTL. Examples:
;                         30m, 1h, 2h, 4h, 24h, 1h30m (Go duration format).
;
; BLOCK_COOLDOWN = <duration> (optional)
;   Minimum time before the SAME IP can be blocked again by THIS section.
;   Helps avoid repeated re-blocks/noise if many alerts fire.
;   Examples: 15m, 30m, 1h. Leave unset to disable cooldown.
;
; Notes:
; - TTL blocks are automatically removed by nft timed sets when they expire.
; - “permanent” blocks remain until explicitly removed.
; - The detector section determines which IP is blocked:
;     * ssh_auth per-IP alerts: the IP is the alert key.
;     * exim_* detectors: the sink extracts the first IPv4 from sample lines
;       (or uses Extra["ip"] if the detector set it).
; - Alerts are still logged regardless of BLOCK mode.
; - Use BLOCK per section to choose different policies (e.g., permanent for
;   relay abuse, TTL for SSH, dryrun while tuning thresholds).
; ─────────────────────────────────────────────────────────────────────────────
; ── Examples ─────────────────────────────────────────────────────────────────
;
;[ssh_auth]
; … your existing options …
;BLOCK = 4h            ; Block offending SSH IPs for 4 hours
;BLOCK_COOLDOWN = 30m  ; Don’t re-block the same IP again within 30 minutes

;[exim_relays]
; … your existing options …
;BLOCK = permanent     ; Relay abuse → permanent block
;BLOCK_COOLDOWN = 1h   ; Optional: avoid duplicate blocks for an hour
;
;[exim_security]
; … your existing options …
;BLOCK = dryrun        ; Only log “would block …” while tuning rules
;BLOCK_COOLDOWN = 20m ; (optional) cooldown if you later enable blocking
; ─────────────────────────────────────────────────────────────────────────────
; ── Leniency overrides (per section)  →  [<section>.leniency] ─────────────────
;
; A companion [<section>.leniency] subsection applies a SOFTER policy to IPs
; that match a trusted geography or network (e.g. local customers who trip a
; detector). When an IP matches MATCH_COUNTRY or MATCH_ASN (OR logic), the
; leniency BLOCK / BLOCK_COOLDOWN replace the section defaults for that IP.
;
;   MATCH_COUNTRY = "GR,CY"        ; ISO codes or names, comma/space separated
;   MATCH_ASN     = "AS6799,6866"  ; optional, OR with country ("AS" optional)
;   BLOCK / BLOCK_COOLDOWN         ; softer policy, same syntax as above
;
; Reporting of a lenient match to the central API (cfm-web):
;
;   SEND_TO_API =
;     yes (default) | no   → Whether the block is reported to the API at all.
;                            Also honors the global *_SEND_TO_API switches: if
;                            API reporting is disabled server-wide, nothing is
;                            sent regardless of this value.
;
;   SEND_TO_BLOCKLIST =                (only meaningful when SEND_TO_API = yes)
;     blacklist (default)  → Report to the GLOBAL blocklist: the IP is
;                            propagated and EVERY server downloads and blocks it.
;     lenient              → Record on the central "lenient" list instead:
;                            visible for support / unblock lookups, but NEVER
;                            served to the farm (other servers do not download
;                            or block it). Use this for known-good origins you
;                            still want a short LOCAL block on, without blocking
;                            them everywhere.
;
; ── Leniency examples ──
;[exim_security.leniency]
;MATCH_COUNTRY     = "GR,CY"    ; lenient toward Greek/Cypriot customer ranges
;BLOCK             = "10m"      ; short local block instead of section default
;BLOCK_COOLDOWN    = "10m"
;SEND_TO_API       = yes        ; report it...
;SEND_TO_BLOCKLIST = lenient    ; ...but keep it local-only, not farm-wide
;
;[dovecot_auth.leniency]
;MATCH_ASN         = "AS6799"   ; a trusted local ISP
;BLOCK             = "15m"
;SEND_TO_API       = no         ; block locally, report nothing centrally
; ─────────────────────────────────────────────────────────────────────────────

[global]
DEFAULT_EVERY   = "60s"
DEFAULT_TIMEOUT = "8s"
DEFAULT_COOLDOWN = "10m"
; enrichment
ENRICH      = 1
PTR         = 1
ENRICH_DIRS = "/var/lib/cfm/maxmind"
# Signle IPs
IGNORE_IPS  = 127.0.0.1, 172.22.1.13
# CIDR subnets
# Ignore Our subnet, bogon and Docker subnets
IGNORE_NETS = 172.17.0.1/16, 10.0.0.0/8, 84.54.49.0/24
LOG_IGNORED = no

[api_abuse]
ENABLED = 1
EVERY = "2s"
WINDOW = "2m"
SAMPLE_LIMIT = 10

; Progressive mitigation thresholds (within WINDOW)
STAGE1_THRESHOLD = 10    ; observe + log only
STAGE2_THRESHOLD = 12    ; temporary challenge
STAGE3_THRESHOLD = 16    ; short block via BLOCK policy

; Stage-specific controls
STAGE2_CHALLENGE_TTL = "10m"
BLOCK = "15m"            ; stage 3 enforcement TTL (or dryrun/permanent/no)
BLOCK_COOLDOWN = "20m"
DRY_RUN = no             ; forces stage 3 to dryrun while still emitting alerts

; Allowlist controls (monitors/proxies)
ALLOW_IPS = 127.0.0.1
ALLOW_NETS = 10.0.0.0/8
ALLOW_UA_CONTAINS = uptime, healthcheck, prometheus

; Per-path exceptions (prefix match)
PATH_EXCEPTIONS = /api/v1/embed/bootstrap, /cfm-admin/api/v1/embed/bootstrap

; ─────────────────────────────────────────────────────────────────────────────
; waf_security — persistent nft block from in-path WAF hits.
;
; The in-path WAF (OpenResty/Angie Lua) already decides per request
; (logonly/challenge/block). This detector adds a SEPARATE, cross-request,
; L3/L4 decision: a source IP that keeps getting BLOCKED by the WAF becomes an
; nft-ban candidate. Blocks are logged to cfm.detectors.log, reported to
; cfm-web, and emailed like every other detector block.
; See docs/waf-autoblock-design.md.
;
; PHASE 1 SCOPE: only hits the edge itself BLOCKED (action=block) feed the
; counter — "block at WAF → nft candidate". Challenge/logonly hits never feed
; (they stay edge-only). So the family thresholds below apply to block-tier
; hits only; a family with no block-tier rules (e.g. WAF_BACKDOOR today) simply
; never fires until one of its rules is promoted to block.
;
; IMPORTANT (parser): keep values on their own — do NOT put an inline `;`
; comment after a numeric/bool/duration value on the same line. The scalar
; parser does not strip inline comments for those, so `SQLI = 1 ; note` would
; fail to parse and silently fall back to the built-in default. Put comments on
; their own line, as below.
; ─────────────────────────────────────────────────────────────────────────────
[waf_security]
ENABLED      = 1
; how often accrued hits are evaluated
EVERY        = "20s"
; rolling per-IP-per-family counter window
WINDOW       = "30m"
SAMPLE_LIMIT = 10
; 1 = observe-only (log "would block" to cfm.detectors.log + report, no real nft
; ban). 0 = enforce per BLOCK below. The shipped default enforces a SOFT TTL
; block (see BLOCK), not a permanent one — set DRY_RUN=1 if you want a pure
; watch-first burn-in instead.
DRY_RUN      = 0

; Per-IP-per-family thresholds: edge-BLOCKED hits within WINDOW that trip an
; nft ban. 0 disables that family. At threshold 1 the first block-hit bans —
; which is why the Lua per-(ip,reason) push cooldown is harmless (the first hit
; is what counts).
;
; EVERY WAF reason-family is a knob — the config key is the family name minus
; the WAF_ prefix (WAF_SQLI → SQLI, WAF_UPLOAD_FNAME → UPLOAD_FNAME). The
; detector covers the full family list from the code registry automatically
; (the ReasonFamily values in internal/webdetector/waf_rule_ids.go), so a family
; you don't list simply takes its default — you do NOT need to list them all.
; Semantics: docs/waf-autoblock-design.md.
;
; WHAT CAN ACTUALLY BLOCK IN PHASE 1: only families that have an edge-`block`
; rule, because Phase 1 feeds edge-`block` hits only. Today that is exactly
; five — SQLI (301), RCE (320), UPLOAD_FNAME (401), UPLOAD_CONTENT (402), and
; WEBSHELL (413, the proper-noun webshell drop-path subset). Every other family
; is challenge/logonly-tier, defaults to 0, and is inert in Phase 1 even if you
; set it (the action=block gate drops it) — it becomes live in Phase 2. A family
; you don't list takes its code default; today every unlisted family is
; challenge/logonly-tier and defaults to 0. The lines below are explicit for
; visibility and to arm the four ready families (WEBSHELL is deliberately held —
; see below).
SQLI           = 1
RCE            = 1
UPLOAD_FNAME   = 1
UPLOAD_CONTENT = 1
; WEBSHELL rule 413 (rule_webshell_path_known) is edge-`block` and near-zero FP
; (proper-noun drop names: c99/r57/wso/alfa/…), so a source probing for one is a
; clean autoblock candidate — but it is held OFF (0) by default, in the config
; AND in code (wafSecurityFamilies), so the 410/413 split can't silently turn a
; webshell GET-probe into a 6h nft ban. Arming it is a deliberate opt-in: set 1.
WEBSHELL       = 0
; BACKDOOR has no edge-`block` rule yet (430-438 are logonly/challenge), so this
; is inert today — it is armed to 1 so it autoblocks the moment one of its rules
; (e.g. 438) is promoted to block after that rule's own burn-in.
BACKDOOR       = 1

; Per-rule-id overrides win over the family threshold above (0 = never block
; that specific rule while its family stays active). Uncomment to use — again,
; no inline comment after the value:
;RULE_511 = 2
;RULE_437 = 0

; Allowlist (never autoblock these) — on top of the [global] IGNORE_IPS/NETS.
ALLOW_IPS  = 127.0.0.1
ALLOW_NETS = 10.0.0.0/8

; Enforcement when DRY_RUN=0. A SOFT TTL block (self-heals) is the deliberate
; first-deploy default rather than `permanent`: real protection now, and any
; surprise expires on its own within hours. Accepts <ttl> / permanent / dryrun /
; no. Promote to `permanent` once the burn-in looks clean.
BLOCK          = "6h"
BLOCK_COOLDOWN = "30m"

; Trusted geographies get an even softer tier instead of the section BLOCK:
; a GR/CY hit is likelier a compromised local host / rare FP → short temp-ban +
; surface for review. Presence of this subsection activates leniency.
[waf_security.leniency]
MATCH_COUNTRY     = "GR,CY"
;MATCH_ASN        = "9121,6799"
BLOCK             = "15m"
BLOCK_COOLDOWN    = "15m"
SEND_TO_API       = YES
SEND_TO_BLOCKLIST = lenient

