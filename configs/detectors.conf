EVERY = "20s"
WINDOW = "10m"
COOLDOWN = "20m"
LOG_PATH = ""
SAMPLE_LIMIT = 15

; thresholds
DENIED_IP   = 8
DENIED_USER = 8
ROOT_IP     = 3
SCAN_IP     = 10

; hygiene
