IGNORE_CPANEL_UTIL = 1

; per-section block policy
BLOCK = permanent
BLOCK_COOLDOWN = 30m



[health]
ENABLED = 1

; sampling / window / cooldown

EVERY = "20s"            ; sampling period
WINDOW = "2m"            ; rolling window for spikes
COOLDOWN = "15m"         ; don’t spam the same alert

; Enrichment / spike context
; ENRICH_DIRS can stay default or point to your MaxMind dirs
; ENRICH_DIRS = /etc/cfm,/var/lib/cfm/maxmind

ENRICH = 1
PTR = 1
ENRICH_DIRS = /var/lib/cfm/maxmind
SPIKE_PROBE_TOPN = 10

; CPU / RAM / DISK - 1m load > 1.2 * cores -> warn
CPU_LOAD_PCT   = 120
;percentage
RAM_USED_PCT   = 90
DISK_ROOT_PCT  = 90

; NEW: /tmp monitoring (securetmp loop)
TMP_PCT         = 85        ; alert/cleanup when /tmp >= 85%
TMP_CLEAN_OLDER = "12h"     ; delete files in /tmp older than 12h when threshold is hit

; NET spikes x times baseline (rolling avg)
CONN_TOTAL_MIN   = 100
ESTABLISHED_MIN  = 60
SYN_RECV_MIN     = 60
PORT_CONN_MIN    = 60
SPIKE_MIN_DELTA  = 10

CONN_TOTAL_SPIKE   = 5.0
CONN_EST_SPIKE     = 5.0
CONN_SYN_SPIKE     = 5.0
THROUGHPUT_SPIKE_X = 5.0
THROUGHPUT_MIN_MBPS = 60

; Absolute tripwires
CONN_TOTAL_ABS = 20000
ESTABLISHED_ABS = 8000
SYN_RECV_ABS    = 500

; Temp (if sensors)
TEMP_C_WARN = 85
TEMP_C_CRIT = 95

; SMART / RAID / ZFS
SMART_FAIL_ALERT = 1
MDADM_ALERT = 1
ZFS_ALERT = 1

; Optional per-port watch (approx via tcp local port split)
PORT_WATCH = "80,443,25,21,22,3306,465,587"
PORT_SPIKE_X = 3.0

