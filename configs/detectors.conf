# =============================================================================
# NGM — control-panel login brute-force detector
# =============================================================================
# Watches the NGM panel auth log, which NGM writes expressly for an external
# fail2ban-family detector. It is a COMBINED auth+audit log: this detector keys
# ONLY on credential-abuse events (FAIL / RATELIMIT / MFA_FAILURE / DAV_FAIL /
# PWRESET_FAILURE / RECOVERY_VERIFY_FAILURE / TOKEN_FAIL) and ignores audit verbs
# (SUCCESS / LOGOUT / MFA_SUCCESS / DAV_HOST / DAV_IMPORT_FAIL / CONTAINER_* /...).
# TOKEN_IP_REJECT is deliberately not counted (a legit token from a new IP would
# self-ban). No-ops on a non-NGM host (the log is absent).
# NGM already does per-account lockout + per-IP throttle; this adds a fleet-wide
# nft ban of the source IP. See docs/ngm-auth-detector.md.
[ngm_auth]
ENABLED = 1
EVERY = "2s"
WINDOW = "10m"
COOLDOWN = "20m"
LOG_PATH = "/var/log/ngm/auth.log"
SAMPLE_LIMIT = 16

; thresholds
AUTHFAIL_IP = 25
AUTHFAIL_USER = 15
ADMIN_IP = 5          ; stricter, for privileged roles (admin + reseller)
TOKEN_IP = 10         ; API-token brute (TOKEN_FAIL only)

; per-section block policy — watch-first (dryrun): observe + log, do NOT ban
; until burned in on a real NGM host, then flip to a TTL (e.g. 1h). Watch the
; DAV_FAIL / RATELIMIT volume especially before arming: DAV/mail clients and
; password-reset flows auto-retry, so a stale-password device or a NAT egress can
; be noisy — tune AUTHFAIL_IP to your fleet first.
BLOCK = dryrun
BLOCK_COOLDOWN = 30m


# =============================================================================
# MYSQL — brute-force / login detector
# =============================================================================
# Watches the MySQL/MariaDB error log for failed authentication attempts.
# Fires when the per-IP or per-user failure count exceeds a threshold within
# the rolling WINDOW.  Optionally blocks the offending IP via nft.
#
# Required MySQL grants: none — reads log file only, no DB connection needed.
#
# Supported log formats:
#   MariaDB / MySQL 5.7+ error log (text, one event per line)
#   LOG_PATH = auto   → auto-detect from /etc/my.cnf, /etc/mysql/my.cnf,
#                        /var/log/mysql/error.log, /var/lib/mysql/*.err …
# -----------------------------------------------------------------------------

[mysql]
ENABLED = 1

; How often to scan new lines appended to the error log.
EVERY   = 20s
; Sliding window over which failure counts are accumulated.
WINDOW  = 10m
; Minimum time between two alerts for the same IP (deduplication).
COOLDOWN = 20m
; Path to the MySQL/MariaDB error log.  Use "auto" to let CFM find it.
LOG_PATH = auto
; Maximum log lines included in the alert body (for context).
SAMPLE_LIMIT = 15
; ---- Thresholds ----
; Fire when a single remote IP causes >= N "Access denied" events in WINDOW.
DENIED_IP   = 8
; Fire when a single username causes >= N "Access denied" events in WINDOW
; (catches credential-stuffing across many IPs).
DENIED_USER = 8
; Tighter threshold for root login attempts — any IP that fails root auth
; >= N times is treated as high-priority.
ROOT_IP = 3
; Unauthenticated / aborted connections per IP (port-scan / banner-grab probe).
SCAN_IP = 10
; ---- Hygiene ----
; Don't alert on failures from 127.0.0.1 / localhost (internal apps, cron…).
IGNORE_LOCALHOST = 1
; Don't alert on the cPanel internal user 'Cpanel::MysqlUtils::Unprivileged'.
IGNORE_CPANEL_UTIL = 1
; ---- Block policy ----
; What to do when a threshold is crossed:
;   no        → log + notify only
;   dryrun    → log "would block" without touching nft
;   permanent → add to nft block set permanently
;   <duration> e.g. 24h, 7d → add with TTL
BLOCK = permanent
; Don't re-block the same IP more often than this (prevents log flooding).
BLOCK_COOLDOWN = 30m








# =============================================================================
# MYSQL GOVERNOR — processlist monitor + connection-limit enforcement
# =============================================================================
# Modes:
#   monitor  → observe & log "WOULD_…" but never kill or alter anything (default)
#   enforce  → live kills + ALTER USER.  Switch once you're happy with monitor output.
#
# Credentials: auto-detected from /root/.my.cnf (standard cPanel setup).
# For ALTER USER (alter_user action) the cfm_governor account needs CREATE USER:
#   GRANT CREATE USER ON *.* TO 'cfm_governor'@'localhost';

[mysql_governor]
ENABLED    = 1
MODE       = enforce
POLL_EVERY = 5s

; ── Connection pressure ───────────────────────────────────────────────────────
; Server max_connections = 350.
; Warn  at 70% (245),  act + sleep-reaper at 85% (297).
CONN_WARN_PCT = 70
CONN_ACT_PCT  = 85

; ── Lock fan-out kill (the "mathematica.gr" rule) ─────────────────────────────
; A single blocker holding >= 20 others for >= 60s is killed unconditionally,
; regardless of any per-user QUERY_RULES.  This is the fast-path for cascade
; incidents like the 315-waiter event in the incident file.
LOCK_FANOUT_KILL = 20
LOCK_FANOUT_TTL  = 60s

; ── Per-query runtime rules ───────────────────────────────────────────────────
; Format:  <user_pattern> : <max_runtime> : <action> [: condition]
;
;   user_pattern  exact name | prefix wildcard (*suffix, pre*fix, *) | * = everyone
;   max_runtime   duration (30s, 5m, 1h) or 0 = never touch this user
;   action        notify | kill_query | kill_connection | ignore
;   condition     lock_fanout=N  (only when blocking >= N others)
;                 conn_pct=N     (only when global connections >= N%)
;
; Rules are evaluated top-to-bottom; first match wins per query.
; Put specific users ABOVE wildcards.
;
QUERY_RULES =

    ; ── Internal / cron / import jobs: never touch ────────────────────────────
    *_cron          : 0     : ignore
    *_import        : 0     : ignore
    *_backup        : 0     : ignore

    ; ── mathemat_db (phpBB full-text search — known cascade risk) ────────────
    ; 50s  → notify (appears in cfm.mysql.log and alerts)
    ; 60s  → kill_query if already blocking 5+ others (cascade prevention)
    ; 90s  → kill_query unconditionally (LOCK_FANOUT_KILL is the 3rd net)
    mathemat_db     : 50s   : notify
    mathemat_db     : 80s   : kill_query   : lock_fanout=5
    mathemat_db     : 90s   : kill_query

    ; ── mediains_* (generous while dual-connection bug is being fixed) ────────
    ; Tighten to 60s/120s once mysqli + PDO consolidation is deployed.
    mediains_*      : 20m   : notify
    mediains_*      : 30m   : kill_query

    ; ── Magento tenants — reindex jobs are legitimately long ─────────────────
    *_mage*         : 5m    : notify
    *_mage*         : 15m   : kill_query   : lock_fanout=3
    *_mage*         : 30m   : kill_query

    ; ── WordPress tenants ────────────────────────────────────────────────────
    *_wp*           : 30s   : notify
    *_wp*           : 60s   : kill_query

    ; ── Dead-man's switch: everyone else ─────────────────────────────────────
    ; Any query running 15+ minutes on a shared server with no exemption
    ; is almost certainly a runaway.  Notify at 5m, kill at 15m.
    *               : 5m    : notify
    *               : 15m   : kill_query


; ── Per-user connection-limit rules ──────────────────────────────────────────
; Format:  <user_pattern> : max=N : <action> [: conn_pct=N]
;
;   user_pattern  same wildcard rules as QUERY_RULES
;   max=N         total connection cap (sleeping + active + locked)
;   action        notify       — log + alert only, no kill
;                 reap_sleep   — kill oldest sleeping connections above cap
;                                (InnoDB open-transaction guard always applied)
;                 alter_user   — ALTER USER MAX_USER_CONNECTIONS N so MariaDB
;                                refuses new connections at the protocol level;
;                                ALSO reaps existing sleepers above cap.
;                                Reversed automatically when user drops below cap.
;                                Requires: GRANT CREATE USER ON *.* TO 'cfm_governor'@'localhost';
;   conn_pct=N    OPTIONAL: only enforce this rule when global connections >= N%.
;                 Omit for always-active (static) enforcement.
;
; Rules are evaluated top-to-bottom; first match wins per user.
; Put specific users ABOVE wildcards.
;
; GENEROUS DEFAULTS for shared hosting:
; All limits here are deliberately high — they protect the server from a single
; tenant monopolising connections, not from legitimate traffic spikes.
; The notify-only rules give you a week of data in cfm.mysql.log before you
; decide whether to tighten anything.
;
CONN_RULES =

    ; ── Internal users: never cap ─────────────────────────────────────────────
    ; cron, import, backup users are excluded from connection limits entirely.
    ; (They are also ignored by QUERY_RULES above.)
    ; Note: alwaysExemptUsers (root, cpanel, etc.) are hard-coded in the engine
    ; and never touched regardless of rules.

    ; ── mathemat_db — hard static cap via ALTER USER ──────────────────────────
    ; In the incident file this user had 328/350 connections (94%).
    ; MariaDB will refuse new connections once it hits 80.
    ; The reap_sleep fallthrough cleans up existing sleepers above the cap.
    ; Use alter_user here because this user's leak is structural (phpBB pool).
    mathemat_db     : max=80  : alter_user

    ; ── mediains_* — connection-leak while PHP fix is in progress ─────────────
    ; Two connections per request (mysqli + PDO) means 40 cap = 20 concurrent
    ; page loads.  Generous for a news site.  Use reap_sleep (not alter_user)
    ; so we don't interrupt any in-flight requests.
    ; Lower to max=20 once the dual-connection bug is fixed.
    mediains_*      : max=40  : reap_sleep

    ; ── Magento tenants — reindexer is multithreaded ──────────────────────────
    ; 60 is generous (Magento 2 reindex uses up to ~10 threads typically).
    ; Notify only at this threshold — killing Magento sleeping conns is risky.
    *_mage*         : max=60  : notify

    ; ── WordPress tenants ────────────────────────────────────────────────────
    ; WP with persistent-object-cache (Redis/Memcached) rarely needs more than
    ; 15-20 connections.  WP without caching can spike higher under load.
    ; Start with notify at 30 so you can see what's normal on your server,
    ; then switch to reap_sleep once you know the baseline.
    *_wp*           : max=30  : notify

    ; ── All other tenants — dynamic cap under pressure only ──────────────────
    ; When the server reaches 70% of max_connections (245/350), limit every
    ; unlisted tenant to 25 sleeping connections.
    ; This is a pressure-release valve, not a constant restriction.
    ; Running connections are never killed here — sleeping only.
    *               : max=25  : reap_sleep : conn_pct=70


; ── Sleep reaper ─────────────────────────────────────────────────────────────
; Kills sleeping connections older than 3 minutes when global connections
; exceed CONN_ACT_PCT (85%).  Separate from CONN_RULES — this is a global
; sweep; CONN_RULES is per-user targeted enforcement.
; InnoDB open-transaction guard is always applied.
SLEEP_REAPER        = 1
SLEEP_REAPER_AGE    = 180s
SLEEP_REAPER_EXEMPT = proxysql_monitor, root

; ── Kill rate limits ─────────────────────────────────────────────────────────
; Hard cap on kills within KILL_WINDOW.  Applies to both QUERY_RULES kills
; and CONN_RULES reap_sleep kills.  Prevents a misconfigured rule from
; wiping out a tenant's entire connection pool.
KILL_PER_DB_PER_WINDOW = 8
KILL_TOTAL_PER_WINDOW  = 30
KILL_WINDOW            = 10m







[health]
ENABLED = 1

; sampling / window / cooldown

EVERY = "20s"            ; sampling period
WINDOW = "2m"            ; rolling window for spikes
COOLDOWN = "15m"         ; don’t spam the same alert

