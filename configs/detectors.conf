; ─────────────────────────────────────────────────────────────────────────────
; Autoblock options (per section)
; ─────────────────────────────────────────────────────────────────────────────
; BLOCK =
;   no | off | 0        → Do NOT block (default).
;   dryrun | alert      → Do not touch the firewall; just log “would block …”.
;   permanent | perm    → Block permanently (no expiry) in block_v4 / block_v6.
;   <duration>          → Block with TTL. Examples:
;                         30m, 1h, 2h, 4h, 24h, 1h30m (Go duration format).
;
; BLOCK_COOLDOWN = <duration> (optional)
;   Minimum time before the SAME IP can be blocked again by THIS section.
;   Helps avoid repeated re-blocks/noise if many alerts fire.
;   Examples: 15m, 30m, 1h. Leave unset to disable cooldown.
;
; Notes:
; - TTL blocks are automatically removed by nft timed sets when they expire.
; - “permanent” blocks remain until explicitly removed.
; - The detector section determines which IP is blocked:
;     * ssh_auth per-IP alerts: the IP is the alert key.
;     * exim_* detectors: the sink extracts the first IPv4 from sample lines
;       (or uses Extra["ip"] if the detector set it).
; - Alerts are still logged regardless of BLOCK mode.
; - Use BLOCK per section to choose different policies (e.g., permanent for
;   relay abuse, TTL for SSH, dryrun while tuning thresholds).
; ─────────────────────────────────────────────────────────────────────────────
; ── Examples ─────────────────────────────────────────────────────────────────
;
;[ssh_auth]
; … your existing options …
;BLOCK = 4h            ; Block offending SSH IPs for 4 hours
;BLOCK_COOLDOWN = 30m  ; Don’t re-block the same IP again within 30 minutes

;[exim_relays]
; … your existing options …
;BLOCK = permanent     ; Relay abuse → permanent block
;BLOCK_COOLDOWN = 1h   ; Optional: avoid duplicate blocks for an hour
;
;[exim_security]
; … your existing options …
;BLOCK = dryrun        ; Only log “would block …” while tuning rules
;BLOCK_COOLDOWN = 20m ; (optional) cooldown if you later enable blocking
; ─────────────────────────────────────────────────────────────────────────────

[global]
DEFAULT_EVERY   = "60s"
DEFAULT_TIMEOUT = "8s"
DEFAULT_COOLDOWN = "10m"
; enrichment
ENRICH      = 1
PTR         = 1
ENRICH_DIRS = "/var/lib/cfm/maxmind"
# Signle IPs
IGNORE_IPS  = 127.0.0.1, 172.22.1.13
# CIDR subnets
# Ignore Our subnet, bogon and Docker subnets
IGNORE_NETS = 172.17.0.1/16, 10.0.0.0/8, 84.54.49.0/24
LOG_IGNORED = no

[exim_queues]
ENABLED          = 1
EVERY            = "60s"
TIMEOUT          = "8s"
QUEUE_TOTAL_MAX  = 300
QUEUE_FROZEN_MAX = 100
SAMPLE_LIMIT     = 10
COOLDOWN         = "10m"


[exim_relays]
ENABLED = 1
LOG_PATH = ""
WINDOW = "15m"
EVERY  = "20s"
SAMPLE_LIMIT = 10
COOLDOWN = "10m"

; thresholds (>=)
LOCAL_USER_MAX   = 110
AUTH_USER_MAX    = 110
AUTH_IP_MAX      = 110
AUTH_USERIP_MAX  = 120
UNAUTH_IP_MAX    = 250

BLOCK = dryrun

[exim_security]
ENABLED = 1
LOG_PATH     = ""
REJECT_LOG_PATH = ""
EVERY        = "20s"
WINDOW       = "30m"
SAMPLE_LIMIT = 10
COOLDOWN     = "20m"
;RULES        = "/etc/cfm/exim_security.rules"

; Specials (per-IP / per-user counters for AUTH failures)
AUTHFAIL_IP   = 5
AUTHFAIL_USER = 5

; Core rules
AUTHFAIL           = 6
SENDER_VERIFY_FAIL = 6
RCPT_REJECT        = 6
SYNC_ERR           = 8
PROTO_ERR          = 8
NO_MAIL            = 8
DROP_ACL           = 6

; Rejectlog-focused (safe set)
RCPT_AUTH_REQUIRED     = 6
NONMAIL_CMD            = 4
NO_HELO                = 6
BAD_HELO_IMPERSONATION = 6
HELO_SYNTAX            = 6
PIPELINING             = 6

SESSION_ALL_FAILED	= 6
SLOW_FAIL_BLOCK	= 6


BLOCK = permanent
BLOCK_COOLDOWN = 10m




[postfix_security]
ENABLED = 1

# === Source (pick one mode) ===
# 1) Classic file
LOG_PATH = "/var/log/mail.log"
# or:
# 2) Journald
#JOURNAL_UNIT   = "postfix@-.service"
#JOURNAL_MATCHES = "_SYSTEMD_UNIT=postfix@-.service"
# or 3)  Docker-based source
#DOCKER_CONTAINER = mailcowdockerized-postfix-mailcow-1
# Optional: limited history στο πρώτο run + details
#DOCKER_ARGS      = --details,--tail=200

# Window + schedule
EVERY        = "20s"
WINDOW       = "30m"
SAMPLE_LIMIT = 10
COOLDOWN     = "20m"

# Enrichment (same semantics as exim)
ENRICH       = 1
PTR          = 1
ENRICH_DIRS  = "/var/lib/cfm/maxmind"

# ---- Thresholds ----
# specials (per-IP / per-user for AUTH)
AUTHFAIL_IP   = 5
AUTHFAIL_USER = 5

# rule keys (>=)
AUTHFAIL     = 6
RELAY_DENIED = 4
USER_UNKNOWN = 8
RCPT_REJECT  = 10
RBL_HIT      = 3
NONSMTP_CMD  = 4
PIPELINING   = 4
TLS_ERR      = 4

BLOCK          = permanent
BLOCK_COOLDOWN = "10m"



[postfix_queues]
ENABLED = 1

EVERY = "60s"
QUEUE_TOTAL_MAX  = 300
QUEUE_FROZEN_MAX = 200
SAMPLE_LIMIT     = 10
COOLDOWN         = "10m"

# Postfix command examples
TOTAL_CMD = "postqueue -p | tail -n +2 | awk 'NF && !/Mail queue is empty/' | wc -l"
LIST_CMD  = "postqueue -p"
#Examples for docker
#TOTAL_CMD = "docker exec mailcowdockerized-postfix-mailcow-1 postqueue -p | tail -n +2 | awk 'NF && !/Mail queue is empty/' | wc -l"
#LIST_CMD  = "docker exec mailcowdockerized-postfix-mailcow-1 postqueue -p"

[postfix_relays]
ENABLED = 1
#DOCKER_CONTAINER = mailcowdockerized-postfix-mailcow-1
# Optional: limited history στο πρώτο run + details
#DOCKER_ARGS      = --details,--tail=200

LOG_PATH     = "/var/log/mail.log"
EVERY        = "5s"
WINDOW       = "15m"
SAMPLE_LIMIT = 10
COOLDOWN     = "10m"

# Thresholds (>=)
LOCAL_USER_MAX   = 50
AUTH_USER_MAX    = 50
AUTH_IP_MAX      = 80
AUTH_USERIP_MAX  = 40
UNAUTH_IP_MAX    = 20

ENRICH      = 1
PTR         = 1
ENRICH_DIRS = "/var/lib/cfm/maxmind"




[ssh_auth]
ENABLED = 1
; mode is journal (systemd) or file
MODE = journal
JOURNAL_UNIT = sshd.service
LOG_PATH = ""
EVERY = "20s"
WINDOW = "15m"
SAMPLE_LIMIT = 10
COOLDOWN = "20m"

; thresholds - different per user and IP. useful for distributed attacks
AUTHFAIL_IP = 8
AUTHFAIL_USER = 8
DDOS_IP = 8

BLOCK = permanent
BLOCK_COOLDOWN = 30m


[dovecot_auth]
ENABLED = 1
; mode is journal (systemd), file or docker
MODE = journal
JOURNAL_UNIT = dovecot.service
LOG_PATH = ""

;DOCKER_CONTAINER = mailcowdockerized-dovecot-mailcow-1
;DOCKER_ARGS      = --details,--tail=200

EVERY = "20s"
WINDOW = "15m"
SAMPLE_LIMIT = 10
COOLDOWN = "20m"

; thresholds tuned similarly to ssh_auth
AUTHFAIL_IP   = 10
AUTHFAIL_USER = 10

; autoblock policy for this detector
BLOCK = permanent
BLOCK_COOLDOWN = 30m


[ftpd]
ENABLED = 1
; MODE: auto|file|journal
MODE = auto
LOG_PATH = ""

EVERY = "20s"
WINDOW = "15m"
COOLDOWN = "20m"
SAMPLE_LIMIT = 10

; thresholds (>=)
AUTHFAIL_IP   = 8
AUTHFAIL_USER = 8

; use your existing per-section block knobs
BLOCK = permanent
BLOCK_COOLDOWN = 30m

[modsec]
ENABLED = 1
