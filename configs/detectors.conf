; cPanel domlogs (nested)
;[webdetector]
;MODE = folder
;LOG_DIR = /usr/local/apache/domlogs
;RECURSIVE = 1
;GLOB = *
;START_AT_END = 1   ; 1=tail only new lines (default), 0=replay existing lines once

; Virtualmin (Apache per-domain logs)
; files like:
;   domain.tld_access_log
;   domain.tld_error_log
;   (rotated: domain.tld_access_log-YYYYMMDD.gz  -> ignored)

;[webdetector]
;MODE = folder
;LOG_DIR = /var/log/virtualmin
;RECURSIVE = 0
;GLOB = *_access_log
; or, if you also want to include error logs for 4xx/5xx signals:
; GLOB = *_log



[webdetector]
ENABLED      = 1
MODE         = file
LOG_PATH     = "/var/log/apache2/access_cfm_tsv.log"
; LOG_PATH = "/var/log/nginx/access_cfm_combined.log"
; START_AT_END = 1   ; 1=tail only new lines (default), 0=replay existing lines once

EVERY        = "5s"
WINDOW       = "120s"
COOLDOWN     = "10m"
SAMPLE_LIMIT = 20

# Enrichment
ENRICH       = 1
PTR          = 1
ENRICH_DIRS  = "/var/lib/cfm/maxmind"

# Long window factor - 10 means the short window x 10 (1200 seconds)
LONG_FACTOR  = 10
MIN_SCORE    = 0.60

# Sqlite DB
HISTORY_RETENTION_DAYS = 7
HISTORY_PRUNE_EVERY = 1
# Hard row cap on history_events (newest kept), enforced by the hourly
# pruner in addition to the day-based retention — bounds the DB on busy
# boxes where even a few retention days means millions of rows. ~1M rows
# is roughly 150-200 MB on disk. 0 disables the cap.
HISTORY_MAX_ROWS = 1000000

IP404_COUNT = 250
IP403_COUNT = 150
AGENT_LIST  = "curl,wget,python-requests,Go-http-client,spider,FacebookExternalHit"
AGENT_COUNT = 20

BLOCK = 2h
BLOCK_COOLDOWN = 30m

# new
MALPATH_COUNT = 20
MALPATH_FILE = /etc/cfm/webdetector_malpaths.txt

IP40X_COMBO = 120
IP40X_UNIQUE_PATHS = 20
# optional:
IGNORE40X_PREFIXES = "/.well-known/,/robots.txt,/favicon.ico,/sitemap"


; =============================================================================
; CFM WebDetector — Challenge Configuration
; =============================================================================
; Copy this file to /etc/cfm/detectors.conf (or include path) on each server.
; Sections:
;   1.  Network listeners
;   2.  Authentication
;   3.  Logging & notifications
;   4.  Abuse firewall
;   5.  Challenge session
;   6.  Path-based triggers      (high-signal, low FP)
;   7.  Rate / behaviour triggers (threshold-based)
;   8.  Per-IP heuristics        (unique paths, unique hosts)
;   9.  Per-vhost heuristics     (unique paths)
;  10.  Panic / bypass lists
;  11.  Suspicious-vhost auto mode (score + uniqIP)
;  12.  Exclusions
;  13.  OpenResty in-path mode
;  14.  Ancillary detectors
; =============================================================================


; -----------------------------------------------------------------------------
; 1. NETWORK LISTENERS
; -----------------------------------------------------------------------------
; Port the challenge HTTP server binds to on localhost (plain HTTP; the edge
; proxies to it as the cfm_challenge upstream). Must match the upstream in the
; OpenResty/Angie config. The legacy HTTPS listener (9099, daemon-terminated
; TLS for the retired per-IP challenge DNAT) is gone.
CHALLENGE_HTTP_LISTEN  = 127.0.0.1:9098


; -----------------------------------------------------------------------------
; 2. AUTHENTICATION
; -----------------------------------------------------------------------------
; Shared secret between cfm and the browser challenge HMAC.
; cfm auto-generates a strong random token on first startup and writes it back
; here — no manual action needed.  To rotate, set this to "placeholder" and
; restart the daemon.
CHALLENGE_TOKEN = placeholder


; -----------------------------------------------------------------------------
; 3. LOGGING & NOTIFICATIONS
; -----------------------------------------------------------------------------
; CHALLENGE_LOG    — write per-event challenge log (1=on, 0=off)
; CHALLENGE_NOTIFY — send external notifications on events (1=on, 0=off)
CHALLENGE_ACCESS_LOG = /var/log/cfm/challenge.access.log
CHALLENGE_LOG    = 1
CHALLENGE_NOTIFY = 0


; -----------------------------------------------------------------------------
; 4. ABUSE FIREWALL
; -----------------------------------------------------------------------------
; Bots that hammer the challenge endpoint itself get hard-blocked in nftables.
;
;   WINDOW  — sliding window for counting bad responses
;   BAD_N   — number of bad responses within WINDOW before hard-block fires
;   BLOCK_TTL  — how long the firewall rule stays active
;   COOLDOWN   — after block expires, how long before the IP can be blocked again
CHALLENGE_ABUSE_ENABLED  = 1
CHALLENGE_ABUSE_WINDOW   = 10s
CHALLENGE_ABUSE_BAD_N    = 18
CHALLENGE_ABUSE_BLOCK_TTL = 2h
CHALLENGE_ABUSE_COOLDOWN = 30m


; -----------------------------------------------------------------------------
; 5. CHALLENGE SESSION
; -----------------------------------------------------------------------------
; Challenge session model:
; CHALLENGE_COOKIE_LIFE is the real browser clearance lifetime. A valid
; clearance cookie (cfm_clearance on web, cfm_clearance_p<port> on panel
; ports) is host/scope/IP-bound and should be the authoritative pass
; mechanism after solving a challenge.
;
; OPENRESTY_OK_IP_TTL is only an optional server-side grace cache for the same
; IP+host+scope. Set it to 0 for strict cookie-only behavior. If enabled, keep
; it short, because it can allow another browser/profile from the same IP to
; pass without its own cookie.
;
; CHALLENGE_COOLDOWN controls challenge/rechallenge suppression and should not
; be treated as the same thing as cookie lifetime.

; CHALLENGE_COOLDOWN   — after an IP is challenged, suppress re-challenge for
;                        this duration (prevents loop on legitimate users).
; CHALLENGE_COOKIE_LIFE — how long a solved-challenge cookie remains valid.
; OPENRESTY_OK_IP_TTL  — how long cfm caches a "passed" decision for OpenResty.
;                        Should match CHALLENGE_COOKIE_LIFE.
CHALLENGE_COOLDOWN    = 45m
CHALLENGE_COOKIE_LIFE = 45m
OPENRESTY_OK_IP_TTL   = 10m

; CHALLENGE_COOKIE_REFRESH — sliding clearance for active sessions.
;   1 (default) = on every accepted request, OpenResty/Angie re-mints the
;                 clearance cookie with a fresh exp = now + CHALLENGE_COOKIE_LIFE.
;                 An idle tab in cPanel/webmail/phpMyAdmin will not get
;                 re-challenged mid-session as long as the user is active.
;   0           = strict fixed expiry. The cookie's signed exp is whatever was
;                 baked at first solve; once it hits, re-challenge regardless
;                 of activity. Use this if you want a hard ceiling per solve.
; Reload the cfm daemon (or SIGHUP) after changing this — the knob is published
; to OpenResty via /var/lib/cfm/lua/cfm_bridge_config.lua at daemon start.
CHALLENGE_COOKIE_REFRESH = 1

; ORIGIN_KEEPALIVE — pool edge-proxy → Apache backend connections.
;   0 (default) = a fresh TCP connection (plus a full upstream TLS handshake
;                 on 443) is opened to Apache for EVERY proxied request.
;   1           = allow-traffic routes through the cfm_origin_* upstream
;                 pools (openresty.conf/angie.conf + cfm_origin_ka.lua):
;                 port 80 is Lua-pooled; port 443 is NEVER pooled (per-request
;                 TLS connection, SNI from proxy_ssl_name $host). nginx-core's
;                 native upstream keepalive reuses by peer address and is
;                 SNI-blind (ON by default since nginx 1.29.7), so it is
;                 explicitly disabled on 443 (keepalive 0, OpenResty); HTTPS TLS
;                 session reuse is disabled too (proxy_ssl_session_reuse off).
;                 Pooling 443 would let a hostA connection serve hostB -> Apache
;                 421 Misdirected Request on shared-vhost boxes. The knob is
;                 therefore safe to run fleet-wide. See docs/proxy-performance.md
;                 ("Why HTTPS is not pooled").
; Published via /var/lib/cfm/lua/cfm_bridge_config.lua on daemon start/reload;
; the edge Lua re-reads it within ~10s — no proxy reload needed. This is the
; ONLY switch. Safety interlock: routing to the pools also requires the live
; proxy conf to declare them (current openresty.conf/angie.conf set the
; $cfm_origin_ka_conf sentinel) — with an older live conf the knob stays
; inert instead of proxying to a nonexistent upstream. Watch uct= in the
; access log drop toward 0 on warm HTTP (port 80) traffic once enabled, and
; grep error.log for "[cfm_origin_ka]" — each worker logs its effective state
; once per port ("HTTP(80) origin pooling active" / "origin port 443:
; per-request connection, never pooled …"). See docs/proxy-performance.md.
ORIGIN_KEEPALIVE = 0

; Idle seconds a pooled backend connection may sit before retirement (port-80
; pool only; 443 is never pooled). MUST stay below Apache's KeepAliveTimeout
; (EA4/cPanel default 5s) so Apache never closes a connection the edge still
; considers fresh. Clamped to 1-60.
ORIGIN_KEEPALIVE_IDLE_SEC = 3

; Requests served per pooled port-80 connection before it is recycled.
ORIGIN_KEEPALIVE_MAX_REQS = 1000

; PANEL_WAF_MODE / PANEL_DECISION_MODE — panel-port (cPanel/WHM/webmail) enforcement.
; The edge unification runs the SAME WAF ruleset and the SAME per-IP/vhost bridge
; decision on the panel ports that the web edge runs, via cfm_panel.lua. Each has
; three modes:
;   off      = the probe never runs on panel ports (no WAF / no bridge consult).
;   logonly  = the probe runs and RECORDS what it would do
;              (`[cfm_panel_waf] logonly=…` / `[cfm_panel_decision] logonly=…` in
;              the edge error log; surfaced by the waf_fp_hunt tool) but never
;              blocks, denies, or challenges. Use this to gather false-positive
;              data before enforcing.
;   enforce  = a HIGH-CONFIDENCE hit acts: a WAF `block`-tier match or a bridge
;              `block` verdict (ip/vhost/rule) → hard 403 deny. Only the block
;              tier acts — logonly-tier hits stay observe-only and challenge-tier
;              hits are left to the existing panel challenge (so a panel client is
;              never caught in a WAF-driven challenge loop).
; DEFAULT is enforce (and an absent key, or an older daemon that predates these,
; also resolves to enforce): CFM ships panel enforcement ON so a fleet gets it
; without editing every node's config. If ONE node develops a false positive,
; set the offending mode to `logonly` (to keep observing) or `off` (to disable)
; on THAT node and reload the cfm daemon — the change reaches the edge within
; ~10s, no proxy reload. Self-IPs and [global] IGNORE_IPS/IGNORE_NETS are always
; skipped, `deny` carries no redirect (cannot loop), and the probe is fail-open
; (any WAF/bridge error → normal flow, no deny), so enforce cannot lock an admin
; out of WHM/cPanel on a fault — only a genuine block verdict denies. The env
; vars CFM_PANEL_WAF / CFM_PANEL_DECISION override this per-worker as an emergency
; kill switch (env wins). See docs/edge-unification-plan.md Phase 4.
PANEL_WAF_MODE = enforce
PANEL_DECISION_MODE = enforce

; PANEL_FP_POLICY_MODE — panel-port consult of the fleet-armed fingerprint
; policy (cfm_panel.lua step 2f). The same operator-armed per-fingerprint
; policy the web edge enforces at cfm.lua Step 0c also covers the panel ports:
; in `enforce` (the default, same ladder and rationale as the two modes above)
; an armed `deny` 403s that TLS bucket on :2083/:2087/:2096 too; `logonly`
; records `[cfm_panel_fppolicy] logonly=would_deny`; `off` skips the lookup.
; Challenge-tier fingerprints are OBSERVE-ONLY on panel ports regardless of
; mode (the panel has no per-request challenge serve — loop rationale in
; cfm_panel.lua 2e). The global FP_POLICY = 0 kills this consult too, and
; self-IPs / IGNORE_NETS never reach the lookup. Env override:
; CFM_PANEL_FP_POLICY.
PANEL_FP_POLICY_MODE = enforce

; POST_CLEARANCE_CADENCE — edge post-clearance nav-cadence shadow (cfm_pcw, the
; Track-2 traffic-classifier B2 signal). A client that SOLVED the challenge is
; waved to origin at cfm.lua Step 2b WITHOUT the per-IP/vhost decision RPC, so a
; solver-farm that keeps pulling pages after clearing is invisible to in-path
; enforcement. This counts a cleared identity's top-level navigations per 60s
; window and, when one sustains a human-implausible rate, logs a
; `[cfm_pcw] post_clearance_burst … verdict=would_harden|would_deny` line to the
; edge error log (read via edge_error_tail) — pure MEASUREMENT, never blocks /
; challenges / changes flow.
;   1 (default) = the shadow runs.
;   0           = disabled (the Step-2b observer is skipped entirely).
; Published via /var/lib/cfm/lua/cfm_bridge_config.lua on daemon start/reload; the
; edge re-reads it within ~10s — no proxy reload. (Was formerly the CFM_PCW env
; kill-switch; moved here so the toggle lives in config like the others.)
POST_CLEARANCE_CADENCE = 1

; FP_POLICY — fleet-armed enforcement policies (master plan E3, Phase C node
; slice + the policy-kinds follow-up). The daemon pulls the operator-armed
; policies from cfm-web on the agent channel (needs API_URL + token in
; cfm.conf; ~60s cadence). THREE target kinds ride the one feed:
;   - per-FINGERPRINT (deny / challenge / challenge_v2): answers the edge's
;     /nginx/fppolicy lookups. `deny` 403s BEFORE the clearance fast-path (a
;     farm that solves is still denied); challenge/challenge_v2 are a
;     challenge FLOOR for uncleared clients (valid clearance passes — the
;     floor is satisfied by solving).
;   - per-COUNTRY / per-ASN (challenge tiers ONLY — a geo deny does not exist
;     by doctrine and is dropped even if a feed ever carried one): a
;     challenge floor applied daemon-side on the per-IP decision path (needs
;     the MaxMind country/ASN mmdbs the daemon already keeps). Verified good
;     bots and Challenge Access allow-list entries are still exempted.
;   1 (default) = the armed actions apply. With nothing armed centrally this
;                 is a no-op — arming is the operator's explicit,
;                 permission-gated act in cfm-web.
;   0           = node-wide kill switch for ALL kinds: the daemon answers "no
;                 action" (fingerprint, country and ASN alike) AND the edge
;                 skips Step 0c entirely (no tlsfp tuple, no md5, no dict, no
;                 lookups — published via cfm_bridge_config.lua, applies
;                 within ~10s, no proxy reload). The pull keeps running so
;                 re-arming is instant.
FP_POLICY = 1

; FP_POLICY_ALLOW_FPS — comma-separated fingerprint ids (8-hex, as shown in
; cfm-web / the solver-farm findings) this node must NEVER enforce a policy
; on — the per-id operator escape hatch, same spirit as the solver-farm
; ALLOW_FPS. Case-insensitive.
;FP_POLICY_ALLOW_FPS = deadbeef, c0ffee12

; SITE_CACHE — master KILL SWITCH for per-vhost edge caching (Site Cache; see
; docs/site-cache-design.md). DEFAULT ON (1) — but this is NOT an opt-in: the
; per-vhost policy store is empty by default, so nothing caches anywhere until an
; operator (or a scoped cPanel user, through the API) explicitly arms a vhost
; via the site-cache API / CLI. Arming a vhost is the single opt-in; this
; switch only lets you turn ALL caching off at once, on this node. Published to
; the edge via cfm_bridge_config.lua about 15s after you save this file (the
; daemon picks the edit up by itself; neither it nor the proxy needs a reload):
;   1 = honor the per-vhost policy (armed vhosts cache; the default).
;   0 = panic button — cfm_cache.lua stops caching and stamping on this node
;       within ~15s (no feed poll, no cache gate, no X-CFM-Cache header, no
;       stats push), WITHOUT disarming any vhost, so re-arming is instant.
;       Setting it back to 1 resumes each vhost's cache as it was, including
;       objects cached before the switch-off: if you pulled it because
;       something wrong got cached: run `cfm webtop site-cache purge --all`,
;       then reload the edge proxy WHILE THIS IS STILL 0, then set it back
;       to 1. While the switch is 0 the workers do not poll the policy feed,
;       so without that reload each one would serve the pre-purge objects
;       again for up to ~60s after the restore (docs/site-cache-runbook.md §8).
; (Static-asset caching runs behind this gate; the micro-cache of pages also
; needs MICRO_CACHE_ENFORCE below.)
SITE_CACHE = 1

; MICRO_CACHE_ENFORCE — Tier B (micro-cache of anonymous pages) ENFORCE gate.
; DEFAULT ON (1) since 2026-09-23. Like SITE_CACHE this is a kill switch, not
; the opt-in: the per-vhost policy store is empty by default, and a page is
; micro-cached only on a vhost whose micro tier an operator (or a scoped cPanel
; user) armed. Before arming micro on a new kind of app (a shop, a membership
; site), run steps 6-7 of the on-box checklist in docs/site-cache-design.md §5.7
; on it: check with the debug stamp that its logged-in, cart and form pages say
; microcache=bypass:<reason>, and add its session cookies with --auth-cookies.
; The live edge conf must carry the Tier B rails (the checklist's step 1);
; without its location / sentinel micro never routes, whatever this says.
; Published to the edge via cfm_bridge_config.lua ~15s after you save this
; file (no reload):
;   0 = dry-run on this node (verdict on the observe header only, nothing
;       micro-cached, no vhost disarmed; the debug X-CFM-Cache header still
;       shows the would-cache verdict: curl -H "X-CFM-Cache-Debug: 1" against
;       the edge's :9043 listener, from the box, its own IPs or
;       IGNORE_IPS / IGNORE_NETS)
;   1 = enforce (an armed + anonymous + cacheable GET/HEAD over HTTPS, on a
;       Step-4 plain allow, is served from its @cfm_micro_<n>s bucket; a
;       cfm_clearance holder is not micro-cached; SITE_CACHE=0 still overrides)
;       [default]
; Operator guide: docs/site-cache-runbook.md.
MICRO_CACHE_ENFORCE = 1

; CHALLENGE_V2_PASSIVE — ChallengeV2 Rung 1: the challenge page reports
; PASSIVE humanity signals with the verify POST (webdriver flag, WebGL
; renderer, window/touch coherence, input-event counts — nothing visible to
; the user, no puzzle) and the daemon scores them. Governed by the D5
; guardrails (docs/abuse-defense-master-plan.md §4): a solve can FAIL only on
; positive headless evidence — a missing payload or missing signals never
; convicts — and a failing score has TEETH only for a fingerprint the
; operator armed `challenge_v2` in cfm-web (the solve then earns no
; clearance; the page reloads into a fresh challenge, retry-able). For
; everyone else a would-fail score is shadow: one
; `signal=humanity verdict=would_v2` line in cfm.abuse_shadow.log (rides
; ABUSE_SHADOW). Every scored solve logs `hs=` + `tells=` on its
; cfm.challenges.log solve line.
;   1 (default) = score every solve; enforce for armed-challenge_v2 fps.
;   0           = the rung is off entirely (no scoring, no hs=, no gate).
CHALLENGE_V2_PASSIVE = 1

; CHALLENGE_V2_FAIL_SCORE — the fail threshold (default 100). Calibrated so
; ANY single medium-confidence tell passes (a SwiftShader renderer alone is a
; real person on RDP/VDI at 60); only certain evidence (navigator.webdriver,
; a HeadlessChrome UA token — 100 each) or a corroborated combination fails.
; Raise to be more lenient; do not lower below 100 without reviewing the tell
; weights in internal/webdetector/challenge_v2.go.
;CHALLENGE_V2_FAIL_SCORE = 100

; CHALLENGE_V2_DEBUG — when 1, the verify response carries an `X-CFM-HS`
; header with the solve's humanity score, so an operator can watch their own
; scoring live from browser DevTools. Off by default (0): the header teaches
; a signal-aware farm its own score.
;CHALLENGE_V2_DEBUG = 0

; OPENRESTY_OK_IP_TTL — optional same-IP+host+scope anti-loop grace after solve.
;                        0 = cookie-only, recommended for hardened clearance.
;                        Keep very short if enabled, e.g. 10s-60s.
;                        Do NOT match CHALLENGE_COOKIE_LIFE unless you want
;                        same-IP browsers to share challenge clearance.


; -----------------------------------------------------------------------------
; 6. PATH-BASED TRIGGERS  (high-signal, very low false-positive rate)
; -----------------------------------------------------------------------------
; If a request URI matches any line in CHALLENGE_PATHS_FILE, the IP is
; immediately challenged.  Typical entries: webshells, dotfile probes,
; exploit filenames, scanner fingerprints.
;
;   PATHS_COUNT — hits within the window required before challenging.
;                 1 = first hit triggers (recommended for high-signal paths).
;   PATHS_TTL   — how long the IP stays in the "challenged" set.
;                 Can be short because CHALLENGE_COOLDOWN handles the rest.
CHALLENGE_PATHS      = 1
CHALLENGE_PATHS_FILE = /etc/cfm/webdetector_malpaths.txt
CHALLENGE_PATHS_COUNT = 1
CHALLENGE_PATHS_TTL  = 10m


; -----------------------------------------------------------------------------
; 7. RATE / BEHAVIOUR TRIGGERS  (threshold-based, tune per traffic profile)
; -----------------------------------------------------------------------------
; All thresholds are measured per-IP within the detector window.
; Set to 0 to disable a specific trigger.
;
;   RPS_TOTAL_MIN   — total req/sec to trigger (catch high-volume bots)
;   RPS_4XX_MIN     — 4xx-only req/sec (scanning / probing pattern)
;   RPS_5XX_MIN     — 5xx-only req/sec (exploit / stress pattern)
;   ERR_RATIO_MIN   — fraction of requests that are 4xx/5xx (0.00–1.00)
;                     0.99 = trigger only when nearly all requests error out
;   POST_RATIO_MIN  — fraction of POST requests; 0 = disabled
;                     Enable (e.g. 0.8) if login-bruteforce is a problem
;   NO_UA_MIN       — requests with empty/missing User-Agent before challenge
;   HTTP10_MIN      — HTTP/1.0 requests before challenge (real browsers never use it)
CHALLENGE_RPS_TOTAL_MIN  = 15.0
CHALLENGE_RPS_4XX_MIN    = 10.0
CHALLENGE_RPS_5XX_MIN    = 0.9
CHALLENGE_ERR_RATIO_MIN  = 0.99
CHALLENGE_POST_RATIO_MIN = 0
CHALLENGE_NO_UA_MIN      = 5
CHALLENGE_HTTP10_MIN     = 1

; IP_SCORE_RULES controls score-based actions from webdetector IP scoring.
; Format: action:min_score pairs, comma-separated.
; Allowed actions: block, challenge
; Example:
;   IP_SCORE_RULES = block:0.90,challenge:0.75
; Behavior:
;   - First matching rule (highest min_score wins) is applied.
;   - If empty/unset, score-based IP actions are disabled (safe default).
;   - Useful for older setups: no rule means this path does nothing.
; Score calculation (short-window, per IP):
;   score = rps_points + vhost_points, capped at 1.0
;   rps_points:
;     rps >= 5.0     -> +0.6 (hi_rps)
;     rps >= 1.0     -> +0.4 (med_rps)
;     rps >= 0.1     -> +0.2 (low_rps)
;   vhost_points:
;     vhosts >= 10   -> +0.3 (many_vhosts)
;     vhosts >= 3    -> +0.2 (multi_vhosts)
; Notes:
;   - req count is tracked for context/history but does not currently add score.
;   - hard abuse reasons (404/403/403waf/agent/malpath/40x_combo floods) bypass
;     this score path and can still propose immediate block.
;IP_SCORE_RULES = block:0.90,challenge:0.75


; -----------------------------------------------------------------------------
; 8. PER-IP HEURISTICS
; -----------------------------------------------------------------------------
; --- Unique paths per IP ---
; Flags IPs that crawl many distinct URLs — classic scanner/scraper pattern.
;   MIN — distinct paths seen within TTL before trigger fires
;   TTL — sliding window for path counting
;   CAP — hard cap; stop counting once reached (memory guard)
CHALLENGE_IP_UNIQPATHS_ENABLED = 1
CHALLENGE_IP_UNIQPATHS_MIN     = 220
CHALLENGE_IP_UNIQPATHS_TTL     = 20m
CHALLENGE_IP_UNIQPATHS_CAP     = 512

; --- Unique hosts per IP ---
; Flags IPs that hit many different vhosts — typical mass-scanner pattern.
;   MIN — distinct vhosts within TTL before trigger fires
;   TTL — sliding window
;   CAP — hard cap
CHALLENGE_IP_UNIQHOSTS_ENABLED = 1
CHALLENGE_IP_UNIQHOSTS_MIN     = 10
CHALLENGE_IP_UNIQHOSTS_TTL     = 30m
CHALLENGE_IP_UNIQHOSTS_CAP     = 120


; -----------------------------------------------------------------------------
; 9. PER-VHOST HEURISTICS  (unique path diversity across all IPs on one vhost)
; -----------------------------------------------------------------------------
; Useful for detecting distributed scanners where no single IP stands out but
; the vhost collectively sees an abnormal URL surface.
;   MIN — unique paths across all IPs within TTL before challenge fires
;   OFF — hysteresis lower bound (stop challenging when paths drop below this)
;   TTL — sliding window
;   CAP — stop counting at this value (early-stop, memory guard)
CHALLENGE_VHOST_UNIQPATHS_ENABLED = 1
CHALLENGE_VHOST_UNIQPATHS_MIN     = 1500
CHALLENGE_VHOST_UNIQPATHS_OFF     = 900
CHALLENGE_VHOST_UNIQPATHS_TTL     = 20m
CHALLENGE_VHOST_UNIQPATHS_CAP     = 5000


; -----------------------------------------------------------------------------
; 10. PANIC / BYPASS LISTS
; -----------------------------------------------------------------------------
; CHALLENGE_VHOST        — comma-separated vhosts in permanent manual panic mode
;                          (every request gets challenged, regardless of score).
;                          Supports trailing-label wildcards (label.*) and
;                          leading (*.domain). The default below force-challenges
;                          the cPanel/WHM/webmail service subdomains — a safe,
;                          high-value default on cPanel boxes and inert elsewhere
;                          (nothing matches). Edit/clear it for non-cPanel hosts.
; CHALLENGE_VHOST_IGNORE — vhosts excluded from auto-mode score tracking.
;                          Use for internal APIs, monitoring endpoints, etc.
;                          Operator-specific — leave empty by default.
; CHALLENGE_HOST_BYPASS  — absolute override: never challenge these hosts under
;                          any rule (wins over all other triggers).
;                          Operator-specific — leave empty by default.
CHALLENGE_VHOST        = webmail.*, whm.*, cpanel.*
CHALLENGE_VHOST_IGNORE =
CHALLENGE_HOST_BYPASS   =


; -----------------------------------------------------------------------------
; 11. SUSPICIOUS-VHOST AUTO MODE
; -----------------------------------------------------------------------------
; Automatically challenges all traffic to a vhost when it looks under attack,
; based on two independent signals that can each trigger on their own:
;
;   A) SCORE — a weighted blend of error ratio, bot UA ratio, bruteforce-like
;              POST patterns, and path diversity.  Range 0.0–1.0.
;
;   B) UNIQIP — raw count of distinct IPs hitting the vhost within the window.
;               Catches DDoS / distributed bot swarms that score individually low.
;
; Shared hysteresis parameters:
;   SCORE_ON / SCORE_OFF  — challenge fires above ON, drops below OFF.
;                           Widen the gap to reduce flapping (lalashoes pattern).
;   MIN_UNIQIP            — minimum distinct IPs required before score is even
;                           evaluated (prevents false triggers on tiny sites).
;   HOLDDOWN              — minimum time challenge stays ON after trigger, even if
;                           score/uniqIP falls back below threshold immediately.
;                           Prevents bots from simply pausing to evade.
CHALLENGE_SUSPICIOUS_VHOST           = 1
CHALLENGE_SUSPICIOUS_VHOST_SCORE_ON  = 0.72   ; raised from 0.68 to reduce sensitivity
CHALLENGE_SUSPICIOUS_VHOST_SCORE_OFF = 0.60   ; lowered from 0.64 to widen hysteresis gap
CHALLENGE_SUSPICIOUS_VHOST_MIN_UNIQIP = 60    ; raised from 35 — avoids false triggers on small flash traffic
CHALLENGE_SUSPICIOUS_VHOST_HOLDDOWN  = 25m   ; raised from 15m — bots won't outlast it

; --- Volume floor (request-rate) ---
; Adds the request-RATE dimension the score itself ignores at vhost scale (its
; refs are server-scale, so per-vhost RPS barely moves it). A vhost below MIN_RPS
; cannot auto-arm via the SCORE path however botty its ratios look. It does NOT
; gate the UniqIP modes below (uniqip_on/max) — those exist for DISTRIBUTED
; attacks where low per-vhost rate is expected. LOG-ONLY FIRST: with ENFORCE=0
; nothing changes — every SCORE-path trip that
; WOULD fall below the floor is logged as action=would_suppress_below_rps_floor in
; the challenge log, so you can pick the floor from real numbers, then set
; ENFORCE=1 to actually suppress. 0 disables the floor entirely (default).
CHALLENGE_SUSPICIOUS_VHOST_MIN_RPS         = 0   ; e.g. 2.0 to start measuring; 0 = off
CHALLENGE_SUSPICIOUS_VHOST_MIN_RPS_ENFORCE = 0   ; 0 = log-only (burn-in), 1 = enforce

; --- Abuse-shadow: LOG-ONLY entity-level abuse signals (docs/webdetector-refactor.md) ---
; Writes structured lines to /var/log/cfm/cfm.abuse_shadow.log — NOTHING here
; challenges or blocks. Signal C (rate_outlier) flags an IP whose request rate is
; a large multiple of its vhost's OWN median per-IP rate (the concentrated shape,
; e.g. the 2 residential IPs @ ~62x median on www.e-vafeiadis.gr). ASN-agnostic by
; design; datacenter-ASN is only an ADDITIVE logged tag (origin is never
; innocence). Verified good bots (Googlebot/Bingbot via FCrDNS) are marked exempt.
; Tune the knobs from the log, then a later phase promotes it to a real per-IP
; challenge. Read the shadow log with the abuse_shadow MCP tool (planned).
ABUSE_SHADOW                 = 0    ; master log-only switch
ABUSE_SHADOW_RATE_OUTLIER    = 0    ; Signal C (per-IP rate outlier vs vhost median)
ABUSE_SHADOW_DATACENTER      = 0    ; log the datacenter-ASN tag alongside (additive only)
ABUSE_SHADOW_GOODBOT_EXEMPT  = 1    ; mark FCrDNS-verified good bots as exempt
;ABUSE_SHADOW_RATE_K         = 20   ; per-IP rps must be >= K x vhost median (default 20)
;ABUSE_SHADOW_RATE_FLOOR     = 0.2  ; ...and >= this absolute rps (default 0.2)
;ABUSE_SHADOW_RATE_SKEW_MIN  = 5    ; ...on a vhost with max/median >= this (default 5)
;ABUSE_SHADOW_RATE_MINREQ    = 20   ; ...from an IP with >= this many requests (default 20)
; Signal F (facet / query-cardinality expansion) — the blind spot in path_diversity,
; which counts BASE paths only, so a faceted-URL flood (few base paths, a huge
; distinct-query fan-out — e.g. ~805k `?filter_category=` URLs on 2 base paths)
; reads as benign. Signal F counts distinct FULL URLs (path+query) and flags a
; vhost whose distinct-URL count is large AND dwarfs its distinct base-path count.
; Vhost-level, badge-only (query_cardinality field / `facet` pill); it NEVER
; challenges or blocks. Default-ON under the master, so a node already running
; ABUSE_SHADOW = 1 starts collecting on upgrade with no edit here.
ABUSE_SHADOW_FACET           = 1    ; Signal F (vhost facet/query-cardinality expansion)
;ABUSE_SHADOW_FACET_MIN_URLS      = 300  ; flag only at >= this many distinct full URLs (default 300)
;ABUSE_SHADOW_FACET_MIN_EXPANSION = 20   ; ...and distinct_URLs / distinct_paths >= this (default 20)
;ABUSE_SHADOW_FACET_CAP           = 3000 ; per-bucket distinct-URL set cap (memory bound; default 3000)
; Signal G (origin cost pressure) — the SYMPTOM of a flood: a vhost whose origin
; returns a high fraction of 5xx under real load (the 256k x 500 origin collapse),
; where facet sees the request-shape cause. Reuses the 5xx counters already
; collected (no ingest cost). Vhost-level, badge-only (`cost_pressure` field /
; `cost N%` pill); it NEVER challenges or blocks. Default-ON under the master.
ABUSE_SHADOW_COST            = 1    ; Signal G (vhost 5xx origin cost pressure)
;ABUSE_SHADOW_COST_MIN_FRAC   = 0.15 ; flag only when 5xx/total >= this (default 0.15)
;ABUSE_SHADOW_COST_MIN_REQ    = 50   ; ...with >= this many requests (default 50)
;ABUSE_SHADOW_COST_MIN_RPS5XX = 1.0  ; ...and >= this absolute 5xx rps (default 1.0)
; NOTE: 5xx/total is over the WHOLE response mix (edge-served static/cached 200s
; included), so a cache-heavy vhost shows a diluted fraction — a full origin
; collapse behind mostly-cached traffic can sit under MIN_FRAC. Safe direction
; (under-fires, never over-fires); the RPS5XX floor is the partial backstop. Tune
; MIN_FRAC with that in mind.
; Signal H (datacenter-ASN fraction, VERIFIED-GATED) — fraction of a vhost's
; requests from datacenter/cloud ASNs that are NOT FCrDNS-verified good bots (so
; Google/Meta/Bing crawlers are excluded — else a crawled shop reads ~100%). A
; corroborating FEATURE for cloud-hosted scraper/proxy floods; origin is never
; innocence and datacenter-ASN ALONE never drives a decision. Vhost-level,
; badge-only (`dc_fraction` field / `dc N%` pill); NEVER challenges or blocks.
; ASN class is a cheap mmdb lookup; the FCrDNS good-bot check is bounded per tick.
; Default-ON under the master.
ABUSE_SHADOW_DCFRAC          = 1    ; Signal H (vhost unverified-datacenter fraction)
;ABUSE_SHADOW_DCFRAC_MIN_FRAC = 0.5  ; flag only when dc_reqs/total >= this (default 0.5)
;ABUSE_SHADOW_DCFRAC_MIN_REQ  = 50   ; ...with >= this many total requests (default 50)
;ABUSE_SHADOW_DCFRAC_MIN_IPS  = 5    ; ...spread over >= this many distinct datacenter IPs (default 5)

; --- UniqIP sub-mode ---
; Triggers challenge when distinct IPs alone exceed the ON threshold,
; regardless of score.  Useful for distributed attacks where individual IPs
; look clean.
;   UNIQIP_ON  — challenge fires when uniqIP count exceeds this
;   UNIQIP_OFF — challenge drops when uniqIP falls below this
;   UNIQIP_MAX — hard cap: instant-ON and stays ON while exceeded
;                Raise this for large e-commerce sites with legitimate traffic spikes
;                (e-athlos, e-vafeiadis pattern).
CHALLENGE_SUSPICIOUS_VHOST_UNIQIP     = 1
CHALLENGE_SUSPICIOUS_VHOST_UNIQIP_ON  = 150   ; raised from 100
CHALLENGE_SUSPICIOUS_VHOST_UNIQIP_OFF = 120   ; raised from 80
CHALLENGE_SUSPICIOUS_VHOST_UNIQIP_MAX = 260   ; raised from 150


; -----------------------------------------------------------------------------
; 12. EXCLUSIONS
; -----------------------------------------------------------------------------
; IPs / CIDRs in this file are never challenged (overrides all triggers above).
; Typical entries: your own monitoring IPs, Apple WKWebView range (17.0.0.0/8),
; trusted CDN egress IPs, uptime robots, payment gateway callbacks, etc.
; Challenge exclude is file-presence based: rules are loaded automatically
; when CHALLENGE_EXCLUDE_FILE exists. Delete the file to disable; override the
; path here if you keep the rules somewhere else.
CHALLENGE_EXCLUDE_FILE = /etc/cfm/webdetector_challenge_exclude.txt


; -----------------------------------------------------------------------------
; 13. OPENRESTY IN-PATH EDGE (always on)
; -----------------------------------------------------------------------------
; cfm pushes allow/challenge/block decisions to OpenResty/Angie via unix
; socket; the edge Lua reads decisions in-path and serves the challenge page
; directly. This is the ONLY challenge enforcement mode — the legacy per-IP
; DNAT redirect is retired (docs/edge-unification-plan.md). The former
; OPENRESTY_MODE key is gone — edge mode is unconditional. (If an old live
; config still carries OPENRESTY_MODE, it is ignored; the daemon logs a
; one-line deprecation warning so you can remove it.)
;
; Socket API endpoints (all require header: X-CFM-Token: <OPENRESTY_TOKEN>):
;
;   GET  /nginx/decision?ip=1.2.3.4&host=example.com
;        → {"ip_action":"allow|challenge|block","vhost_action":"allow|challenge"}
;
;   POST /nginx/ip          {"ip":"1.2.3.4","action":"challenge|block","ttl_sec":600}
;   POST /nginx/ip/clear    {"ip":"1.2.3.4"}
;   POST /nginx/vhost       {"host":"example.com","action":"challenge","ttl_sec":600}
;   POST /nginx/vhost/clear {"host":"example.com"}
;   GET  /nginx/status      → active IPs/vhosts + push stats (debug)
OPENRESTY_SOCK  = /var/run/cfm/cfm_nginx.sock
OPENRESTY_BRIDGE_TRACE = 0
; cfm auto-generates a strong random token on first startup, writes it back here
; and to /var/lib/cfm/lua/cfm_bridge_token.lua for cfm.lua.
OPENRESTY_TOKEN = placeholder


; -----------------------------------------------------------------------------
; 14. ANCILLARY DETECTORS
; -----------------------------------------------------------------------------
; --- Malformed request burst ---
; Challenges IPs that send many HTTP 400 / 414 / 431 responses in a short time.
; Typical source: headless scanners fuzzing headers / URI length.
;   MIN — malformed requests within TTL before trigger
;   TTL — sliding window
CHALLENGE_MALFORMED_MIN = 15
CHALLENGE_MALFORMED_TTL = 30m

; --- User-Agent churn ---
; Challenges IPs that rotate through many distinct User-Agent strings.
; Legitimate clients (browsers, crawlers) use one or very few UAs.
;   MIN — distinct UAs within TTL before trigger
;   TTL — sliding window
;   CAP — stop counting at this value (memory guard)
CHALLENGE_UNIQUA_MIN = 8
CHALLENGE_UNIQUA_TTL = 20m
CHALLENGE_UNIQUA_CAP = 64

; --- Subnet-level aggregation ---
; Groups IPs into /PREFIX_V4 subnets and challenges the whole subnet when
; the subnet collectively shows scanner-like behaviour.  Effective against
; distributed attacks spread across a /24 block from one ASN.
;
;   PREFIX_V4     — subnet mask (24 = /24 block)
;   MIN_IPS       — distinct IPs in subnet before evaluation starts
;   MIN_REQ       — total requests from subnet within TTL
;   MIN_UNIQPATH  — distinct paths from subnet within TTL
;   MIN_UNIQHOST  — distinct vhosts from subnet within TTL
;   TTL           — sliding window
;   CAP           — max subnets tracked simultaneously (memory guard)
;   SAME_HOST     — 1 = only aggregate IPs hitting the same vhost
; Built-in good-bot exemption (2026-08-21): before a subnet challenge fires,
; a sample of the /24's members is FCrDNS-verified against the good-bot PTR
; registry (Googlebot, Bingbot, Applebot, Yandex, Meta *.fbsv.net). A verified
; crawler farm /24 is exempt; spoofed or missing PTRs earn nothing. Partners
; without a verifiable PTR scheme (e.g. Skroutz/BestPrice) belong in the
; operator exclude file (CHALLENGE_EXCLUDE_FILE), keyed by UA/nets.
CHALLENGE_SUBNET_ENABLED      = 1
CHALLENGE_SUBNET_PREFIX_V4    = 24
CHALLENGE_SUBNET_MIN_IPS      = 80
CHALLENGE_SUBNET_MIN_REQ      = 120
CHALLENGE_SUBNET_MIN_UNIQPATH = 80
CHALLENGE_SUBNET_MIN_UNIQHOST = 2
CHALLENGE_SUBNET_TTL          = 20m
CHALLENGE_SUBNET_CAP          = 2048
CHALLENGE_SUBNET_SAME_HOST    = 1
CHALLENGE_SUBNET_GOODBOT_EXEMPT = 1   ; exempt FCrDNS-verified crawler /24s (Meta/Google/Bing/…); 0 = challenge them too

; Per-IP good-bot challenge exemption (decision hot path). When on, a would-be
; challenge (per-IP OR vhost-wide) is downgraded to allow for an FCrDNS-verified
; good bot — a crawler cannot solve a JS/PoW challenge, so challenging it only
; breaks legitimate crawl/SEO/social. Forward-confirmed (spoofed PTR earns
; nothing); a per-IP BLOCK is never softened. Also waives a ChallengeV2 (Rung 1)
; reject under a geo or vhost challenge_v2 arm for a verified bot that was
; challenged before its verdict existed (e.g. Google-Read-Aloud's rotating IPs):
; the solve logs v2_waived=<name>. A fingerprint policy or a traffic-rule/WAF
; challenge_v2 stays strict. 0 = challenge verified bots too, and reject them
; under every armed challenge_v2.
CHALLENGE_GOODBOT_EXEMPT      = 1


; --- Under-Attack Mode (challenge-efficacy detector) ---
; Escalates a vhost that is ALREADY challenge-armed but whose challenge is being
; DEFEATED (a solver farm passing it at tens of IPs/min) to an UNDER_ATTACK
; state, and notifies — so the operator learns "challenge defeated" from an
; alert, not by reading logs. Reachable ONLY from CHALLENGED: it never
; challenges or blocks a vhost the existing paths left alone. Good bots are
; exempt before anything is counted (self-declared UAs + FCrDNS). This is the
; increment-I1 detector: DETECT-ONLY (DRYRUN=1). Enforcement (harden / draft
; block rule / nft) lands in later increments. See docs/under-attack-mode.md.
UNDER_ATTACK                = 1     ; master: run the detector (ships on, DRYRUN below)
UNDER_ATTACK_DRYRUN         = 1     ; posture flag: state + notifications only. I1 is ALWAYS
                                    ; detect-only (no enforcement exists yet), so this has no
                                    ; behavioural effect until the enforcement increments (I3+);
                                    ; it is surfaced in the challenge log for visibility.
UNDER_ATTACK_SOLVES_MIN     = 15    ; distinct solving IPs/min that count as a "farm solving" the challenge
UNDER_ATTACK_CONFIRM_TICKS  = 3     ; consecutive qualifying ticks before entering (hysteresis)
UNDER_ATTACK_HOLDDOWN       = 30m   ; pressure must stay below floor this long to leave the state
UNDER_ATTACK_RULE_TTL       = 6h    ; TTL of any auto/draft traffic rule (reserved for later increments)
UNDER_ATTACK_ERR_FLOOR      = 0.5   ; leg 3: sustained error ratio that means the challenge did not relieve pressure
UNDER_ATTACK_BOT_CEIL       = 0.05  ; leg 4: max self-declared-bot share (a real crawl self-declares; a farm claims browser)
; I2 campaign fingerprinter (SHADOW-ONLY): for a vhost under attack, proposes
; candidate deny predicates (dominant base-path, UA pool) and scores each
; coverage(attack) × (1 − collision(baseline)) against a rolling per-vhost
; baseline of NORMAL traffic. Logs candidates + a "would-arm" verdict to
; cfm.challenges.log ([under-attack][fingerprint]); NOTHING is enforced. The
; drafting/applying of the winning predicate is a later increment.
UNDER_ATTACK_FINGERPRINT       = 1      ; run the fingerprinter for under-attack vhosts
UNDER_ATTACK_FP_COVERAGE_MIN   = 0.60   ; would-arm: predicate must cover ≥ this share of the attack
UNDER_ATTACK_FP_COLLISION_MAX  = 0.005  ; would-arm: predicate must hit ≤ this share of baseline (legit) traffic


; -----------------------------------------------------------------------------
; 15. CUSTOM REGEX DETECTOR (file + journald examples)
; -----------------------------------------------------------------------------
; Supports custom auth-like detectors with named capture groups:
;   (?P<ip>...) and/or (?P<user>...)
; New keys:
;   FAIL_REGEX   = multiline list (one regex per line, required)
;   IGNORE_REGEX = multiline list (optional; skipped before FAIL_REGEX match)
;   MATCH_TARGET = ip | user | both (required captures enforced)
;
; Example A: file tailing (auth.log style)
;[custom:ssh_file]
;ENABLED = 1
;MODE = file
;LOG_PATH = /var/log/auth.log
;EVERY = 2s
;WINDOW = 10m
;COOLDOWN = 20m
;AUTHFAIL_IP = 20
;AUTHFAIL_USER = 10
;MATCH_TARGET = both
;IGNORE_REGEX =
;    cfm-healthcheck
;FAIL_REGEX =
;    Failed password for (?:invalid user )?(?P<user>\\S+) from (?P<ip>\\S+)
;BLOCK = dryrun
;BLOCK_COOLDOWN = 20m
;
; Example B: journald source
;[custom:sshd_journal]
;ENABLED = 1
;MODE = journal
;JOURNAL_UNIT = ssh.service
;JOURNAL_MATCHES = _SYSTEMD_UNIT=ssh.service
;EVERY = 2s
;WINDOW = 10m
;COOLDOWN = 20m
;AUTHFAIL_IP = 12
;AUTHFAIL_USER = 8
;MATCH_TARGET = ip
;FAIL_REGEX =
;    Failed password for .* from (?P<ip>\\S+) port \\d+ ssh2
;BLOCK = 1h
