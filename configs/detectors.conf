; ─────────────────────────────────────────────────────────────────────────────
; Autoblock options (per section)
; ─────────────────────────────────────────────────────────────────────────────
; BLOCK =
;   no | off | 0        → Do NOT block (default).
;   dryrun | alert      → Do not touch the firewall; just log “would block …”.
;   permanent | perm    → Block permanently (no expiry) in block_v4 / block_v6.
;   <duration>          → Block with TTL. Examples:
;                         30m, 1h, 2h, 4h, 24h, 1h30m (Go duration format).
;
; BLOCK_COOLDOWN = <duration> (optional)
;   Minimum time before the SAME IP can be blocked again by THIS section.
;   Helps avoid repeated re-blocks/noise if many alerts fire.
;   Examples: 15m, 30m, 1h. Leave unset to disable cooldown.
;
; Notes:
; - TTL blocks are automatically removed by nft timed sets when they expire.
; - “permanent” blocks remain until explicitly removed.
; - The detector section determines which IP is blocked:
;     * ssh_auth per-IP alerts: the IP is the alert key.
;     * exim_* detectors: the sink extracts the first IPv4 from sample lines
;       (or uses Extra["ip"] if the detector set it).
; - Alerts are still logged regardless of BLOCK mode.
; - Use BLOCK per section to choose different policies (e.g., permanent for
;   relay abuse, TTL for SSH, dryrun while tuning thresholds).
; ─────────────────────────────────────────────────────────────────────────────
; ── Examples ─────────────────────────────────────────────────────────────────
;
;[ssh_auth]
; … your existing options …
;BLOCK = 4h            ; Block offending SSH IPs for 4 hours
;BLOCK_COOLDOWN = 30m  ; Don’t re-block the same IP again within 30 minutes

;[exim_relays]
; … your existing options …
;BLOCK = permanent     ; Relay abuse → permanent block
;BLOCK_COOLDOWN = 1h   ; Optional: avoid duplicate blocks for an hour
;
;[exim_security]
; … your existing options …
;BLOCK = dryrun        ; Only log “would block …” while tuning rules
;BLOCK_COOLDOWN = 20m ; (optional) cooldown if you later enable blocking
; ─────────────────────────────────────────────────────────────────────────────

[global]
DEFAULT_EVERY   = "60s"
DEFAULT_TIMEOUT = "8s"
DEFAULT_COOLDOWN = "10m"
; enrichment
ENRICH      = 1
PTR         = 1
ENRICH_DIRS = "/var/lib/cfm/maxmind"


[exim_queues]
ENABLED          = 1
EVERY            = "60s"
TIMEOUT          = "8s"
QUEUE_TOTAL_MAX  = 300
QUEUE_FROZEN_MAX = 100
SAMPLE_LIMIT     = 10
COOLDOWN         = "10m"


[exim_relays]
ENABLED = 1
LOG_PATH = ""
WINDOW = "15m"
EVERY  = "20s"
SAMPLE_LIMIT = 10
COOLDOWN = "10m"

; thresholds (>=)
LOCAL_USER_MAX   = 110
AUTH_USER_MAX    = 110
AUTH_IP_MAX      = 110
AUTH_USERIP_MAX  = 120
UNAUTH_IP_MAX    = 250

BLOCK = dryrun

[exim_security]
ENABLED = 1
LOG_PATH     = ""
REJECT_LOG_PATH = ""
EVERY        = "20s"
WINDOW       = "30m"
SAMPLE_LIMIT = 10
COOLDOWN     = "20m"
;RULES        = "/etc/cfm/exim_security.rules"

; Specials (per-IP / per-user counters for AUTH failures)
AUTHFAIL_IP   = 5
AUTHFAIL_USER = 5

; Core rules
AUTHFAIL           = 6
SENDER_VERIFY_FAIL = 6
RCPT_REJECT        = 6
SYNC_ERR           = 8
PROTO_ERR          = 8
NO_MAIL            = 8
DROP_ACL           = 6

; Rejectlog-focused (safe set)
RCPT_AUTH_REQUIRED     = 6
NONMAIL_CMD            = 4
NO_HELO                = 6
BAD_HELO_IMPERSONATION = 6
HELO_SYNTAX            = 6
PIPELINING             = 6

SESSION_ALL_FAILED":	= 6
SLOW_FAIL_BLOCK"	= 6


BLOCK = permanent
BLOCK_COOLDOWN = 10m




[postfix_security]
ENABLED = 1

# === Source (pick one mode) ===
# 1) Classic file
LOG_PATH = "/var/log/mail.log"
# or:
# 2) Journald
#JOURNAL_UNIT   = "postfix@-.service"
#JOURNAL_MATCHES = "_SYSTEMD_UNIT=postfix@-.service"

# Window + schedule
EVERY        = "20s"
WINDOW       = "30m"
SAMPLE_LIMIT = 10
COOLDOWN     = "20m"

# Enrichment (same semantics as exim)
ENRICH       = 1
PTR          = 1
ENRICH_DIRS  = "/var/lib/cfm/maxmind"

# ---- Thresholds ----
# specials (per-IP / per-user for AUTH)
AUTHFAIL_IP   = 5
AUTHFAIL_USER = 5

# rule keys (>=)
AUTHFAIL     = 6
RELAY_DENIED = 4
USER_UNKNOWN = 8
RCPT_REJECT  = 10
RBL_HIT      = 3
NONSMTP_CMD  = 4
PIPELINING   = 4
TLS_ERR      = 4

BLOCK          = permanent
BLOCK_COOLDOWN = "10m"





[ssh_auth]
ENABLED = 1
; mode is journal (systemd) or file
MODE = journal
JOURNAL_UNIT = sshd.service
LOG_PATH = ""
EVERY = "20s"
WINDOW = "15m"
SAMPLE_LIMIT = 10
COOLDOWN = "20m"

; thresholds - different per user and IP. useful for distributed attacks
AUTHFAIL_IP = 8
AUTHFAIL_USER = 8
DDOS_IP = 8

BLOCK = permanent
BLOCK_COOLDOWN = 30m


[dovecot_auth]
ENABLED = 1
; mode is journal (systemd) or file
MODE = journal
JOURNAL_UNIT = dovecot.service
LOG_PATH = ""
EVERY = "20s"
WINDOW = "15m"
SAMPLE_LIMIT = 10
COOLDOWN = "20m"

; thresholds tuned similarly to ssh_auth
AUTHFAIL_IP   = 10
AUTHFAIL_USER = 10

; autoblock policy for this detector
BLOCK = permanent
BLOCK_COOLDOWN = 30m


[ftpd]
ENABLED = 1
; MODE: auto|file|journal
MODE = auto
LOG_PATH = ""

EVERY = "20s"
WINDOW = "15m"
COOLDOWN = "20m"
SAMPLE_LIMIT = 10

; thresholds (>=)
AUTHFAIL_IP   = 8
AUTHFAIL_USER = 8

; use your existing per-section block knobs
BLOCK = permanent
BLOCK_COOLDOWN = 30m

[modsec]
ENABLED = 1
; Source (file-only)
MODE = auto
LOG_PATH = /var/log/apache2/error_log

EVERY = "20s"
WINDOW = "15m"
COOLDOWN = "20m"
SAMPLE_LIMIT = 10

; threshold (>=)
MODSEC_IP = 20

; per-section block policy
BLOCK = permanent
BLOCK_COOLDOWN = 30m

[cpanel]
ENABLED = 1
EVERY = "20s"
WINDOW = "10m"
COOLDOWN = "20m"
LOG_PATH = "/usr/local/cpanel/logs/login_log"
SAMPLE_LIMIT = 16

; thresholds
AUTHFAIL_IP = 10
AUTHFAIL_USER = 10
ROOT_IP = 5

; per-section block policy
BLOCK = 1h
BLOCK_COOLDOWN = 30m


[mysql]
ENABLED = 1
EVERY = "20s"
WINDOW = "10m"
COOLDOWN = "20m"
LOG_PATH = ""
SAMPLE_LIMIT = 15

; thresholds
DENIED_IP   = 8
DENIED_USER = 8
ROOT_IP     = 3
SCAN_IP     = 10

; hygiene
IGNORE_LOCALHOST = 1
IGNORE_CPANEL_UTIL = 1

; per-section block policy
BLOCK = permanent
BLOCK_COOLDOWN = 30m



[health]
ENABLED = 1

; sampling / window / cooldown

EVERY = "20s"            ; sampling period
WINDOW = "2m"            ; rolling window for spikes
COOLDOWN = "15m"         ; don’t spam the same alert

; Enrichment / spike context
; ENRICH_DIRS can stay default or point to your MaxMind dirs
; ENRICH_DIRS = /etc/cfm,/var/lib/cfm/maxmind

ENRICH = 1
PTR = 1
ENRICH_DIRS = /var/lib/cfm/maxmind
SPIKE_PROBE_TOPN = 10

; CPU / RAM / DISK - 1m load > 1.2 * cores -> warn
CPU_LOAD_PCT   = 120
;percentage
RAM_USED_PCT   = 90
DISK_ROOT_PCT  = 90

; NET spikes x times baseline (rolling avg)
CONN_TOTAL_MIN   = 100
ESTABLISHED_MIN  = 60
SYN_RECV_MIN     = 60
PORT_CONN_MIN    = 60
SPIKE_MIN_DELTA  = 10

CONN_TOTAL_SPIKE   = 3.0
CONN_EST_SPIKE     = 3.0
CONN_SYN_SPIKE     = 3.0
THROUGHPUT_SPIKE_X = 4.0
THROUGHPUT_MIN_MBPS = 60

; Absolute tripwires
CONN_TOTAL_ABS = 20000
ESTABLISHED_ABS = 8000
SYN_RECV_ABS    = 500

; Temp (if sensors)
TEMP_C_WARN = 85
TEMP_C_CRIT = 95

; SMART / RAID / ZFS
SMART_FAIL_ALERT = 1
MDADM_ALERT = 1
ZFS_ALERT = 1

; Optional per-port watch (approx via tcp local port split)
PORT_WATCH = "80,443,25,110,143,21,22,3306,465,587"
PORT_SPIKE_X = 3.0


[nginx_access]
ENABLED = 1
MODE = file
LOG_PATH = "/var/log/nginx/access_cfm_combined.log"

EVERY   = "5s"
WINDOW  = "60s"
COOLDOWN = "10m"
SAMPLE_LIMIT = 20

# Thresholds (notify-only to start)
RPS_TOTAL_MIN     = 500
UNIQUE_IPS_MIN    = 300
ERR_RATIO_MIN     = 0.20
RPS_499_MIN       = 100
RPS_5XX_MIN       = 60
MEDIAN_IP_RPS_MAX = 3

# Optional 401-focused triggers
RPS_401_MIN = 200
AUTH401_RATIO_MIN = 0.60
PROC_TIME_MAX = 1.2

# Optional enrichment
ENRICH = 1
PTR    = 1
ENRICH_DIRS = "/var/lib/cfm/maxmind"


[httpd_access]
ENABLED = 1
MODE = file
LOG_PATH = "/var/log/apache2/access_cfm_combined.log"

EVERY = "5s"
WINDOW = "60s"
COOLDOWN = "10m"
SAMPLE_LIMIT = 20

RPS_TOTAL_MIN = 500
UNIQUE_IPS_MIN = 300
ERR_RATIO_MIN = 0.20
RPS_499_MIN = 100
RPS_5XX_MIN = 60
MEDIAN_IP_RPS_MAX = 3

# Optional 401-focused triggers
RPS_401_MIN = 200
AUTH401_RATIO_MIN = 0.60
PROC_TIME_MAX = 1.2

# Enrichment
ENRICH = 1
PTR = 1
ENRICH_DIRS = "/var/lib/cfm/maxmind"
