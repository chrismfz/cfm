; ─────────────────────────────────────────────────────────────────────────────
; Autoblock options (per section)
; ─────────────────────────────────────────────────────────────────────────────
; BLOCK =
;   no | off | 0        → Do NOT block (default).
;   dryrun | alert      → Do not touch the firewall; just log “would block …”.
;   permanent | perm    → Block permanently (no expiry) in block_v4 / block_v6.
;   <duration>          → Block with TTL. Examples:
;                         30m, 1h, 2h, 4h, 24h, 1h30m (Go duration format).
;
; BLOCK_COOLDOWN = <duration> (optional)
;   Minimum time before the SAME IP can be blocked again by THIS section.
;   Helps avoid repeated re-blocks/noise if many alerts fire.
;   Examples: 15m, 30m, 1h. Leave unset to disable cooldown.
;
; Notes:
; - TTL blocks are automatically removed by nft timed sets when they expire.
; - “permanent” blocks remain until explicitly removed.
; - The detector section determines which IP is blocked:
;     * ssh_auth per-IP alerts: the IP is the alert key.
;     * exim_* detectors: the sink extracts the first IPv4 from sample lines
;       (or uses Extra["ip"] if the detector set it).
; - Alerts are still logged regardless of BLOCK mode.
; - Use BLOCK per section to choose different policies (e.g., permanent for
;   relay abuse, TTL for SSH, dryrun while tuning thresholds).
; ─────────────────────────────────────────────────────────────────────────────
; ── Examples ─────────────────────────────────────────────────────────────────
;
;[ssh_auth]
; … your existing options …
;BLOCK = 4h            ; Block offending SSH IPs for 4 hours
;BLOCK_COOLDOWN = 30m  ; Don’t re-block the same IP again within 30 minutes

;[exim_relays]
; … your existing options …
;BLOCK = permanent     ; Relay abuse → permanent block
;BLOCK_COOLDOWN = 1h   ; Optional: avoid duplicate blocks for an hour
;
;[exim_security]
; … your existing options …
;BLOCK = dryrun        ; Only log “would block …” while tuning rules
;BLOCK_COOLDOWN = 20m ; (optional) cooldown if you later enable blocking
; ─────────────────────────────────────────────────────────────────────────────
; ── Leniency overrides (per section)  →  [<section>.leniency] ─────────────────
;
; A companion [<section>.leniency] subsection applies a SOFTER policy to IPs
; that match a trusted geography or network (e.g. local customers who trip a
; detector). When an IP matches MATCH_COUNTRY or MATCH_ASN (OR logic), the
; leniency BLOCK / BLOCK_COOLDOWN replace the section defaults for that IP.
;
;   MATCH_COUNTRY = "GR,CY"        ; ISO codes (recommended, any country), comma/space separated;
;                                  ; single-word English names also work ("GREECE") — not multi-word ones
;   MATCH_ASN     = "AS6799,6866"  ; optional, OR with country ("AS" optional)
;   BLOCK / BLOCK_COOLDOWN         ; softer policy, same syntax as above
;
; Reporting of a lenient match to the central API (cfm-web):
;
;   SEND_TO_API =
;     yes (default) | no   → Whether the block is reported to the API at all.
;                            Also honors the global *_SEND_TO_API switches: if
;                            API reporting is disabled server-wide, nothing is
;                            sent regardless of this value.
;
;   SEND_TO_BLOCKLIST =                (only meaningful when SEND_TO_API = yes)
;     blacklist (default)  → Report to the GLOBAL blocklist: the IP is
;                            propagated and EVERY server downloads and blocks it.
;     lenient              → Record on the central "lenient" list instead:
;                            visible for support / unblock lookups, but NEVER
;                            served to the farm (other servers do not download
;                            or block it). Use this for known-good origins you
;                            still want a short LOCAL block on, without blocking
;                            them everywhere.
;
; ── Leniency examples ──
;[exim_security.leniency]
;MATCH_COUNTRY     = "GR,CY"    ; lenient toward Greek/Cypriot customer ranges
;BLOCK             = "10m"      ; short local block instead of section default
;BLOCK_COOLDOWN    = "10m"
;SEND_TO_API       = yes        ; report it...
;SEND_TO_BLOCKLIST = lenient    ; ...but keep it local-only, not farm-wide
;
;[dovecot_auth.leniency]
;MATCH_ASN         = "AS6799"   ; a trusted local ISP
;BLOCK             = "15m"
;SEND_TO_API       = no         ; block locally, report nothing centrally
; ─────────────────────────────────────────────────────────────────────────────

[global]
DEFAULT_EVERY   = "60s"
DEFAULT_TIMEOUT = "8s"
DEFAULT_COOLDOWN = "10m"
; enrichment
ENRICH      = 1
PTR         = 1
ENRICH_DIRS = "/var/lib/cfm/maxmind"
# Signle IPs
IGNORE_IPS  = 127.0.0.1, 172.22.1.13
# CIDR subnets
# Ignore Our subnet, bogon and Docker subnets
IGNORE_NETS = 172.17.0.1/16, 10.0.0.0/8, 84.54.49.0/24
LOG_IGNORED = no

; cfm_endpoints is a built-in safety detector. It runs with these same built-in
; defaults even when this section is absent; this section is only for operator
; overrides. Set ENABLED=0 explicitly to opt out. The former [api_abuse] name is
; accepted temporarily as a deprecated compatibility alias.
[cfm_endpoints]
ENABLED = 1
EVERY = "2s"
WINDOW = "2m"
SAMPLE_LIMIT = 10

; Progressive mitigation thresholds (within WINDOW)
STAGE1_THRESHOLD = 10    ; observe + log only
STAGE2_THRESHOLD = 12    ; temporary challenge
STAGE3_THRESHOLD = 16    ; short block via BLOCK policy

; Stage-specific controls
STAGE2_CHALLENGE_TTL = "10m"
BLOCK = "15m"            ; stage 3 enforcement TTL (or dryrun/permanent/no)
BLOCK_COOLDOWN = "20m"
DRY_RUN = no             ; forces stage 3 to dryrun while still emitting alerts

; Allowlist controls (monitors/proxies)
ALLOW_IPS = 127.0.0.1
ALLOW_NETS =
; User-Agent is attacker-controlled. Prefer [global] IGNORE_IPS/IGNORE_NETS for
; trusted monitors. The historical shipped list below is migrated away unless
; ALLOW_UA_CONTAINS_EXPLICIT=1 acknowledges retaining that exact unsafe bypass.
;ALLOW_UA_CONTAINS = uptime, healthcheck, prometheus
;ALLOW_UA_CONTAINS_EXPLICIT = 1

; Exact-path exceptions for generic unauthorized-burst noise only. Direct auth
; failures, fuzz and method probes on these paths still count.
PATH_EXCEPTIONS = /api/v1/embed/bootstrap, /cfm-admin/api/v1/embed/bootstrap

; ─────────────────────────────────────────────────────────────────────────────
; waf_security — persistent nft block from in-path WAF hits.
;
; The in-path WAF (OpenResty/Angie Lua) already decides per request
; (logonly/challenge/block). This detector adds a SEPARATE, cross-request,
; L3/L4 decision: a source IP that keeps getting BLOCKED by the WAF becomes an
; nft-ban candidate. Blocks are logged to cfm.detectors.log, reported to
; cfm-web, and emailed like every other detector block.
; See docs/waf-autoblock-design.md.
;
; PHASE 1 SCOPE: only hits the edge itself BLOCKED (action=block) feed the
; counter — "block at WAF → nft candidate". Challenge/logonly hits never feed
; (they stay edge-only). So the family thresholds below apply to block-tier
; hits only; a family with no block-tier rules (e.g. WAF_BACKDOOR today) simply
; never fires until one of its rules is promoted to block.
;
; IMPORTANT (parser): keep values on their own — do NOT put an inline `;`
; comment after a numeric/bool/duration value on the same line. The scalar
; parser does not strip inline comments for those, so `SQLI = 1 ; note` would
; fail to parse and silently fall back to the built-in default. Put comments on
; their own line, as below.
; ─────────────────────────────────────────────────────────────────────────────
[waf_security]
ENABLED      = 1
; how often accrued hits are evaluated
EVERY        = "20s"
; rolling per-IP-per-family counter window
WINDOW       = "30m"
SAMPLE_LIMIT = 10
; 1 = observe-only (log "would block" to cfm.detectors.log + report, no real nft
; ban). 0 = enforce per BLOCK below. The shipped default enforces a SOFT TTL
; block (see BLOCK), not a permanent one — set DRY_RUN=1 if you want a pure
; watch-first burn-in instead.
DRY_RUN      = 0

; Per-IP-per-family thresholds: edge-BLOCKED hits within WINDOW that trip an
; nft ban. 0 disables that family. At threshold 1 the first block-hit bans —
; which is why the Lua per-(ip,reason) push cooldown is harmless (the first hit
; is what counts).
;
; EVERY WAF reason-family is a knob — the config key is the family name minus
; the WAF_ prefix (WAF_SQLI → SQLI, WAF_UPLOAD_FNAME → UPLOAD_FNAME). The
; detector covers the full family list from the code registry automatically
; (the ReasonFamily values in internal/webdetector/waf_rule_ids.go), so a family
; you don't list simply takes its default — you do NOT need to list them all.
; Semantics: docs/waf-autoblock-design.md.
;
; WHAT CAN ACTUALLY BLOCK IN PHASE 1: only families that have an edge-`block`
; rule, because Phase 1 feeds edge-`block` hits only. Today that is SQLI (301),
; SQLI_LEXICAL (309), RCE (320, 329), UPLOAD_FNAME (401, 414), UPLOAD_CONTENT
; (402), WEBSHELL (413, the proper-noun webshell drop-path subset), CVE (10001+),
; PHP_WRAPPER (305), AUTH_BURST (510-512, xmlrpc multicall/pingback/burst) and
; TRAVERSAL (101, 103, held — see below); the Go registry (waf_rule_ids.go,
; DefaultMode "block") is the source of that list. Every other family is challenge/logonly-tier,
; defaults to 0, and is inert in Phase 1 even if you set it (the action=block
; gate drops it) — it becomes live in Phase 2. A family you don't list takes its
; code default; today every unlisted family is challenge/logonly-tier and
; defaults to 0. The lines below are explicit for visibility and to arm the
; ready families.
SQLI           = 1
; SQLI_LEXICAL rule 309 (word/method-colliding blind tokens — extractvalue( /
; updatexml( / benchmark( …), promoted to edge-`block` 2026-08-23 after a
; 188/188 TP fleet review. Armed like SQLI.
SQLI_LEXICAL   = 1
RCE            = 1
UPLOAD_FNAME   = 1
UPLOAD_CONTENT = 1
; AUTH_BURST rules 510-512 (xmlrpc multicall / pingback / POST burst) are
; edge-`block` body signatures of the WordPress brute-force botnets; armed.
AUTH_BURST     = 1
; WEBSHELL rule 413 (rule_webshell_path_known) is edge-`block` and near-zero FP
; (proper-noun drop names: c99/r57/wso/b374k/…), so a source probing for one is a
; clean autoblock candidate. Armed by default (2026-07-18): the operator runs it
; fleet-wide and confirms it reliably bans webshell-probing scanners/scrapers/bots
; with acceptable collateral. If a benign scanner you care about (Shodan/Censys/
; uptime monitor) matters, exempt it with ALLOW_UA_CONTAINS/ALLOW_NETS or hold the
; rule with RULE_413 = 0 rather than un-arming the whole family.
WEBSHELL       = 1
; BACKDOOR has no edge-`block` rule yet (430-438 are logonly/challenge), so this
; is inert today — it is armed to 1 so it autoblocks the moment one of its rules
; (e.g. 438) is promoted to block after that rule's own burn-in.
BACKDOOR       = 1
; CVE (WAF_CVE) is the named-vulnerability family (see WAF_CVE.md). Its first
; block rule is 10001 (rule_cve_simple_file_list_upload, CVE-2025-34085 /
; CVE-2020-36847) — a POST of a PHP payload to the Simple File List plugin
; endpoints, which no benign traffic does — so it is armed to 1: a hit gets a 6h
; nft ban AND a WAF/CVE-YYYY-NNNN Slack/mail alert. Caveat: WAF_CVE is a
; HETEROGENEOUS family (CVE rules of varying FP confidence), so when a
; lower-confidence CVE block-rule lands, hold JUST that rule with a per-rule
; `RULE_<id> = 0` (which wins over this family threshold) while the family stays
; armed for the high-confidence ones. For a watch-first burn-in without real
; bans, set DRY_RUN = 1 (still emits the Slack/mail alerts). The
; [waf_security.leniency] tier below (GR/CY soft block) applies to CVE hits too.
CVE            = 1
; TRAVERSAL (WAF_TRAVERSAL) — rule 101 (../, encoded dot-dot, null bytes, single
; ../ paired with a sensitive sink) was promoted challenge→`block` on 2026-09-05
; after a clean 6-server FP review (11 507 hits/7 d, 0 from GR, every sampled
; hit a scanner payload: .env, /proc/self/environ, pearcmd, .git/config,
; /etc/passwd). The family is deliberately HELD at 0 for its own burn-in: at
; threshold 1 it would ban ~2 300 distinct scanner IPs a week fleet-wide
; (~330 six-hour bans + alerts a day), almost all Google-Cloud sweeps that the
; edge already answers with 403. Set TRAVERSAL = 1 to add the 6h nft ban and the
; Slack/mail alert once that volume is acceptable (DRY_RUN = 1 to preview it).
; Rule 103 (2026-09-22, a `..` segment in the RAW request path — the WordPress
; permalink route of CVE-2026-87902) is in this family too, so it is a 403 only.
; The pagename query-var leg of that CVE is rule 10017 under CVE, which is armed.
TRAVERSAL      = 0
; PHP_WRAPPER (WAF_PHP_WRAPPER) — rule 305, promoted to edge-`block` 2026-07-18.
; Matches PHP stream wrappers (php:// phar:// data:// zip:// expect:// glob://) in
; request args/body — no benign app sends those, and they are the primary sink for
; LFI->RCE and CVE-2024-4577-style php-cgi injection. Armed: a hit gets a 6h nft
; ban + alert. It scans args/body only (not the URL path), and matches `data://`
; (the stream wrapper), NOT `data:` image/js URIs, so inline data-URI assets do not
; trip it.
PHP_WRAPPER    = 1

; Per-rule-id overrides win over the family threshold above (0 = never block
; that specific rule while its family stays active). Uncomment to use — again,
; no inline comment after the value:
;RULE_511 = 2
;RULE_437 = 0

; Allowlist (never autoblock these) — on top of the [global] IGNORE_IPS/NETS.
ALLOW_IPS  = 127.0.0.1
ALLOW_NETS = 10.0.0.0/8

; Enforcement when DRY_RUN=0. A SOFT TTL block (self-heals) is the deliberate
; first-deploy default rather than `permanent`: real protection now, and any
; surprise expires on its own within hours. Accepts <ttl> / permanent / dryrun /
; no. Promote to `permanent` once the burn-in looks clean.
BLOCK          = "6h"
BLOCK_COOLDOWN = "30m"

; Trusted geographies get an even softer tier instead of the section BLOCK:
; a GR/CY hit is likelier a compromised local host / rare FP → short temp-ban +
; surface for review. Presence of this subsection activates leniency.
[waf_security.leniency]
MATCH_COUNTRY     = "GR,CY"
;MATCH_ASN        = "9121,6799"
BLOCK             = "15m"
BLOCK_COOLDOWN    = "15m"
SEND_TO_API       = YES
SEND_TO_BLOCKLIST = lenient

; ─────────────────────────────────────────────────────────────────────────────
; challenge_solver_farm — distributed challenge-solving botnets. ALERT-ONLY.
;
; Some bots now complete the whole cookie + JS + PoW challenge correctly. They
; stay invisible to every per-IP threshold by solving ONCE per address from a
; huge residential-proxy pool. Measured on a production edge over 23h: 101,880
; solves on one vhost from 95,281 distinct IPs (1.07 solves/IP) across 77,792
; /24s. No per-IP counter can ever fire on that.
;
; The signal is the SPREAD of solvers per vhost per minute. It is deliberately
; NOT keyed on User-Agent — the UA is attacker-controlled, so keying on it would
; be evaded by randomising a header. The UA breakdown rides along on the alert
; as evidence for attribution.
;
; This detector never blocks: at ~1 solve per IP a per-IP ban cannot work (the
; address never returns) and the pool is residential, so it risks banning a real
; customer. Deciding what to do about a flagged vhost is a separate, deliberate
; change. Alerts are stamped ip_scope=host (the finding is about a vhost, so the
; sink must not resolve a source address for it — its fallback would otherwise
; take one from the User-Agents the alert quotes) and enforcement=observe (no
; block even if a BLOCK policy is set).
;
; Do NOT set BLOCK on this section. It would not block, but it WOULD move the
; alert onto the observe path, which writes to cfm.detector.log without raising
; a notification — i.e. you would quietly stop getting alerted.
;
; Style note: keep comments on their own line rather than after a value. The
; scalar readers do strip an inline `;`/`#`, but they cut at the FIRST one
; without regard for quoting, so an inline comment on a quoted value can leave a
; stray quote behind.
; ─────────────────────────────────────────────────────────────────────────────
[challenge_solver_farm]
ENABLED     = 1

; ACTION — what happens to a vhost once it is flagged.
;
;   observe   Raise the alert normally: operator notification (email, plus Slack
;             if you route it in notify.conf) AND a record in cfm.detector.log.
;             This is the default, and it is what you get if ACTION is absent
;             entirely — a config written before this key existed is unchanged.
;
;   logonly   Write the cfm.detector.log record but send NO notification. Use it
;             for a vhost you have already investigated and accepted as farmed:
;             the finding stays true for hours, so the mail becomes noise while
;             the record is still worth keeping.
;
;   deny      RESERVED — recognised, but refused at load with an explanation in
;   block     the log, falling back to observe. These are not merely unwritten;
;             each needs a design decision:
;
;             deny (403) has no safe subject. The finding is about a VHOST, so
;             denying the vhost takes your customer's site down and the farm
;             wins by proxy. The only subject narrow enough is the dominant UA
;             cluster — but that is a traffic rule, and a farm sidesteps it by
;             randomising one header, which is exactly what this detector was
;             built to survive.
;
;             block does not work on this traffic shape. Measured over 23h on a
;             live farm: 1.07 solves per address. By the time an alert fires the
;             address is already gone, and the pool is residential — so the ban
;             lands on whichever real visitor the ISP hands it to next. It is
;             implementable and it is still the wrong tool.
;
;             The actuator that DOES fit is raising the vhost's PoW difficulty
;             while it is flagged: proportional cost to a farm solving 100k
;             times, one-off cost to a real visitor. It needs two things CFM
;             does not have yet — per-vhost difficulty, and a faster browser
;             solver (today, raising difficulty costs an honest client about 92x
;             what it costs a native solver, so it hurts you more than them).
;             Tracked in docs/roadmaps/challenge-engine.md.
ACTION      = observe
; how often the accrued solves are evaluated. Clamped to WINDOW at load: a
; longer interval would prune away part of the stream before it was ever
; examined. A section that omits this inherits [global] DEFAULT_EVERY (60s).
EVERY       = "30s"
; sliding window over which solver spread is measured
WINDOW      = "60s"
; distinct client subnets solving the SAME vhost within WINDOW that raise the
; alert. Calibrated on 23h of production traffic containing a live farm,
; replayed through the detector the way it actually measures — a SLIDING window
; sampled every EVERY, not disjoint one-minute buckets (the sliding maximum is
; always >= the bucket maximum, so bucket figures would overstate the headroom):
;   farm vhost  : median 73 subnets per window, p01 49, max 122
;   every other : max 27, over 3212 evaluations
; 40 flags 2758 of 2761 farm evaluations and 0 of 3212 legitimate ones.
; That is ONE server over ONE day — a very large vhost with a global mobile
; audience may legitimately spread wider. Raise it if you see a false positive.
MIN_SUBNETS = 40
; floor on total solves in WINDOW, so a quiet vhost with a handful of one-off
; visitors cannot look like a farm. Counts solves the evidence cap dropped too.
MIN_SOLVES  = 40
; minimum gap between alerts for the same vhost (a farm runs for hours)
COOLDOWN    = "30m"
; subnet aggregation. IPv6 uses /48 because one residential customer routinely
; holds many /64s and would otherwise look like a spread all by itself.
PREFIX_V4   = 24
PREFIX_V6   = 48
SAMPLE_LIMIT = 10
; evidence buffer per vhost. Only the UA breakdown is capped by this — the
; subnet and IP counts the threshold reads are tracked separately, so a flood
; from one subnet cannot bury a farm's spread. Overflow is reported on the alert.
MAX_TRACKED_PER_HOST = 20000
; ingest buffer between evaluations; overflow is counted and logged, not silent
MAX_QUEUE   = 20000
; Do NOT set BLOCK here. This detector never blocks, but a BLOCK value moves its
; alert onto a path that logs without notifying — you would quietly stop being
; alerted. The daemon logs a warning if it finds one.
; exempt known-good crawlers/monitors that legitimately solve from many networks
;ALLOW_UA_CONTAINS = claudebot, ahrefsbot, applebot
;ALLOW_HOSTS       = big-global-shop.example.com
;ALLOW_NETS        = 203.0.113.0/24
;ALLOW_IPS         = 203.0.113.7
;
; ── Fingerprint-concentration track (the low-and-slow farm) ───────────────────
; MIN_SUBNETS above catches a FAST farm by its spread of /24s per window. A slow
; farm (~8/min) stays under that bar but still collapses onto ONE TLS ClientHello
; fingerprint across many networks and countries — a shape no diverse human
; audience makes. This track flags a single fingerprint spanning >= MIN_FP_SUBNETS
; subnets AND >= MIN_FP_COUNTRIES countries in WINDOW. The fingerprint is a
; group-by key, never a matched value, so a new tool's new fingerprint trips the
; same shape. Country spread is the false-positive guard: a legit shared-fingerprint
; population (corporate fleet, carrier CGNAT) is single-country. Calibrated on a
; fleet capture (farms 10-22 countries/window, every legit group <= 3); see
; docs/solver-farm-fingerprint-concentration.md.
;
; Alert-only like the rest of this detector. As of 2026-09-11 (after a clean
; weekday burn-in) an fp-concentration finding NOTIFIES per ACTION, throttled by
; NOTIFY_COOLDOWN (below). Needs GeoIP enrichment — without a geo DB the track
; cannot confirm country spread and stays silent. Set FP_TRACK = 0 to turn it off.
FP_TRACK         = 1
MIN_FP_SUBNETS   = 8
MIN_FP_COUNTRIES = 6
; exempt a known-legitimate shared fingerprint (e.g. a monitored checker fleet).
; Applies to the cross-host track below too.
;ALLOW_FPS        = deadbeef, c0ffee12
;
; NOTIFY_COOLDOWN throttles NOTIFICATIONS (mail/Slack) for a farmed vhost, while
; COOLDOWN still governs how often the alert is logged and the "farmed now" mark
; refreshes. A farm runs for hours, so the log stays live every COOLDOWN (30m) but
; the mail arrives at most once per NOTIFY_COOLDOWN. Applies to every track.
NOTIFY_COOLDOWN  = 6h
;
; Cross-host fingerprint concentration (Phase 2). The per-host track above misses a
; farm spread so THIN per vhost it never reaches MIN_FP_COUNTRIES on any single
; host, yet the same fingerprint DOMINATES many vhosts node-wide (measured: one fp
; across 22 vhosts / 44 countries, ~1 solve/IP). This track aggregates per
; fingerprint across the node over XH_WINDOW and flags a fp that is a super-majority
; of each vhost it is counted on (MIN_XH_HOST_SHARE_PCT — the PRIMARY guard, since a
; legit shared browser is a minority everywhere) and clears the host/country/subnet
; floors. solves_per_ip is NOT a gate — the burn-in showed it does not separate farm
; from legit (farm at 1.11, legit at 1.00-1.08) — it is reported as evidence only.
; Fingerprint is a group-by key, never a matched value. Default-on, LOG-ONLY through
; its own burn-in (a cross-host-only finding does not notify yet). Needs GeoIP.
; See docs/solver-farm-cross-host-phase2.md. Set XH_TRACK = 0 to turn it off.
XH_TRACK              = 1
XH_WINDOW             = 30m
MIN_XH_HOST_SHARE_PCT = 50
MIN_XH_HOSTS          = 4
MIN_XH_COUNTRIES      = 12
MIN_XH_SUBNETS        = 30

; ─────────────────────────────────────────────────────────────────────────────
; challenge_cookie_discard — clients that throw away their clearance cookie.
;
; The mirror image of challenge_solver_farm, and its exact blind spot. That one
; keys on a vhost because the farm burns a fresh address per solve, so no per-IP
; counter can see it. This one keys on the ADDRESS, for the population that does
; the opposite: a few addresses solving dozens of times each.
;
; Solving mints a signed cfm_clearance cookie good for CHALLENGE_COOKIE_LIFE
; (45m by default). A browser stores it and does not solve again until it
; expires. An address that re-solves minutes later is telling you something very
; specific: it never stored the cookie. That is not aggressive crawling — it is
; a request pipeline with no cookie jar, driving a headless browser per request.
; Worst offender in the 23h capture: 138 solves in 10 minutes, 1,121 in the day.
;
; Like challenge_solver_farm, it is deliberately NOT keyed on User-Agent (that
; is attacker-controlled); the UA/vhost/URI breakdowns are evidence only.
;
; UNLIKE challenge_solver_farm, blocking here is coherent: the subject is one
; real address abusing the challenge right now, and the alert carries it
; authoritatively. It still ships alert-only so you can burn it in — see BLOCK
; below.
; ─────────────────────────────────────────────────────────────────────────────
[challenge_cookie_discard]
ENABLED    = 1
; how often accrued solves are evaluated. Clamped to WINDOW at load: a longer
; interval would prune part of the stream away before it was ever examined.
EVERY      = "30s"
; sliding window over which one address's solves are counted. The semantic bound
; is CHALLENGE_COOKIE_LIFE — any repeat inside it is anomalous — and 10m is a
; deliberately tighter, cheaper proxy for it.
WINDOW     = "10m"
; solves by ONE address within WINDOW that raise the alert. Calibrated on 23h of
; production traffic (111,537 solves, 97,556 distinct addresses) replayed through
; a sliding 10m window:
;   99.6% of addresses never solved twice in any window
;   248 reached 3+, and 244 of those carried one identical desktop Chrome UA
;   the plausibly-legitimate repeaters topped out at 4 (an iPhone, an iPad, a
;   datacenter client, and one webmail address sending 3 different UAs — a NAT
;   or VPN exit with several real devices behind it)
;   NO address in the whole capture peaked at exactly 5
; So legitimate traffic stops at 4 and the abusive population resumes at 6.
; 8 is a 2x margin over the busiest legitimate repeater and still flags 219 of
; the 248. The margin is deliberate rather than tight: a user who opens several
; tabs at once is challenged in each before any cookie is set, which is a small
; instantaneous burst — while this detector's real target sustains 30+ solves
; over minutes.
MIN_SOLVES = 8
; minimum gap between alerts for the same address
COOLDOWN   = "30m"
SAMPLE_LIMIT = 10
; distinct addresses kept in flight. The key is client-controlled, so this bound
; is not optional. At the observed rate (~110 solves/min) about 1,100 addresses
; are live inside a 10m window. When the bound is reached no NEW address is
; admitted; addresses already counting are unaffected, so a flood of one-shot
; solvers can delay a new finding but cannot erase one in progress.
MAX_TRACKED_IPS    = 100000
; evidence buffer per address. Records lost to it are still counted toward the
; solve total, so the cap costs breakdown detail and never detection. Overflow
; is reported on the alert.
MAX_TRACKED_PER_IP = 2000
; ingest buffer between evaluations; overflow is counted and logged, not silent
MAX_QUEUE  = 20000
; BLOCK — unset means alert-only, which is how this ships so you can watch it
; first. Once you trust the finding, set it to turn the alert into a real nft
; ban; a soft TTL is right rather than permanent, because every address observed
; here was a residential proxy exit that may belong to a real visitor later.
;
; The intermediate step is BLOCK = "dryrun": the sink runs the whole blocking
; path and reports what it WOULD have banned without touching nftables. Note
; there is no generic DRY_RUN key in this framework — DRY_RUN belongs to the few
; detectors that read it themselves (cfm_endpoints, waf_security), and setting it
; here would be silently ignored while BLOCK kept banning for real.
;BLOCK     = "dryrun"
;BLOCK     = "6h"
; exempt a NAT gateway, VPN exit or monitor that legitimately re-solves
;ALLOW_UA_CONTAINS = uptimerobot, pingdom
;ALLOW_HOSTS       = webmail.example.com
;ALLOW_NETS        = 203.0.113.0/24
;ALLOW_IPS         = 203.0.113.7

