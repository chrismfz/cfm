; =============================================================================
; CFM WebDetector — Challenge Configuration
; =============================================================================
; Copy this file to /etc/cfm/detectors.conf (or include path) on each server.
; Sections:
;   1.  Network listeners
;   2.  Authentication
;   3.  Logging & notifications
;   4.  Abuse firewall
;   5.  Challenge session
;   6.  Path-based triggers      (high-signal, low FP)
;   7.  Rate / behaviour triggers (threshold-based)
;   8.  Per-IP heuristics        (unique paths, unique hosts)
;   9.  Per-vhost heuristics     (unique paths)
;  10.  Panic / bypass lists
;  11.  Suspicious-vhost auto mode (score + uniqIP)
;  12.  Exclusions
;  13.  OpenResty in-path mode
;  14.  Ancillary detectors
; =============================================================================


; -----------------------------------------------------------------------------
; 1. NETWORK LISTENERS
; -----------------------------------------------------------------------------
; Ports the challenge HTTP(S) server binds to on localhost.
; These must match the upstream proxy_pass in your nginx/OpenResty config.
CHALLENGE_HTTP_LISTEN  = 127.0.0.1:9098
CHALLENGE_HTTPS_LISTEN = 127.0.0.1:9099


; -----------------------------------------------------------------------------
; 2. AUTHENTICATION
; -----------------------------------------------------------------------------
; Shared secret between cfm and the browser challenge HMAC.
; cfm auto-generates a strong random token on first startup and writes it back
; here — no manual action needed.  To rotate, set this to "placeholder" and
; restart the daemon.
CHALLENGE_TOKEN = placeholder


; -----------------------------------------------------------------------------
; 3. LOGGING & NOTIFICATIONS
; -----------------------------------------------------------------------------
; CHALLENGE_LOG    — write per-event challenge log (1=on, 0=off)
; CHALLENGE_NOTIFY — send external notifications on events (1=on, 0=off)
CHALLENGE_ACCESS_LOG = /var/log/cfm/challenge.access.log
CHALLENGE_LOG    = 1
CHALLENGE_NOTIFY = 0


; -----------------------------------------------------------------------------
; 4. ABUSE FIREWALL
; -----------------------------------------------------------------------------
; Bots that hammer the challenge endpoint itself get hard-blocked in nftables.
;
;   WINDOW  — sliding window for counting bad responses
;   BAD_N   — number of bad responses within WINDOW before hard-block fires
;   BLOCK_TTL  — how long the firewall rule stays active
;   COOLDOWN   — after block expires, how long before the IP can be blocked again
CHALLENGE_ABUSE_ENABLED  = 1
CHALLENGE_ABUSE_WINDOW   = 10s
CHALLENGE_ABUSE_BAD_N    = 18
CHALLENGE_ABUSE_BLOCK_TTL = 2h
CHALLENGE_ABUSE_COOLDOWN = 30m


; -----------------------------------------------------------------------------
; 5. CHALLENGE SESSION
; -----------------------------------------------------------------------------
; Challenge session model:
; CHALLENGE_COOKIE_LIFE is the real browser clearance lifetime. A valid
; cfm_clearance cookie is host/scope/IP-bound and should be the authoritative
; pass mechanism after solving a challenge.
;
; OPENRESTY_OK_IP_TTL is only an optional server-side grace cache for the same
; IP+host+scope. Set it to 0 for strict cookie-only behavior. If enabled, keep
; it short, because it can allow another browser/profile from the same IP to
; pass without its own cookie.
;
; CHALLENGE_COOLDOWN controls challenge/rechallenge suppression and should not
; be treated as the same thing as cookie lifetime.

; CHALLENGE_COOLDOWN   — after an IP is challenged, suppress re-challenge for
;                        this duration (prevents loop on legitimate users).
; CHALLENGE_COOKIE_LIFE — how long a solved-challenge cookie remains valid.
; OPENRESTY_OK_IP_TTL  — how long cfm caches a "passed" decision for OpenResty.
;                        Should match CHALLENGE_COOKIE_LIFE.
CHALLENGE_COOLDOWN    = 45m
CHALLENGE_COOKIE_LIFE = 45m
OPENRESTY_OK_IP_TTL   = 10m

; CHALLENGE_COOKIE_REFRESH — sliding clearance for active sessions.
;   1 (default) = on every accepted request, OpenResty/Angie re-mints the
;                 cfm_clearance cookie with a fresh exp = now + CHALLENGE_COOKIE_LIFE.
;                 An idle tab in cPanel/webmail/phpMyAdmin will not get
;                 re-challenged mid-session as long as the user is active.
;   0           = strict fixed expiry. The cookie's signed exp is whatever was
;                 baked at first solve; once it hits, re-challenge regardless
;                 of activity. Use this if you want a hard ceiling per solve.
; Reload the cfm daemon (or SIGHUP) after changing this — the knob is published
; to OpenResty via /var/lib/cfm/lua/cfm_bridge_config.lua at daemon start.
CHALLENGE_COOKIE_REFRESH = 1

; OPENRESTY_OK_IP_TTL — optional same-IP+host+scope anti-loop grace after solve.
;                        0 = cookie-only, recommended for hardened clearance.
;                        Keep very short if enabled, e.g. 10s-60s.
;                        Do NOT match CHALLENGE_COOKIE_LIFE unless you want
;                        same-IP browsers to share challenge clearance.


; -----------------------------------------------------------------------------
; 6. PATH-BASED TRIGGERS  (high-signal, very low false-positive rate)
; -----------------------------------------------------------------------------
; If a request URI matches any line in CHALLENGE_PATHS_FILE, the IP is
; immediately challenged.  Typical entries: webshells, dotfile probes,
; exploit filenames, scanner fingerprints.
;
;   PATHS_COUNT — hits within the window required before challenging.
;                 1 = first hit triggers (recommended for high-signal paths).
;   PATHS_TTL   — how long the IP stays in the "challenged" set.
;                 Can be short because CHALLENGE_COOLDOWN handles the rest.
CHALLENGE_PATHS      = 1
CHALLENGE_PATHS_FILE = /etc/cfm/webdetector_malpaths.txt
CHALLENGE_PATHS_COUNT = 1
CHALLENGE_PATHS_TTL  = 10m


; -----------------------------------------------------------------------------
; 7. RATE / BEHAVIOUR TRIGGERS  (threshold-based, tune per traffic profile)
; -----------------------------------------------------------------------------
; All thresholds are measured per-IP within the detector window.
; Set to 0 to disable a specific trigger.
;
;   RPS_TOTAL_MIN   — total req/sec to trigger (catch high-volume bots)
;   RPS_4XX_MIN     — 4xx-only req/sec (scanning / probing pattern)
;   RPS_5XX_MIN     — 5xx-only req/sec (exploit / stress pattern)
;   ERR_RATIO_MIN   — fraction of requests that are 4xx/5xx (0.00–1.00)
;                     0.99 = trigger only when nearly all requests error out
;   POST_RATIO_MIN  — fraction of POST requests; 0 = disabled
;                     Enable (e.g. 0.8) if login-bruteforce is a problem
;   NO_UA_MIN       — requests with empty/missing User-Agent before challenge
;   HTTP10_MIN      — HTTP/1.0 requests before challenge (real browsers never use it)
CHALLENGE_RPS_TOTAL_MIN  = 15.0
CHALLENGE_RPS_4XX_MIN    = 10.0
CHALLENGE_RPS_5XX_MIN    = 0.9
CHALLENGE_ERR_RATIO_MIN  = 0.99
CHALLENGE_POST_RATIO_MIN = 0
CHALLENGE_NO_UA_MIN      = 5
CHALLENGE_HTTP10_MIN     = 1

; IP_SCORE_RULES controls score-based actions from webdetector IP scoring.
; Format: action:min_score pairs, comma-separated.
; Allowed actions: block, challenge
; Example:
;   IP_SCORE_RULES = block:0.90,challenge:0.75
; Behavior:
;   - First matching rule (highest min_score wins) is applied.
;   - If empty/unset, score-based IP actions are disabled (safe default).
;   - Useful for older setups: no rule means this path does nothing.
; Score calculation (short-window, per IP):
;   score = rps_points + vhost_points, capped at 1.0
;   rps_points:
;     rps >= 5.0     -> +0.6 (hi_rps)
;     rps >= 1.0     -> +0.4 (med_rps)
;     rps >= 0.1     -> +0.2 (low_rps)
;   vhost_points:
;     vhosts >= 10   -> +0.3 (many_vhosts)
;     vhosts >= 3    -> +0.2 (multi_vhosts)
; Notes:
;   - req count is tracked for context/history but does not currently add score.
;   - hard abuse reasons (404/403/403waf/agent/malpath/40x_combo floods) bypass
;     this score path and can still propose immediate block.
;IP_SCORE_RULES = block:0.90,challenge:0.75


; -----------------------------------------------------------------------------
; 8. PER-IP HEURISTICS
; -----------------------------------------------------------------------------
; --- Unique paths per IP ---
; Flags IPs that crawl many distinct URLs — classic scanner/scraper pattern.
;   MIN — distinct paths seen within TTL before trigger fires
;   TTL — sliding window for path counting
;   CAP — hard cap; stop counting once reached (memory guard)
CHALLENGE_IP_UNIQPATHS_ENABLED = 1
CHALLENGE_IP_UNIQPATHS_MIN     = 220
CHALLENGE_IP_UNIQPATHS_TTL     = 20m
CHALLENGE_IP_UNIQPATHS_CAP     = 512

; --- Unique hosts per IP ---
; Flags IPs that hit many different vhosts — typical mass-scanner pattern.
;   MIN — distinct vhosts within TTL before trigger fires
;   TTL — sliding window
;   CAP — hard cap
CHALLENGE_IP_UNIQHOSTS_ENABLED = 1
CHALLENGE_IP_UNIQHOSTS_MIN     = 10
CHALLENGE_IP_UNIQHOSTS_TTL     = 30m
CHALLENGE_IP_UNIQHOSTS_CAP     = 120


; -----------------------------------------------------------------------------
; 9. PER-VHOST HEURISTICS  (unique path diversity across all IPs on one vhost)
; -----------------------------------------------------------------------------
; Useful for detecting distributed scanners where no single IP stands out but
; the vhost collectively sees an abnormal URL surface.
;   MIN — unique paths across all IPs within TTL before challenge fires
;   OFF — hysteresis lower bound (stop challenging when paths drop below this)
;   TTL — sliding window
;   CAP — stop counting at this value (early-stop, memory guard)
CHALLENGE_VHOST_UNIQPATHS_ENABLED = 1
CHALLENGE_VHOST_UNIQPATHS_MIN     = 1500
CHALLENGE_VHOST_UNIQPATHS_OFF     = 900
CHALLENGE_VHOST_UNIQPATHS_TTL     = 20m
CHALLENGE_VHOST_UNIQPATHS_CAP     = 5000


; -----------------------------------------------------------------------------
; 10. PANIC / BYPASS LISTS
; -----------------------------------------------------------------------------
; CHALLENGE_VHOST        — comma-separated vhosts in permanent manual panic mode
;                          (every request gets challenged, regardless of score).
;                          Leave empty in normal operation.
; CHALLENGE_VHOST_IGNORE — vhosts excluded from auto-mode score tracking.
;                          Use for internal APIs, monitoring endpoints, etc.
; CHALLENGE_HOST_BYPASS  — absolute override: never challenge these hosts under
;                          any rule (wins over all other triggers).
CHALLENGE_VHOST        = victim.com,
CHALLENGE_VHOST_IGNORE = api.mybank.gr, ndnodo.com, www.ndnodo.com, ndnodo.com.isocks.gr, blancdeblanc.gr, www.blancdeblanc.gr, stereotiki.gr, www.stereotiki.gr, koullaras.gr, www.koullaras.gr, *.e-nautilia.gr, e-nautilia.gr, clients.nixpal.com
CHALLENGE_HOST_BYPASS  = api.mybank.gr, stereotiki.gr, www.stereotiki.gr


; -----------------------------------------------------------------------------
; 11. SUSPICIOUS-VHOST AUTO MODE
; -----------------------------------------------------------------------------
; Automatically challenges all traffic to a vhost when it looks under attack,
; based on two independent signals that can each trigger on their own:
;
;   A) SCORE — a weighted blend of error ratio, bot UA ratio, bruteforce-like
;              POST patterns, and path diversity.  Range 0.0–1.0.
;
;   B) UNIQIP — raw count of distinct IPs hitting the vhost within the window.
;               Catches DDoS / distributed bot swarms that score individually low.
;
; Shared hysteresis parameters:
;   SCORE_ON / SCORE_OFF  — challenge fires above ON, drops below OFF.
;                           Widen the gap to reduce flapping (lalashoes pattern).
;   MIN_UNIQIP            — minimum distinct IPs required before score is even
;                           evaluated (prevents false triggers on tiny sites).
;   HOLDDOWN              — minimum time challenge stays ON after trigger, even if
;                           score/uniqIP falls back below threshold immediately.
;                           Prevents bots from simply pausing to evade.
CHALLENGE_SUSPICIOUS_VHOST           = 1
CHALLENGE_SUSPICIOUS_VHOST_SCORE_ON  = 0.72   ; raised from 0.68 to reduce sensitivity
CHALLENGE_SUSPICIOUS_VHOST_SCORE_OFF = 0.60   ; lowered from 0.64 to widen hysteresis gap
CHALLENGE_SUSPICIOUS_VHOST_MIN_UNIQIP = 60    ; raised from 35 — avoids false triggers on small flash traffic
CHALLENGE_SUSPICIOUS_VHOST_HOLDDOWN  = 25m   ; raised from 15m — bots won't outlast it

; --- UniqIP sub-mode ---
; Triggers challenge when distinct IPs alone exceed the ON threshold,
; regardless of score.  Useful for distributed attacks where individual IPs
; look clean.
;   UNIQIP_ON  — challenge fires when uniqIP count exceeds this
;   UNIQIP_OFF — challenge drops when uniqIP falls below this
;   UNIQIP_MAX — hard cap: instant-ON and stays ON while exceeded
;                Raise this for large e-commerce sites with legitimate traffic spikes
;                (e-athlos, e-vafeiadis pattern).
CHALLENGE_SUSPICIOUS_VHOST_UNIQIP     = 1
CHALLENGE_SUSPICIOUS_VHOST_UNIQIP_ON  = 150   ; raised from 100
CHALLENGE_SUSPICIOUS_VHOST_UNIQIP_OFF = 120   ; raised from 80
CHALLENGE_SUSPICIOUS_VHOST_UNIQIP_MAX = 260   ; raised from 150


; -----------------------------------------------------------------------------
; 12. EXCLUSIONS
; -----------------------------------------------------------------------------
; IPs / CIDRs in this file are never challenged (overrides all triggers above).
; Typical entries: your own monitoring IPs, Apple WKWebView range (17.0.0.0/8),
; trusted CDN egress IPs, uptime robots, payment gateway callbacks, etc.
; Challenge exclude is file-presence based: rules are loaded automatically
; when CHALLENGE_EXCLUDE_FILE exists. Delete the file to disable; override the
; path here if you keep the rules somewhere else.
CHALLENGE_EXCLUDE_FILE = /etc/cfm/webdetector_challenge_exclude.txt


; -----------------------------------------------------------------------------
; 13. OPENRESTY IN-PATH MODE
; -----------------------------------------------------------------------------
; cfm pushes allow/challenge/block decisions to OpenResty via unix socket.
; OpenResty's cfm_decisions.lua reads decisions in-path, serving the challenge
; page directly without a separate DNAT redirect.
;
; Socket API endpoints (all require header: X-CFM-Token: <OPENRESTY_TOKEN>):
;
;   GET  /nginx/decision?ip=1.2.3.4&host=example.com
;        → {"ip_action":"allow|challenge|block","vhost_action":"allow|challenge"}
;
;   POST /nginx/ip          {"ip":"1.2.3.4","action":"challenge|block","ttl_sec":600}
;   POST /nginx/ip/clear    {"ip":"1.2.3.4"}
;   POST /nginx/vhost       {"host":"example.com","action":"challenge","ttl_sec":600}
;   POST /nginx/vhost/clear {"host":"example.com"}
;   GET  /nginx/status      → active IPs/vhosts + push stats (debug)
OPENRESTY_MODE  = 1
OPENRESTY_SOCK  = /var/run/cfm/cfm_nginx.sock
OPENRESTY_BRIDGE_TRACE = 0
; cfm auto-generates a strong random token on first startup, writes it back here
; and to /var/lib/cfm/lua/cfm_bridge_token.lua for cfm.lua.
OPENRESTY_TOKEN = placeholder


; -----------------------------------------------------------------------------
; 14. ANCILLARY DETECTORS
; -----------------------------------------------------------------------------
; --- Malformed request burst ---
; Challenges IPs that send many HTTP 400 / 414 / 431 responses in a short time.
; Typical source: headless scanners fuzzing headers / URI length.
;   MIN — malformed requests within TTL before trigger
;   TTL — sliding window
CHALLENGE_MALFORMED_MIN = 15
CHALLENGE_MALFORMED_TTL = 30m

; --- User-Agent churn ---
; Challenges IPs that rotate through many distinct User-Agent strings.
; Legitimate clients (browsers, crawlers) use one or very few UAs.
;   MIN — distinct UAs within TTL before trigger
;   TTL — sliding window
;   CAP — stop counting at this value (memory guard)
CHALLENGE_UNIQUA_MIN = 8
CHALLENGE_UNIQUA_TTL = 20m
CHALLENGE_UNIQUA_CAP = 64

; --- Subnet-level aggregation ---
; Groups IPs into /PREFIX_V4 subnets and challenges the whole subnet when
; the subnet collectively shows scanner-like behaviour.  Effective against
; distributed attacks spread across a /24 block from one ASN.
;
;   PREFIX_V4     — subnet mask (24 = /24 block)
;   MIN_IPS       — distinct IPs in subnet before evaluation starts
;   MIN_REQ       — total requests from subnet within TTL
;   MIN_UNIQPATH  — distinct paths from subnet within TTL
;   MIN_UNIQHOST  — distinct vhosts from subnet within TTL
;   TTL           — sliding window
;   CAP           — max subnets tracked simultaneously (memory guard)
;   SAME_HOST     — 1 = only aggregate IPs hitting the same vhost
CHALLENGE_SUBNET_ENABLED      = 1
CHALLENGE_SUBNET_PREFIX_V4    = 24
CHALLENGE_SUBNET_MIN_IPS      = 80
CHALLENGE_SUBNET_MIN_REQ      = 120
CHALLENGE_SUBNET_MIN_UNIQPATH = 80
CHALLENGE_SUBNET_MIN_UNIQHOST = 2
CHALLENGE_SUBNET_TTL          = 20m
CHALLENGE_SUBNET_CAP          = 2048
CHALLENGE_SUBNET_SAME_HOST    = 1


; -----------------------------------------------------------------------------
; 15. CUSTOM REGEX DETECTOR (file + journald examples)
; -----------------------------------------------------------------------------
; Supports custom auth-like detectors with named capture groups:
;   (?P<ip>...) and/or (?P<user>...)
; New keys:
;   FAIL_REGEX   = multiline list (one regex per line, required)
;   IGNORE_REGEX = multiline list (optional; skipped before FAIL_REGEX match)
;   MATCH_TARGET = ip | user | both (required captures enforced)
;
; Example A: file tailing (auth.log style)
;[custom:ssh_file]
;ENABLED = 1
;MODE = file
;LOG_PATH = /var/log/auth.log
;EVERY = 2s
;WINDOW = 10m
;COOLDOWN = 20m
;AUTHFAIL_IP = 20
;AUTHFAIL_USER = 10
;MATCH_TARGET = both
;IGNORE_REGEX =
;    cfm-healthcheck
;FAIL_REGEX =
;    Failed password for (?:invalid user )?(?P<user>\\S+) from (?P<ip>\\S+)
;BLOCK = dryrun
;BLOCK_COOLDOWN = 20m
;
; Example B: journald source
;[custom:sshd_journal]
;ENABLED = 1
;MODE = journal
;JOURNAL_UNIT = ssh.service
;JOURNAL_MATCHES = _SYSTEMD_UNIT=ssh.service
;EVERY = 2s
;WINDOW = 10m
;COOLDOWN = 20m
;AUTHFAIL_IP = 12
;AUTHFAIL_USER = 8
;MATCH_TARGET = ip
;FAIL_REGEX =
;    Failed password for .* from (?P<ip>\\S+) port \\d+ ssh2
;BLOCK = 1h
