# cfm dnat cpanel listener template for OpenResty.
# Install path: /etc/angie/conf/cfm-panel-listeners.conf

# HTTPS panel listeners
server { listen 12083 ssl; server_name _; set $cfm_panel_origin "https://127.0.0.1:2083"; set $cfm_panel_challenge_mode "guard-only"; set $cfm_pass ""; set $cfm_upstream "cfm_panel_2083"; access_by_lua_file /etc/angie/lua/cfm_panel.lua; location / { proxy_pass $cfm_pass; proxy_bind 127.0.0.1; proxy_set_header Host $host; proxy_set_header Proxy ""; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Host $host; proxy_set_header X-Forwarded-Port 2083; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-Server $host; proxy_set_header CF-Connecting-IP $remote_addr; proxy_request_buffering off; proxy_buffering off; proxy_connect_timeout 300s; proxy_read_timeout 300s; proxy_send_timeout 300s; } }
