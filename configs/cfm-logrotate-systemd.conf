# CFM: let logrotate.service rotate the OpenResty edge logs.
# Installed as /etc/systemd/system/logrotate.service.d/cfm-openresty.conf by
# the package (package-proxy-config-deploy.sh) and install-openresty.sh.
#
# EL9 / CloudLinux 9 ship logrotate.service with ProtectSystem=full, which
# makes /usr read-only to it. The OpenResty logs live under
# /usr/local/openresty/nginx/logs, so the daily run failed on them with
# "Read-only file system" every night and the unit ended `failed`; worse, it
# still recorded them as rotated, so only the hourly maxsize pass
# (cfm-logrotate cron) ever rotated them (2026-10-10: titan and rigel kept
# access-panel.log since July and May). The leading "-" lets the unit start
# on a host without OpenResty. EL8 (ProtectSystem=no) is unaffected.
[Service]
ReadWritePaths=-/usr/local/openresty/nginx/logs
