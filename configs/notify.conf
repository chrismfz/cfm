###############################################################################
# CFM Notifier — global settings
###############################################################################
[notifier]
# Master ON/OFF for the notifier. If 0, nothing is sent anywhere.
enabled = 1

# Default cooldown used when a detector doesn't specify its own override.
# Also used as the fallback TTL for deduplication (see [dedupe] below).
default_cooldown = 5m

# Optional: write every emitted event to this JSON Lines file for auditing.
jsonl_path = /var/lib/cfm/notify.log.jsonl

# Subject template. Available fields commonly include:
#  .Host, .Kind, .Section, .SrcIP, .ASN, .ASNName, .Country, .PTR,
#  .Count, .When, .Samples (slice), and .Extra (map)
# Tip: You can reference Extra keys via (index .Extra "key")
subject_template = [CFM] {{.Host}} — {{.Kind}} {{.SrcIP}} ({{.ASN}}{{if and .ASN .Country}}, {{end}}{{.Country}}) {{with (index .Extra "block_mode")}}mode={{.}}{{end}}{{with (index .Extra "ttl_text")}} ttl={{.}}{{end}} reason={{.Reason}}

# Optional body template. If omitted, a compact default is used.
# body_template = {{.When}} {{.Host}} {{.Kind}} {{.SrcIP}} {{.Reason}}

###############################################################################
# De-duplication (suppresses repeats for a cooldown period)
###############################################################################
[dedupe]
# How we identify "same alert" repeats. You can use any fields from the event.
# Common choices: Host, Kind, Section, SrcIP, Reason, Key, etc.
key = {{.Host}}|{{.Kind}}|{{.SrcIP}}|{{.Reason}}

# TTL for the dedupe key above. If unset, falls back to [notifier].default_cooldown
cooldown = 5m


###############################################################################
# Channels — define as many as you like; order matters (used as default order)
###############################################################################

# ---- Sendmail (local MTA) ----
[channel "sendmail"]
type = sendmail
enabled = 1
path = /usr/sbin/sendmail
# Leave from empty and will send as root@hostname
from =
to   = logs@server
# Optional per-channel subject override:
# subject_template = [CFM] {{.Host}} — {{.Kind}} {{.SrcIP}} reason={{.Reason}}

# ---- SMTP (remote relay) ----
[channel "smtp"]
type = smtp
enabled = 0
host = smtp.example.net:587
user = cfm@example.net
pass = ${ENV:CFM_SMTP_PASS}          # environment expansion supported
from = cfm@example.net
to   = ops@example.net
starttls = 1

# ---- Slack (webhook) ----
[channel "slack"]
type = slack_webhook
enabled = 0                             # enable globally; per-detector routing decides who uses it
webhook_url = https://hooks.slack.com/services/XXX/YYY/ZZZ
mention = @chris                        # if empty, omit mention
username = CFM


###############################################################################
# Per-detector routing & overrides
#
# Match priority when an event is emitted:
#   1) exact Section name  (e.g. "mysql", "dovecot_auth", "health")
#   2) exact Kind          (e.g. "HEALTH/CONN_EST_SPIKE")
#   3) Kind root (before "/")  (e.g. "health")
#   4) "*" wildcard (default)
#
# Keys you can set in each [detector "..."] block:
#   notify       = 1|0        # enable/disable this detector’s notifications entirely
#   channels     = a,b,c      # restrict to these channel names (overrides global list)
#   cooldown     = 2m         # overrides dedupe TTL for this detector’s alerts
#   min_severity = info|warn|critical
#
# Notes:
# - If channels is omitted or empty, we use the global channel list (in order).
# - If min_severity is set, alerts with a lower severity are ignored.
#   (If detectors don’t set severity, it defaults to "info".)
# - If notify=0, alerts from this detector are dropped before sending.
###############################################################################

# Default routing (fallback for everything not explicitly matched below):
[detector "*"]
channels = sendmail                    # email-only by default
cooldown = 5m                          # per-detector dedupe TTL override (optional)

# Health: send to Slack + email (even if blocks are noisy)
[detector "health"]                    # matches Section "health" and all HEALTH/* kinds
channels = sendmail, slack
min_severity = info                    # accept all severities (info/warn/critical)
cooldown = 2m

# Example: only a specific health kind
[detector "HEALTH/CONN_EST_SPIKE"]
channels = slack, sendmail             # ensure ESTABLISHED spikes show up in Slack quickly

# SSH auth: keep it email-only (no Slack), with longer cooldown
[detector "ssh_auth"]                  # matches Section name
channels = sendmail
cooldown = 10m

# MySQL denied logins: email-only
[detector "mysql"]
channels = sendmail

# Autoblock (if you emit such events via a "autoblock" Section or Kind root)
[detector "autoblock"]
channels = sendmail
cooldown = 15m
# notify = 0                            # uncomment to silence all autoblock notifications

# Exim security: allow Slack only for critical severities (if you set ev.Severity)
[detector "exim_security"]
channels = slack, sendmail
min_severity = info


# ----------------------------------------------------------------------------
# Clam routing
#
# CLAM events have Section="clam" and Kind="CLAM/UPLOAD" or "CLAM/INFECTED".
# The matcher priority is: exact Section → exact Kind → Kind root → "*".
#
# Goal: silence the noisy per-upload notifications (one per scanned file,
# even when result=clean) and only alert on actual infections.
#
# Important: do NOT add a `[detector "clam"]` block — that would match at
# priority 1 (Section) and override the CLAM/INFECTED block below, because
# Section beats exact-Kind. Route at the Kind level instead.
#
# `notify = 0` short-circuits delivery in notify.go (the event is dropped
# before channels/severity are evaluated). The default when `notify` is
# omitted is true, so it must be set explicitly to silence.
# ----------------------------------------------------------------------------

# Drop every CLAM/UPLOAD notification (scan-result-per-file noise).
# The [clam_scan] log lines still get written to the CLAM log file — this
# only affects notifications (email/Slack).
[detector "CLAM/UPLOAD"]
notify = 0

# Real infections: email + Slack, critical only, 15m dedupe.
[detector "CLAM/INFECTED"]
channels = sendmail, slack
min_severity = critical
cooldown = 15m

# ----------------------------------------------------------------------------
# Outbound abuse routing
#
# outbound_abuse fires when a local UID exceeds a burst threshold on outbound
# SMTP / HTTP(S) (see internal/outbound/alerter.go). It defaults to severity
# "warning", which on a busy shared host can be chatty (one alert per UID per
# minute when something keeps tripping the threshold).
#
# This is NOT silenced (notify=0) on purpose: the signal usually means a
# compromised cPanel/mail user is blasting spam, and you want to see it. We
# just throttle the volume:
#   - min_severity = critical  → drops default "warning" bursts; only fires
#                                when the detector escalates an event itself.
#   - cooldown     = 30m       → one alert per dedupe key (UID/IP) per 30m.
#
# Section-level match (priority 1) so any future outbound_* Kind inherits it.
# ----------------------------------------------------------------------------
[detector "outbound"]
channels = sendmail
min_severity = critical
cooldown = 30m

###############################################################################
# Tips
#
# • To silence a detector entirely:
#     [detector "ftpd"]
#     notify = 0
#
# • To target by full Kind string instead of Section:
#     [detector "MYSQL/UNAUTH_SCANS"]
#     channels = slack
#
# • If you define both [detector "health"] and [detector "HEALTH/CONN_EST_SPIKE"],
#   the exact Kind match takes precedence for spike alerts, and the Section match
#   applies to other health alerts.
#
# • Order of [detector "..."] blocks doesn't matter — priority is by specificity.
###############################################################################
