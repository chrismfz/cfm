[notifier]
enabled = 1
default_cooldown = 5m
jsonl_path = /var/lib/cfm/notify.log.jsonl
# Optional: hostname_override = titan.myip.gr
# Default subject includes ASN and Country:
subject_template = [CFM] {{.Host}} — {{.Kind}} {{.SrcIP}} ({{.ASN}}, {{.Country}}) reason={{.Reason}} ttl={{.TTL}}
# Simple default body (plain text) - optional:
#body_template = {{.When}} {{.TZ}}
#Host: {{.Host}}
#Kind: {{.Kind}}
#IP: {{.SrcIP}}
#ASN: {{.ASN}}
#Country: {{.Country}}
#PTR: {{.PTR}}
#Reason: {{.Reason}}
#TTL: {{.TTL}}
#Count: {{.Count}}
#Section: {{.Section}}

#{{- if .Samples}}
#Sample lines:
#{{- range .Samples}}
#{{.}}
#{{- end}}
#{{- end}}

[dedupe]
# Combine host+kind+ip+reason:
key = {{.Host}}|{{.Kind}}|{{.SrcIP}}|{{.Reason}}
cooldown = 5m

# ---- Channels ----

[channel "sendmail"]
type = sendmail
enabled = 1
path = /usr/sbin/sendmail
from = cfm@titan.myip.gr
to = admin@myip.gr , chrismfz@gmail.com
# Optional per-channel subject override:
# subject_template = [CFM] {{.Host}} — {{.Kind}} {{.SrcIP}} ({{.ASN}}, {{.Country}}) reason={{.Reason}} ttl={{.TTL}}

[channel "smtp"]
type = smtp
enabled = 0
host = smtp.example.net:587
user = cfm@example.net
pass = ${ENV:CFM_SMTP_PASS}
from = cfm@example.net
to = ops@example.net
starttls = 1

[channel "slack"]
type = slack_webhook
enabled = 1
webhook_url = ${ENV:SLACK_WEBHOOK_URL}
mention = @ops
username = CFM
icon_emoji = :rotating_light:
