[notifier]
enabled = 1
default_cooldown = 5m
jsonl_path = /var/lib/cfm/notify.log.jsonl

# Subject: show mode (permanent|ttl) and ttl text when available
subject_template = [CFM] {{.Host}} — {{.Kind}} {{.SrcIP}} ({{.ASN}}{{if and .ASN .Country}}, {{end}}{{.Country}}) {{with (index .Extra "block_mode")}}mode={{.}}{{end}}{{with (index .Extra "ttl_text")}} ttl={{.}}{{end}} reason={{.Reason}}

# Body: include everything cleanly, and samples if provided
body_template = {{.When}}
Host: {{.Host}}
Kind: {{.Kind}}
IP: {{.SrcIP}}
ASN: {{.ASN}}
Country: {{.Country}}
PTR: {{.PTR}}
Reason: {{.Reason}}
Mode: {{index .Extra "block_mode"}}
TTL: {{if .TTL}}{{.TTL}}{{else}}{{index .Extra "ttl_text"}}{{end}}
Count: {{.Count}}
Section: {{.Section}}
{{- if .Samples}}

Sample lines:
{{- range .Samples}}
{{.}}
{{- end}}
{{- end}}



[dedupe]
# Combine host+kind+ip+reason:
key = {{.Host}}|{{.Kind}}|{{.SrcIP}}|{{.Reason}}
cooldown = 5m

# ---- Channels ----

[channel "sendmail"]
type = sendmail
enabled = 1
path = /usr/sbin/sendmail
from = cfm@titan.myip.gr
to = admin@myip.gr , chrismfz@gmail.com
# Optional per-channel subject override:
# subject_template = [CFM] {{.Host}} — {{.Kind}} {{.SrcIP}} ({{.ASN}}, {{.Country}}) reason={{.Reason}} ttl={{.TTL}}

[channel "smtp"]
type = smtp
enabled = 0
host = smtp.example.net:587
user = cfm@example.net
pass = ${ENV:CFM_SMTP_PASS}
from = cfm@example.net
to = ops@example.net
starttls = 1

[channel "slack"]
type = slack_webhook
enabled = 1
webhook_url = ${ENV:SLACK_WEBHOOK_URL}
mention = @ops
username = CFM
icon_emoji = :rotating_light:
