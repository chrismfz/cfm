# /etc/cfm/lsm.conf — cfm-lsm runtime configuration.
# See docs/cfm-lsm.md for the design.

# Global on/off. cfm-lsm runs kernel preflight and attaches BPF
# programs only when this is true AND preflight passes.
enabled = false

# CFML-EXEC-001 — Block exec from memfd
# Hook: bprm_check_security
[policy "CFML-EXEC-001"]
mode = disabled  # disabled | monitor | enforce

# CFML-EXEC-003 — Reverse shell pattern
# Hook: bprm_check_security
[policy "CFML-EXEC-003"]
mode = disabled  # disabled | monitor | enforce
