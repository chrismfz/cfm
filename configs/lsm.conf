# /etc/cfm/lsm.conf — cfm-lsm runtime configuration.
# See docs/cfm-lsm.md for the design.

# Global on/off. cfm-lsm runs kernel preflight and attaches BPF
# programs only when this is true AND preflight passes.
# switching temp in true for monitor only purposes - leave it true
enabled = true

# Watched-uid extension threshold. Every uid in /etc/passwd at or
# above this value joins cfm_watched_uids alongside the static
# WebUserNames (apache / nginx / www-data / nobody / lighttpd /
# caddy / tomcat / php / lsphp / proxy / alt-php-*) and any
# cPanel / DirectAdmin manifest contributions. Three layers
# (static names, panel manifest, uid-range fallback) are always
# additive — set this knob to 0 to disable the fallback layer.
#
#    0             disable the fallback (rely on static names +
#                  panel manifest only — admin / sysadmin accounts
#                  at uid >= 1000 will NOT be watched on a panel host)
#   1000 (default) the /etc/login.defs UID_MIN convention — watches
#                  every regular login account, including admins.
#                  Pair with exclude_user / exclude_uid / exclude_gid
#                  below to opt-out known-trusted admin accounts.
#   >0             explicit threshold; any other positive value works.
#
# -1 is accepted as a deprecated alias for 1000 (the auto-detect
# behaviour was removed because it silently created an admin-account
# coverage gap on panel hosts). Adoption emits a one-time warning
# when -1 is parsed; will become a parse error in a future release.
watched_uid_fallback_min = 1000

# Opt-out: accounts to exclude from cfm_watched_uids even when the
# fallback above or the panel manifest would otherwise include them.
# Repeat the key per entry. Used to keep legitimate admin / sysadmin /
# batch-job sessions quiet without dropping coverage of the rest of
# the host's uid >= fallback range.
#
# Footgun: excludes apply to EVERY uid produced by the three layers
# above, including the static web-daemon names (apache, nginx,
# nobody, ...). `exclude_user = apache` or an `exclude_gid` that
# catches apache's primary group WILL drop apache from the watched
# set — which is rarely what you want. Use exclude_uid / exclude_user
# with care, and inspect `bpftool map dump pinned
# /sys/fs/bpf/cfm/maps/cfm_watched_uids` after `cfm lsm restart` to
# confirm the set looks correct.
#
# Note on exclude_gid: this matches /etc/passwd's PRIMARY group
# (column 4) only. Supplementary groups in /etc/group are NOT
# consulted — `exclude_gid = 10` (the `wheel` gid on RHEL) will NOT
# exclude every user listed in /etc/group's wheel entry, only those
# whose /etc/passwd primary gid is 10.
#
# exclude_user = chris        # by username (resolved at adoption time;
#                             # missing names skip silently)
# exclude_uid  = 1001         # by numeric uid
# exclude_gid  = 10           # by primary gid (/etc/passwd col 4 only)

# CFML-EXEC-001 — Block exec from memfd
# Hook: bprm_check_security
[policy "CFML-EXEC-001"]
mode = monitor  # disabled | monitor | enforce

# CFML-EXEC-003 — Reverse shell pattern
# Hook: bprm_check_security
[policy "CFML-EXEC-003"]
mode = monitor  # disabled | monitor | enforce
# Site-specific spawn(8) helper scripts (mailcow / custom inetd-style
# services). Global cross-distro entries already live in [allow] below.
# allow_exe = /usr/local/bin/whitelist_forwardinghosts.sh

# CFML-EXEC-004 — Deleted-file exec by web user
# Hook: bprm_check_security
[policy "CFML-EXEC-004"]
mode = monitor  # disabled | monitor | enforce

# CFML-EXEC-005 — Suspicious interpreter network stdio
# Hook: bprm_check_security
[policy "CFML-EXEC-005"]
mode = monitor  # disabled | monitor; enforce is downgraded to monitor
# Site-specific spawn(8) helper scripts (mailcow / custom inetd-style
# services). Global cross-distro entries already live in [allow] below.
# allow_exe = /usr/local/bin/whitelist_forwardinghosts.sh

# CFML-EXEC-006 — Web-user exec from ephemeral filesystem
# Hook: bprm_check_security
# Catches a watched (web-class) uid execve'ing a binary whose backing file
# lives on tmpfs (/dev/shm, /run/user/<uid>/, distro /tmp on tmpfs) or
# under /tmp/ or /var/tmp/ on a non-tmpfs root. Execution-phase companion
# to Imunify Proactive Defense's write-phase guard: catches the staged-
# payload-and-exec pattern at the kernel layer when the PHP-layer guard
# is absent or bypassed.
# Monitor-first; enforce returns -EPERM. Allowlist legitimate ephemeral-fs
# exec workflows (package installers, cPanel easyapache builds) via
# allow_exe / allow_path before promoting to enforce.
[policy "CFML-EXEC-006"]
mode = monitor  # disabled | monitor | enforce
# Allowlist legitimate ephemeral-fs execs (package installer extractions,
# cPanel easyapache builds, distro ldconfig re-runs). The userspace
# post-filter matches event basenames against the entries here.
# allow_exe = /tmp/easyapache/build-helper

# CFML-FS-005 — Sensitive-file modification by web user
# Hook: inode_{setattr,create,unlink,link,rename,setxattr}
[policy "CFML-FS-005"]
mode = monitor  # disabled | monitor | enforce
origin_tracking = monitor  # disabled | monitor (origin-only matches never enforce yet)


# Add host-persistence locations to monitor. Repeat the key per entry;
# absolute concrete paths only. Additions are monitor-only even if mode=enforce.
# persistence_path = /etc/systemd/system
# persistence_path = /usr/local/directadmin/scripts/custom

# CFML-FS-006 — Sensitive read via root-owned fd from unprivileged task
# Hook: file_permission
# Detects the setuid-helper fd-leak class (pidfd_getfd exit-window race
# against ssh-keysign / chage / unix_chkpwd, plus older CLONE_FILES and
# /proc/<pid>/fd variants). Kernsec kernel.yama.ptrace_scope=2 closes the
# modern primitive at the kernel layer; FS-006 is the belt-and-braces
# layer for hosts that state=skip that rule for same-uid debuggability.
# Monitor-only by design — passwd / pkexec / sudo / dovecot-auth / postfix
# legitimately read these files post-uid-drop. Returning -EPERM here would
# break authentication.
[policy "CFML-FS-006"]
mode = monitor  # disabled | monitor; enforce is downgraded to monitor


# CFML-FS-007 — Privilege-primitive install by web user
# Hooks: inode_setattr (suid/sgid bit via chmod)
#        inode_setxattr (security.capability via setcap)
# Catches the install step of the classic Linux persistence pattern:
# attacker drops a binary then grants it a root-acquiring primitive
# (`chmod 4755 /tmp/.bd` or `setcap cap_setuid+ep /tmp/.bd`) so a
# later unprivileged shell can re-enter root without re-exploiting.
# Companion to CFML-CRED-002 which catches the use of the dropped
# primitive; FS-007 fires at write-time, before the second exec.
# Watched-uid gated — only fires when the calling task is a web-class
# user (apache / nginx / php-fpm / panel-managed account); admin
# chmods of legitimate setuid binaries by root or by an admin shell
# do not trip the rule.
# Monitor-first; enforce returns -EPERM out of chmod/setxattr (safe
# to enable on a panel host — there is no legitimate workflow for a
# web-class uid to set suid or security.capability).
[policy "CFML-FS-007"]
mode = monitor  # disabled | monitor | enforce


# CFML-EXEC-007 — Kernel module load by non-trusted comm
# Hooks: tracepoint/syscalls/sys_enter_init_module
#        tracepoint/syscalls/sys_enter_finit_module
# Catches kernel-rootkit installer primitives: any caller of
# init_module / finit_module whose comm is not in the small trusted
# set (modprobe / insmod / kmod / systemd / systemd-modules /
# systemd-udevd). Watched-uid attempts are tagged WEB_ORIGIN.
# Monitor ONLY by design — tracepoint hooks are observation-only,
# enforce is structurally impossible (kernel ignores BPF return).
# For an actual block, set kernel.modules_disabled=1 via kernsec
# (KSEC-MOD-kspp.kernel-007) on hosts that don't load modules
# post-boot; EXEC-007 is the always-on telemetry alongside.
[policy "CFML-EXEC-007"]
mode = monitor  # disabled | monitor; enforce is downgraded to monitor


# CFML-EXEC-008 — kexec_load / kexec_file_load by non-trusted comm
# Hooks: tracepoint/syscalls/sys_enter_kexec_load
#        tracepoint/syscalls/sys_enter_kexec_file_load
# Catches rootkit-persistence primitives via post-boot kernel
# replacement: an attacker with root + CAP_SYS_BOOT stages a
# backdoored kernel image, then the next kexec_reboot boots that
# image without going through firmware. Trusted-comm allowlist:
# kexec (kexec-tools, also what kdump.service invokes) and
# systemctl (`systemctl kexec`). Anything else fires.
# Monitor ONLY by design — tracepoint hooks are observation-only,
# enforce is structurally impossible (kernel ignores BPF return).
# For an actual block, set kernel.kexec_load_disabled=1 via kernsec
# (KSEC-SCT-kspp.kexec-001) on non-kdump hosts; CFML-EXEC-008 is
# the always-on telemetry alongside (and the forensic trail of
# attackers probing the lockout on hosts that have it on).
[policy "CFML-EXEC-008"]
mode = monitor  # disabled | monitor; enforce is downgraded to monitor


# CFML-FS-008 — Write to a sensitive kernel knob
# Hook: file_permission
# Watches the small fixed set of /proc/sys and /sys nodes every
# public Linux kernel exploit pivots through once it has the write
# primitive: core_pattern, modprobe_path, hotplug, sysrq-trigger,
# uevent_helper, binfmt_misc/register. Writer comm allowlist:
# cfm / sysctl / systemd / systemd-sysctl. Everything else writing
# any of these knobs is the signal.
# Monitor by default. Enforce-capable but requires telemetry first
# — an unanticipated legitimate writer (operator tuning script, RPM
# postinstall) would otherwise silently fail. Promote to enforce
# only after a monitor window confirms no in-the-wild legitimate
# writer outside the trusted set.
[policy "CFML-FS-008"]
mode = monitor  # disabled | monitor | enforce


# CFML-CRED-002 — Privilege escalation without setuid path
# Hook: task_fix_setuid
[policy "CFML-CRED-002"]
mode = monitor  # disabled | monitor; enforce is downgraded to monitor
# Narrow this policy further by adding allow_exe lines here, or use the
# global [allow] section below to apply across every cfm-lsm detector.
allow_exe = /usr/local/directadmin/directadmin
allow_exe = /usr/local/cpanel/cpanel

# CFML-CRED-003 — Direct root credential install
# Hook: fentry/commit_creds
[policy "CFML-CRED-003"]
mode = monitor  # disabled | monitor; enforce is downgraded to monitor

# CFML-BPF-001 — Unexpected BPF use
# Hook: tracepoint/syscalls/sys_enter_bpf
[policy "CFML-BPF-001"]
mode = monitor  # disabled | monitor; enforce is downgraded to monitor


# CFML-OBS-004 — ptrace by web-class user
# Hook: lsm/ptrace_access_check
# Watches PTRACE_MODE_READ / PTRACE_MODE_ATTACH attempts from a
# watched (web-class) uid. Catches the sibling-worker credential-
# theft pattern (vhost user ptraces their own PHP-FPM worker to
# inject shellcode or steal in-memory secrets) and cross-tenant
# introspection. Self-ptrace is skipped. Root callers (gdb /
# strace / systemd / container runtimes) are filtered out by the
# watched-uid gate.
# Monitor ONLY by design — kernel.yama.ptrace_scope=2 (kernsec) is
# the actual block layer. Enforce-capable in the hook but
# downgraded at enable time because legitimate developer workflows
# (operator su'ing to a vhost user to debug a worker via gdb) would
# otherwise break with no security benefit yama doesn't already
# provide.
[policy "CFML-OBS-004"]
mode = monitor  # disabled | monitor; enforce is downgraded to monitor
# Narrow this policy further by adding allow_comm lines here, or use
# the global [allow] section below to apply across every cfm-lsm
# detector that consults a comm allowlist.
# allow_comm = my-orchestrator


# Global allowlist — applied to every cfm-lsm detector that consults
# an exe / comm / script-prefix allowlist (today: CFML-CRED-002,
# CFML-EXEC-003, CFML-EXEC-005, CFML-EXEC-006, CFML-BPF-001).
#   allow_exe            — matched by basename in the userspace post-filter;
#                          also stat()'d into the BPF-side cfm_setuid_inodes
#                          map for CFML-CRED-002 when the path exists.
#   allow_comm           — exact-match against task->comm (kernel truncates
#                          to TASK_COMM_LEN-1 = 15 chars).
#   allow_path  — directory prefix matched against any arg of
#                          /proc/<pid>/cmdline at event time. Needed for
#                          Python / Perl daemons where exe is the generic
#                          interpreter and comm is generic (e.g. `python3`)
#                          — the script path is what actually identifies them.
