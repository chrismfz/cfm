# /etc/cfm/lsm.conf — cfm-lsm runtime configuration.
# See docs/cfm-lsm.md for the design.

# Global on/off. cfm-lsm runs kernel preflight and attaches BPF
# programs only when this is true AND preflight passes.
enabled = false

# CFML-EXEC-001 — Block exec from memfd
# Hook: bprm_check_security
[policy "CFML-EXEC-001"]
mode = disabled  # disabled | monitor | enforce

# CFML-EXEC-003 — Reverse shell pattern
# Hook: bprm_check_security
[policy "CFML-EXEC-003"]
mode = disabled  # disabled | monitor | enforce

# CFML-FS-005 — Sensitive-file modification by web user
# Hook: inode_setattr / inode_create / inode_unlink / inode_link / inode_rename / inode_setxattr
#
# Fires when a web-class user (apache, nginx, php-fpm, lsphp, alt-php-*,
# every cPanel / DirectAdmin account uid, plus the static set in
# internal/lsm/maps.go's WebUserNames) attempts to write-class operate
# on a host-sensitive file (/etc/passwd, /etc/shadow, /etc/sudoers*,
# /etc/cron*, /etc/ssh/*, /root/.ssh/, /etc/pam.d/, …).
#
# Near-zero FP on CageFS hosts (CageFS already hides those paths from
# caged users — if cfm-lsm sees the access, caging was bypassed, which
# is itself a compromise indicator). Low-medium FP on plain hosts.
#
# origin_tracking=monitor also matches a process that started under a
# watched web/panel uid and later became uid 0. Origin-only matches are
# always report-only for now, even when mode=enforce, so production
# telemetry can establish the false-positive profile first.
[policy "CFML-FS-005"]
mode = disabled  # disabled | monitor | enforce
origin_tracking = monitor  # disabled | monitor (origin-only matches never enforce yet)

# CFML-CRED-002 — Privilege escalation without setuid path
# Hook: task_fix_setuid
#
# Fires when a setuid()-family syscall transitions a process to
# effective uid 0 from non-zero without going through a recognised
# setuid binary (mm->exe_file inode is not in the daemon-populated
# cfm_setuid_inodes whitelist). Catches the canonical post-exploit
# pivot where a webshell calls setresuid(0,0,0) after a kernel
# exploit installed root creds (Dirty Pipe / pwnkit /
# CVE-2022-0185-class cash-ins).
#
# Scope note: task_fix_setuid does NOT fire when an exploit installs
# creds directly via commit_creds() without going through a userspace
# setuid syscall. CFML-CRED-003 below is the complementary
# monitor-only telemetry for that direct-install path.
#
# Monitor-only by design: returning -EPERM from the cred-install
# path can deadlock systemd helpers and pkexec mid-transition.
# Setting mode=enforce here is silently downgraded to monitor with
# a warning at `cfm lsm enable` time.
[policy "CFML-CRED-002"]
mode = disabled  # disabled | monitor; enforce is downgraded to monitor
# Allowlist binaries that legitimately call setresuid(0,…) without
# the suid bit on disk (panel daemons, custom helpers). Repeat the
# key per entry; absolute paths only. Resolved at daemon start —
# missing paths are skipped silently so stale entries don't block
# enable. The (dev, inode) of each resolved path is merged into the
# same cfm_setuid_inodes BPF map populated from the suid-bit walk,
# so the kernel-side check is unchanged.
# allow_exe = /usr/local/directadmin/directadmin
# allow_exe = /usr/local/cpanel/cpanel

# CFML-CRED-003 — Direct root credential install
# Hook: fentry/commit_creds
#
# Tracing program that compares the current task's active credentials
# with the cred pointer being installed via commit_creds(). Fires when
# a non-root task (old uid/euid != 0) installs root credentials
# (new uid/euid == 0) AND the cred pointer was not just observed by
# task_fix_setuid — i.e. the syscall path that CRED-002 covers.
# This is the canonical fingerprint for kernel-exploit payloads that
# call commit_creds(prepare_kernel_cred(NULL)) without going through
# a userspace setuid syscall.
#
# Monitor-only by design: fentry/commit_creds is tracing, not an LSM
# decision hook, so this program cannot block. Setting mode=enforce
# here is silently downgraded to monitor with a warning at
# `cfm lsm enable` time.
#
# Per-policy availability: if the running kernel does not expose
# commit_creds as a usable tracing target, preflight reports only
# CFML-CRED-003 as unavailable; the rest of cfm-lsm continues to attach.
[policy "CFML-CRED-003"]
mode = disabled  # disabled | monitor; enforce is downgraded to monitor

# dmesg / /dev/kmsg emission. Lines are tagged `CFM-LSM:` so they
# are easy to grep for, and show up in `dmesg`, `journalctl -k`, and
# (on most distros) /var/log/messages alongside kernel events.
#
# To route CFM-LSM lines into a dedicated file instead of the system
# log catch-all, drop in configs/rsyslog/cfm-lsm.conf and reload
# rsyslog. See docs/cfm-lsm.md → "Where events go" for details.
[kmsg]
state_transitions   = true   # ALIVE / ADOPT / STATE / ISSUE on enable/disable/adopt/stop
detect_events       = true   # one DETECT line per detection (rate-limited below)
detect_rate_per_min = 10     # cap DETECT lines per policy per minute; 0 disables cap (not recommended)
