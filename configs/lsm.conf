# /etc/cfm/lsm.conf — cfm-lsm runtime configuration.
# See docs/cfm-lsm.md for the design.

# Global on/off. cfm-lsm runs kernel preflight and attaches BPF
# programs only when this is true AND preflight passes.
enabled = false

# CFML-EXEC-001 — Block exec from memfd
# Hook: bprm_check_security
[policy "CFML-EXEC-001"]
mode = disabled  # disabled | monitor | enforce

# CFML-EXEC-003 — Reverse shell pattern
# Hook: bprm_check_security
[policy "CFML-EXEC-003"]
mode = disabled  # disabled | monitor | enforce

# CFML-FS-005 — Sensitive-file modification by web user
# Hook: inode_setattr / inode_create / inode_unlink / inode_link / inode_rename / inode_setxattr
#
# Fires when a web-class user (apache, nginx, php-fpm, lsphp, alt-php-*,
# every cPanel / DirectAdmin account uid, plus the static set in
# internal/lsm/maps.go's WebUserNames) attempts to write-class operate
# on a host-sensitive file (/etc/passwd, /etc/shadow, /etc/sudoers*,
# /etc/cron*, /etc/ssh/*, /root/.ssh/, /etc/pam.d/, …).
#
# Near-zero FP on CageFS hosts (CageFS already hides those paths from
# caged users — if cfm-lsm sees the access, caging was bypassed, which
# is itself a compromise indicator). Low-medium FP on plain hosts.
[policy "CFML-FS-005"]
mode = disabled  # disabled | monitor | enforce

# CFML-CRED-002 — Privilege escalation without setuid path
# Hook: cred_prepare
#
# Fires when a process gains effective uid 0 from non-zero without
# going through a recognised setuid binary (mm->exe_file inode is
# not in the daemon-populated cfm_setuid_inodes whitelist). The
# canonical kernel-exploit-completion fingerprint — catches Dirty
# Pipe / pwnkit / CVE-2022-0185-class cash-ins after they succeed,
# before the attacker uses the privilege.
#
# Monitor-only by design: returning -EPERM from cred_prepare can
# deadlock systemd helpers mid-transition. Setting mode=enforce
# here is silently downgraded to monitor with a warning at
# `cfm lsm enable` time.
[policy "CFML-CRED-002"]
mode = disabled  # disabled | monitor; enforce is downgraded to monitor

# dmesg / /dev/kmsg emission. Lines are tagged `CFM-LSM:` so they
# are easy to grep for, and show up in `dmesg`, `journalctl -k`, and
# (on most distros) /var/log/messages alongside kernel events.
#
# To route CFM-LSM lines into a dedicated file instead of the system
# log catch-all, drop in configs/rsyslog/cfm-lsm.conf and reload
# rsyslog. See docs/cfm-lsm.md → "Where events go" for details.
[kmsg]
state_transitions   = true   # ALIVE / ADOPT / STATE / ISSUE on enable/disable/adopt/stop
detect_events       = true   # one DETECT line per detection (rate-limited below)
detect_rate_per_min = 10     # cap DETECT lines per policy per minute; 0 disables cap (not recommended)
