# /etc/cfm/lsm.conf — cfm-lsm runtime configuration.
# See docs/cfm-lsm.md for the design.

# Global on/off. cfm-lsm runs kernel preflight and attaches BPF
# programs only when this is true AND preflight passes.
enabled = false

# CFML-EXEC-001 — Block exec from memfd
# Hook: bprm_check_security
[policy "CFML-EXEC-001"]
mode = monitor  # disabled | monitor | enforce

# CFML-EXEC-003 — Reverse shell pattern
# Hook: bprm_check_security
[policy "CFML-EXEC-003"]
mode = monitor  # disabled | monitor | enforce
# Site-specific spawn(8) helper scripts (mailcow / custom inetd-style
# services). Global cross-distro entries already live in [allow] below.
# allow_exe = /usr/local/bin/whitelist_forwardinghosts.sh

# CFML-EXEC-004 — Deleted-file exec by web user
# Hook: bprm_check_security
[policy "CFML-EXEC-004"]
mode = monitor  # disabled | monitor | enforce

# CFML-EXEC-005 — Suspicious interpreter network stdio
# Hook: bprm_check_security
[policy "CFML-EXEC-005"]
mode = monitor  # disabled | monitor; enforce is downgraded to monitor
# Site-specific spawn(8) helper scripts (mailcow / custom inetd-style
# services). Global cross-distro entries already live in [allow] below.
# allow_exe = /usr/local/bin/whitelist_forwardinghosts.sh

# CFML-FS-005 — Sensitive-file modification by web user
# Hook: inode_{setattr,create,unlink,link,rename,setxattr}
[policy "CFML-FS-005"]
mode = monitor  # disabled | monitor | enforce
origin_tracking = monitor  # disabled | monitor (origin-only matches never enforce yet)


# Add host-persistence locations to monitor. Repeat the key per entry;
# absolute concrete paths only. Additions are monitor-only even if mode=enforce.
# persistence_path = /etc/systemd/system
# persistence_path = /usr/local/directadmin/scripts/custom

# CFML-FS-006 — Sensitive read via root-owned fd from unprivileged task
# Hook: file_permission
# Detects the setuid-helper fd-leak class (pidfd_getfd exit-window race
# against ssh-keysign / chage / unix_chkpwd, plus older CLONE_FILES and
# /proc/<pid>/fd variants). Kernsec kernel.yama.ptrace_scope=2 closes the
# modern primitive at the kernel layer; FS-006 is the belt-and-braces
# layer for hosts that state=skip that rule for same-uid debuggability.
# Monitor-only by design — passwd / pkexec / sudo / dovecot-auth / postfix
# legitimately read these files post-uid-drop. BPF wiring not yet landed;
# this stanza is reserved.
[policy "CFML-FS-006"]
mode = disabled  # disabled | monitor (enforce not supported)


# CFML-CRED-002 — Privilege escalation without setuid path
# Hook: task_fix_setuid
[policy "CFML-CRED-002"]
mode = monitor  # disabled | monitor; enforce is downgraded to monitor
# Narrow this policy further by adding allow_exe lines here, or use the
# global [allow] section below to apply across every cfm-lsm detector.
# allow_exe = /usr/local/directadmin/directadmin
# allow_exe = /usr/local/cpanel/cpanel

# CFML-CRED-003 — Direct root credential install
# Hook: fentry/commit_creds
[policy "CFML-CRED-003"]
mode = monitor  # disabled | monitor; enforce is downgraded to monitor

# CFML-BPF-001 — Unexpected BPF use
# Hook: tracepoint/syscalls/sys_enter_bpf
[policy "CFML-BPF-001"]
mode = monitor  # disabled | monitor; enforce is downgraded to monitor
# Narrow this policy further by adding allow_comm lines here, or use
# the global [allow] section below to apply across every cfm-lsm
# detector that consults a comm allowlist.
# allow_comm = my-orchestrator


# Global allowlist — applied to every cfm-lsm detector that consults
# an exe or comm allowlist (today: CFML-CRED-002, CFML-EXEC-003,
# CFML-EXEC-005, CFML-BPF-001). allow_exe is matched by basename in the
# userspace post-filter and additionally fed into the BPF-side
# cfm_setuid_inodes map for CFML-CRED-002 when the path stat()s OK.
# Missing paths are silently skipped, so cross-distro lists are safe.
[allow]
allow_exe = /usr/sbin/sshd
allow_exe = /usr/lib/openssh/sshd
allow_exe = /usr/lib/openssh/sshd-session
allow_exe = /usr/lib/openssh/sshd-auth
allow_exe = /usr/libexec/openssh/sshd-session
