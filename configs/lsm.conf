# /etc/cfm/lsm.conf — cfm-lsm runtime configuration.
# See docs/cfm-lsm.md for the design.

# Global on/off. cfm-lsm runs kernel preflight and attaches BPF
# programs only when this is true AND preflight passes.
enabled = false

# CFML-EXEC-001 — Block exec from memfd
# Hook: bprm_check_security
[policy "CFML-EXEC-001"]
mode = disabled  # disabled | monitor | enforce

# CFML-EXEC-003 — Reverse shell pattern
# Hook: bprm_check_security
[policy "CFML-EXEC-003"]
mode = disabled  # disabled | monitor | enforce
# Site-specific spawn(8) helper scripts (mailcow / custom inetd-style
# services). Global cross-distro entries already live in [allow] below.
# allow_exe = /usr/local/bin/whitelist_forwardinghosts.sh

# CFML-EXEC-004 — Deleted-file exec by web user
# Hook: bprm_check_security
[policy "CFML-EXEC-004"]
mode = disabled  # disabled | monitor | enforce

# CFML-EXEC-005 — Suspicious interpreter network stdio
# Hook: bprm_check_security
[policy "CFML-EXEC-005"]
mode = disabled  # disabled | monitor; enforce is downgraded to monitor
# Site-specific spawn(8) helper scripts (mailcow / custom inetd-style
# services). Global cross-distro entries already live in [allow] below.
# allow_exe = /usr/local/bin/whitelist_forwardinghosts.sh

# CFML-FS-005 — Sensitive-file modification by web user
# Hook: inode_{setattr,create,unlink,link,rename,setxattr}
[policy "CFML-FS-005"]
mode = disabled  # disabled | monitor | enforce
origin_tracking = monitor  # disabled | monitor (origin-only matches never enforce yet)
# Add host-persistence locations to monitor. Repeat the key per entry;
# absolute concrete paths only. Additions are monitor-only even if mode=enforce.
# persistence_path = /etc/systemd/system
# persistence_path = /usr/local/directadmin/scripts/custom

# CFML-CRED-002 — Privilege escalation without setuid path
# Hook: task_fix_setuid
[policy "CFML-CRED-002"]
mode = disabled  # disabled | monitor; enforce is downgraded to monitor
# Narrow this policy further by adding allow_exe lines here, or use the
# global [allow] section below to apply across every cfm-lsm detector.
# allow_exe = /usr/local/directadmin/directadmin
# allow_exe = /usr/local/cpanel/cpanel

# CFML-CRED-003 — Direct root credential install
# Hook: fentry/commit_creds
[policy "CFML-CRED-003"]
mode = disabled  # disabled | monitor; enforce is downgraded to monitor

# CFML-BPF-001 — Unexpected BPF use
# Hook: tracepoint/syscalls/sys_enter_bpf
[policy "CFML-BPF-001"]
mode = disabled  # disabled | monitor; enforce is downgraded to monitor
# Narrow this policy further by adding allow_comm lines here, or use
# the global [allow] section below to apply across every cfm-lsm
# detector that consults a comm allowlist.
# allow_comm = my-orchestrator

# Global allowlist — applied to every cfm-lsm detector that consults
# an exe or comm allowlist (today: CFML-CRED-002, CFML-EXEC-003,
# CFML-EXEC-005, CFML-BPF-001). allow_exe is matched by basename in the
# userspace post-filter and additionally fed into the BPF-side
# cfm_setuid_inodes map for CFML-CRED-002 when the path stat()s OK.
# Missing paths are silently skipped, so cross-distro lists are safe.
[allow]
allow_exe = /usr/sbin/sshd
allow_exe = /usr/lib/openssh/sshd
allow_exe = /usr/lib/openssh/sshd-session
allow_exe = /usr/lib/openssh/sshd-auth
allow_exe = /usr/libexec/openssh/sshd-session
allow_exe = /usr/libexec/openssh/sshd-auth
allow_exe = /usr/lib/systemd/systemd
allow_exe = /lib/systemd/systemd
allow_exe = /usr/lib/systemd/systemd-executor
allow_exe = /lib/systemd/systemd-executor
allow_exe = /usr/lib/postfix/sbin/master
allow_exe = /usr/libexec/postfix/master
allow_exe = /usr/lib/postfix/sbin/pickup
allow_exe = /usr/libexec/postfix/pickup
allow_exe = /usr/lib/postfix/sbin/qmgr
allow_exe = /usr/libexec/postfix/qmgr
allow_exe = /usr/lib/postfix/sbin/cleanup
allow_exe = /usr/libexec/postfix/cleanup
allow_exe = /usr/lib/postfix/sbin/smtpd
allow_exe = /usr/libexec/postfix/smtpd
allow_exe = /usr/lib/postfix/sbin/proxymap
allow_exe = /usr/libexec/postfix/proxymap
allow_exe = /usr/lib/postfix/sbin/trivial-rewrite
allow_exe = /usr/libexec/postfix/trivial-rewrite
allow_exe = /usr/lib/postfix/sbin/tlsmgr
allow_exe = /usr/libexec/postfix/tlsmgr
allow_exe = /usr/lib/postfix/sbin/anvil
allow_exe = /usr/libexec/postfix/anvil
allow_exe = /usr/lib/postfix/sbin/local
allow_exe = /usr/libexec/postfix/local
allow_exe = /usr/lib/postfix/sbin/virtual
allow_exe = /usr/libexec/postfix/virtual
allow_exe = /usr/lib/postfix/sbin/bounce
allow_exe = /usr/libexec/postfix/bounce
allow_exe = /usr/sbin/dovecot
allow_exe = /usr/lib/dovecot/imap
allow_exe = /usr/lib/dovecot/imap-login
allow_exe = /usr/lib/dovecot/pop3
allow_exe = /usr/lib/dovecot/pop3-login
allow_exe = /usr/lib/dovecot/lmtp
allow_exe = /usr/lib/dovecot/managesieve
allow_exe = /usr/lib/dovecot/managesieve-login
allow_exe = /usr/lib/dovecot/indexer
allow_exe = /usr/lib/dovecot/indexer-worker
allow_exe = /usr/lib/dovecot/auth
allow_exe = /usr/lib/dovecot/anvil
allow_exe = /usr/lib/dovecot/director
allow_exe = /usr/lib/dovecot/replicator
allow_exe = /usr/lib/dovecot/stats
allow_exe = /usr/lib/dovecot/config
allow_exe = /usr/lib/dovecot/log
allow_exe = /usr/lib/dovecot/dict
allow_exe = /usr/lib/dovecot/script-login
allow_exe = /usr/libexec/dovecot/imap
allow_exe = /usr/libexec/dovecot/imap-login
allow_exe = /usr/libexec/dovecot/lmtp
allow_exe = /usr/libexec/dovecot/indexer-worker
allow_exe = /usr/libexec/dovecot/auth
allow_exe = /usr/bin/logger
allow_exe = /bin/logger
allow_comm = runc
allow_comm = crun
allow_comm = containerd
allow_comm = containerd-shim
allow_comm = dockerd
allow_comm = docker
allow_comm = docker-init
allow_comm = docker-proxy
allow_comm = docker-untar
allow_comm = podman
allow_comm = conmon
allow_comm = crio
allow_comm = cri-dockerd
allow_comm = kubelet
allow_comm = kube-proxy
allow_comm = buildkitd
allow_comm = buildah
allow_comm = nerdctl

# dmesg / /dev/kmsg emission. Lines tagged `CFM-LSM:` show up
# in `dmesg`, `journalctl -k`, and (on most distros) /var/log/messages.
# Route to a dedicated file via /etc/rsyslog.d/99-cfm-lsm.conf — see
# configs/rsyslog/cfm-lsm.conf for a ready-to-drop-in example.
[kmsg]
state_transitions   = true   # ALIVE / ADOPT / STATE / ISSUE on enable/disable/adopt/stop
detect_events       = true   # one DETECT line per detection (rate-limited below)
detect_rate_per_min = 10   # cap DETECT lines per policy per minute; 0 disables cap (not recommended)
