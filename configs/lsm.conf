# dmesg / /dev/kmsg emission. Lines tagged `CFM-LSM:` show up
# in `dmesg`, `journalctl -k`, and (on most distros) /var/log/messages.
# Route to a dedicated file via /etc/rsyslog.d/99-cfm-lsm.conf — see
# configs/rsyslog/cfm-lsm.conf for a ready-to-drop-in example.
[kmsg]
state_transitions   = true   # ALIVE / ADOPT / STATE / ISSUE on enable/disable/adopt/stop
detect_events       = true   # one DETECT line per detection (rate-limited below)
detect_rate_per_min = 10   # cap DETECT lines per policy per minute; 0 disables cap (not recommended)

# Userspace DETECT emission (cfm.log + notify pipeline) per-policy
# rate cap. Independent of the [kmsg] cap above so an operator can
# tighten cfm.log without losing dmesg signal (or vice versa). When
# the cap is hit, surplus events accumulate and a single
# `suppressed=N in_last=60s` summary line is emitted on window roll —
# the operator sees the burst happened without being buried in detail.
[events]
detect_rate_per_min = 30   # cap cfm.log + notify emissions per policy per minute; 0 disables cap
