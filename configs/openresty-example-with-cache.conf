# /usr/local/openresty/nginx/conf/nginx.conf
#
# OpenResty in-path WAF mode (WITH SAFE CACHE) - Option A (universal, dedicated-IP safe)
#
# Cache policy:
#   - Caches ONLY static assets (css/js/images/fonts) for anonymous traffic
#   - Never caches:
#       * /__cfm_verify
#       * challenge responses
#       * wp-admin/wp-login, xmlrpc, wp-json, cart/checkout/my-account
#       * any request with cookies suggesting logged-in/cart/session
#       * any request with query-string (conservative)
#
# REQUIREMENT (IMPORTANT):
#   nftables DNAT must be PORT-ONLY (keep destination IP):
#     tcp dport 80  dnat to :9080
#     tcp dport 443 dnat to :9043
#     udp dport 443 dnat to :9043
#
# ROUTING MODEL (IMPORTANT):
#   cfm.lua sets:
#     - $cfm_pass     (actual proxy target URL)
#     - $cfm_upstream (for logging/debug only)
#
# Origin routing:
#   - HTTP  (9080): http://$server_addr:80
#   - HTTPS (9043): https://$server_addr:443 with SNI=$host
#
# Challenge:
#   - always http://127.0.0.1:9098
#
# SSL:
#   - fallback self-signed cert
#   - per-host dynamic certs from sslcollector

user root;
worker_processes 2;

error_log /usr/local/openresty/nginx/logs/error.log warn;
pid       /usr/local/openresty/nginx/logs/nginx.pid;

env OPENRESTY_SOCK;
env OPENRESTY_TOKEN;
env CFM_DECISION_TIMEOUT_MS;
env CFM_DECISION_TTL_MS;

events { worker_connections 1024; }

http {
    lua_package_path '/usr/local/openresty/nginx/lua/?.lua;;';

    lua_shared_dict cfm_decisions 15m;
    lua_shared_dict sslcache 256m;

    init_worker_by_lua_block {
        local sc = require "sslcollector"
        sc.start_background()
    }

    # --- Upload / buffering / timeouts ---
    client_max_body_size         2g;
    client_body_buffer_size     1m;
    client_body_timeout         300s;

    proxy_buffer_size           128k;
    proxy_buffers               32 64k;
    proxy_busy_buffers_size     256k;
    proxy_max_temp_file_size    2048m;

    large_client_header_buffers  8 64k;

    send_timeout                300s;
    keepalive_timeout           65s;

    proxy_connect_timeout       30s;
    proxy_send_timeout          600s;
    proxy_read_timeout          600s;

    # Defaults (verify location overrides these to off)
    proxy_request_buffering     on;
    proxy_buffering             on;

    # --- Real IP (Cloudflare) ---
    # After this:
    #   $remote_addr        = real visitor IP
    #   $realip_remote_addr = Cloudflare edge IP (original peer)
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;
    include /usr/local/openresty/nginx/conf/trusted_proxies.conf;

    # --- Logging ---
    log_format cfm 'client=$remote_addr peer=$realip_remote_addr cf="$http_cf_connecting_ip" '
                   'host=$host "$request" $status up=$cfm_upstream pass=$cfm_pass dst=$server_addr:$server_port '
                   'or_cache=$upstream_cache_status';

    map "$cfm_upstream|$uri" $log_cfm {
        default                 0;
        "~^cfm_challenge\|"     1;
        "~^cfm_block\|"         1;
        "~\|/__cfm_verify$"     1;
    }

    access_log /usr/local/openresty/nginx/logs/access.cfm.log cfm if=$log_cfm;
    # Full access log (enable only when needed)
    #access_log /usr/local/openresty/nginx/logs/access.log cfm;

    # ---------------------------------------------------------------------
    # SAFE STATIC CACHE (shared-hosting friendly)
    # ---------------------------------------------------------------------
    # Create directory:
    #   mkdir -p /var/cache/openresty/static
    #   chown -R root:root /var/cache/openresty
    #
    # Small cache is enough; adjust sizes based on disk.
    proxy_cache_path /var/cache/openresty/static
        levels=1:2
        keys_zone=STATIC:128m
        max_size=5g
        inactive=7d
        use_temp_path=off;

    proxy_cache_lock on;
    proxy_cache_lock_timeout 5s;
    proxy_cache_revalidate on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

    # --- Cache bypass rules (conservative) ---

    # 1) Never cache if any query string exists (keeps it safe for WP/Woo)
    map $args $has_args {
        default 0;
        ""      0;
        ~.+     1;
    }

    # 2) Never cache when cookies indicate sessions/cart/logged-in
    map $http_cookie $has_session_cookie {
        default 0;
        ~*(wordpress_logged_in|wp-postpass|woocommerce_items_in_cart|woocommerce_cart_hash|wp_woocommerce_session|PHPSESSID) 1;
    }

    # 3) Never cache admin/login/api endpoints
    map $uri $is_nocache_path {
        default 0;
        ~*^/wp-admin/            1;
        ~*^/wp-login\.php$       1;
        ~*^/xmlrpc\.php$         1;
        ~*^/wp-json/             1;
        ~*^/cart/?$              1;
        ~*^/checkout/?$          1;
        ~*^/my-account/?$        1;
        ~*^/__cfm_verify$        1;
    }

    # 4) Never cache if CFM routed to challenge
    map $cfm_upstream $is_challenge_route {
        default       0;
        cfm_challenge 1;
    }

    # Final bypass decision for static cache
    map "$request_method|$has_args|$has_session_cookie|$is_nocache_path|$is_challenge_route" $static_cache_bypass {
        default 1;   # bypass by default (safe)
        "GET|0|0|0|0" 0;
        "HEAD|0|0|0|0" 0;
    }

    # Helpful cache header
    map $upstream_cache_status $or_cache_hdr {
        default  "";
        HIT      "HIT";
        MISS     "MISS";
        BYPASS   "BYPASS";
        EXPIRED  "EXPIRED";
        STALE    "STALE";
        UPDATING "UPDATING";
        REVALIDATED "REVALIDATED";
    }

    # --- Challenge upstream (fixed) ---
    upstream cfm_challenge {
        server 127.0.0.1:9098;
        keepalive 8;
    }


# ---------------------------------------------------------------------
# OPTIONAL MICRO-CACHE (HTML) - KEEP COMMENTED BY DEFAULT
#
# Purpose:
#   Absorb sudden bursts (bots / thundering herd) with a tiny 1-3s cache.
#   Works well on shared hosting if it ONLY applies to anonymous HTML.
#
# Safety:
#   - GET/HEAD only
#   - no query string
#   - no login/cart/session cookies
#   - not wp-admin/wp-login/wp-json/xmlrpc/cart/checkout/my-account
#   - not when cfm routes to challenge
#
# Enable steps:
#   1) Uncomment MICRO cache_path below
#   2) Uncomment maps (micro_* variables)
#   3) In each server (9080 + 9043) location /, uncomment the proxy_cache lines
# ---------------------------------------------------------------------

# proxy_cache_path /var/cache/openresty/micro
#     levels=1:2
#     keys_zone=MICRO:64m
#     max_size=1g
#     inactive=5m
#     use_temp_path=off;

# # microcache only when: method ok, no args, no session cookies, not nocache path, not challenge route
# map "$request_method|$has_args|$has_session_cookie|$is_nocache_path|$is_challenge_route" $micro_cache_ok {
#     default 0;
#     "GET|0|0|0|0" 1;
#     "HEAD|0|0|0|0" 1;
# }
#
# # Only cache likely-HTML requests (conservative):
# # - if Accept contains text/html OR no extension in URI (typical WP pages)
# map "$http_accept|$uri" $micro_is_htmlish {
#     default 0;
#     "~*text/html" 1;
#     "~*\.[a-z0-9]{1,5}$" 0;   # has file extension -> not HTML
#     "~*^/[^.]*$" 1;          # no dot -> probably HTML
# }
#
# map "$micro_cache_ok|$micro_is_htmlish" $micro_cache_enable {
#     default 0;
#     "1|1" 1;
# }
#
# map $upstream_cache_status $or_micro_hdr {
#     default  "";
#     HIT      "HIT";
#     MISS     "MISS";
#     BYPASS   "BYPASS";
#     EXPIRED  "EXPIRED";
#     STALE    "STALE";
#     UPDATING "UPDATING";
#     REVALIDATED "REVALIDATED";
# }







    # ---------------------------------------------------------------------
    # HTTP listener (DNAT 80 -> 9080)
    # ---------------------------------------------------------------------
    server {
        listen 9080;
        server_name _;

        set $cfm_pass "";
        set $cfm_upstream "cfm_apache";
        access_by_lua_file /usr/local/openresty/nginx/lua/cfm.lua;

        location = /__cfm_verify {
            access_by_lua_block { return; }

            proxy_pass         http://cfm_challenge;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";

            proxy_set_header   Host              $host;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   CF-Connecting-IP  $http_cf_connecting_ip;

            proxy_request_buffering off;
            proxy_buffering         off;

            add_header Cache-Control "no-store" always;
        }

        # STATIC ASSET CACHE (HTTP)
        location ~* \.(?:css|js|mjs|map|png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf|eot)$ {
            proxy_pass         $cfm_pass;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto http;
            proxy_set_header   CF-Connecting-IP  $http_cf_connecting_ip;

            proxy_cache                STATIC;
            proxy_cache_key            "$scheme|$host|$uri";
            proxy_cache_valid          200 301 302  30m;
            proxy_cache_valid          404          1m;
            proxy_cache_bypass         $static_cache_bypass;
            proxy_no_cache             $static_cache_bypass;

            add_header X-OR-Cache $or_cache_hdr always;
        }

        # Everything else: NO CACHE (safe)
        location / {
            proxy_pass         $cfm_pass;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto http;
            proxy_set_header   CF-Connecting-IP  $http_cf_connecting_ip;

            add_header X-OR-Cache "BYPASS" always;

        # ------------------------------------------------------------
        # OPTIONAL MICRO-CACHE (HTML) - KEEP COMMENTED BY DEFAULT
        # ------------------------------------------------------------
        # proxy_cache          MICRO;
        # proxy_cache_key      "$scheme|$host|$uri";
        # proxy_cache_valid    200 301 302  2s;
        # proxy_cache_valid    404          1s;
        # proxy_cache_bypass   $micro_cache_enable = 0;
        # proxy_no_cache       $micro_cache_enable = 0;
        # add_header X-OR-Micro $or_micro_hdr always;

        }

        location = /__ssl_debug {
            allow 127.0.0.1;
            deny all;
            content_by_lua_block {
                local d = ngx.shared.sslcache
                ngx.say("ready=", d:get("meta:ready") or "0")
                ngx.say("version=", d:get("meta:version") or "-")
            }
        }
    }

    # ---------------------------------------------------------------------
    # HTTPS listener (DNAT 443 -> 9043)
    # ---------------------------------------------------------------------
    server {
        listen 9043 ssl;
        http2 on;

        listen 9043 quic reuseport;
        http3 on;

        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Alt-Svc 'h3=":443"; ma=86400' always;

        server_name _;

        ssl_certificate     /usr/local/openresty/nginx/conf/selfsigned/fullchain.pem;
        ssl_certificate_key /usr/local/openresty/nginx/conf/selfsigned/privkey.pem;

        ssl_certificate_by_lua_block {
            local sc = require "sslcollector"
            sc.set_cert()
        }

        set $cfm_pass "";
        set $cfm_upstream "cfm_apache";
        access_by_lua_file /usr/local/openresty/nginx/lua/cfm.lua;

        location = /__cfm_verify {
            access_by_lua_block { return; }

            proxy_pass         http://cfm_challenge;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";

            proxy_set_header   Host              $host;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   CF-Connecting-IP  $http_cf_connecting_ip;

            proxy_request_buffering off;
            proxy_buffering         off;

            add_header Cache-Control "no-store" always;
        }

        # STATIC ASSET CACHE (HTTPS)
        location ~* \.(?:css|js|mjs|map|png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf|eot)$ {
            proxy_pass $cfm_pass;

            proxy_ssl_server_name on;
            proxy_ssl_name $host;

            proxy_http_version 1.1;
            proxy_set_header   Connection "";

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_set_header   CF-Connecting-IP  $http_cf_connecting_ip;

            proxy_cache                STATIC;
            proxy_cache_key            "$scheme|$host|$uri";
            proxy_cache_valid          200 301 302  30m;
            proxy_cache_valid          404          1m;
            proxy_cache_bypass         $static_cache_bypass;
            proxy_no_cache             $static_cache_bypass;

            add_header X-OR-Cache $or_cache_hdr always;
        }

        # Everything else: NO CACHE (safe)
        location / {
            proxy_pass $cfm_pass;

            proxy_ssl_server_name on;
            proxy_ssl_name $host;

            proxy_http_version 1.1;
            proxy_set_header   Connection "";

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_set_header   CF-Connecting-IP  $http_cf_connecting_ip;

            add_header X-OR-Cache "BYPASS" always;

        # ------------------------------------------------------------
        # OPTIONAL MICRO-CACHE (HTML) - KEEP COMMENTED BY DEFAULT
        # ------------------------------------------------------------
        # proxy_cache          MICRO;
        # proxy_cache_key      "$scheme|$host|$uri";
        # proxy_cache_valid    200 301 302  2s;
        # proxy_cache_valid    404          1s;
        # proxy_cache_bypass   $micro_cache_enable = 0;
        # proxy_no_cache       $micro_cache_enable = 0;
        # add_header X-OR-Micro $or_micro_hdr always;

        }
    }
}
