# /usr/local/openresty/nginx/conf/nginx.conf
# OpenResty in-path WAF mode + microcache/static cache
# - access_by_lua decides whether to proxy to apache or to cfm challenge server
# - CFM bridge is HTTP-over-UNIX-socket, requires X-CFM-Token header
# - DNAT: 80->9080 and 443->9043
#
# Cache notes:
# - microcache on disk-in-RAM (/tmp) with small TTL for HTML, larger for assets
# - bypass cache on cookies, non-GET/HEAD, admin/api paths, and /__cfm_verify
# - adds X-Cache-Status header for debugging

user root;
worker_processes 2;

error_log /usr/local/openresty/nginx/logs/error.log info;
pid       /usr/local/openresty/nginx/logs/nginx.pid;

env OPENRESTY_SOCK;
env OPENRESTY_TOKEN;

env CFM_DECISION_TIMEOUT_MS;
env CFM_DECISION_TTL_MS;

events { worker_connections 1024; }

http {
    lua_package_path '/usr/local/openresty/nginx/lua/?.lua;;';
    lua_shared_dict  cfm_decisions 15m;
    lua_shared_dict  sslcache 256m;

    init_worker_by_lua_block {
        local sc = require "sslcollector"
        sc.start_background()
    }

# Max upload size (adjust as needed)
client_max_body_size 2g;

# If you get "client intended to send too large body" or slow uploads:
client_body_buffer_size 1m;
client_body_timeout 300s;

# --- Response buffering tuning (reduce proxy_temp disk churn) ---
proxy_buffer_size 64k;
proxy_buffers 32 64k;
proxy_busy_buffers_size 256k;

# Allow larger spill to temp files (set 0 to disable spill; not recommended with bots)
proxy_max_temp_file_size 2048m;

# Optional: move proxy_temp into /tmp (RAM-ish on your host)
# (Create dir on boot via tmpfiles if you enable this)
# proxy_temp_path /tmp/nginx-proxy-temp 1 2;

# If large request headers / cookies cause 400/431:
large_client_header_buffers 8 32k;

# Client I/O timeouts
send_timeout 300s;
keepalive_timeout 65s;

# Proxy timeouts (OpenResty -> Apache)
proxy_connect_timeout 30s;
proxy_send_timeout 600s;
proxy_read_timeout 600s;

# If you stream uploads to upstream:
proxy_request_buffering on;   # default; safer for upstream
proxy_buffering on;           # default; buffers responses


    # ── Real IP (shared-hosting safe) ───────────────────────────────────────
    #real_ip_header CF-Connecting-IP;
    #real_ip_recursive on;
    #include /usr/local/openresty/nginx/conf/trusted_proxies.conf;

    # Optional: helpful debug log format
    log_format cfm '$realip_remote_addr host=$host "$request" $status up=$cfm_upstream cache=$upstream_cache_status';
    access_log /usr/local/openresty/nginx/logs/access.log cfm;

    # ── Microcache (RAM-backed via /tmp) ───────────────────────────────────
    # Ensure directory exists:
    #   mkdir -p /tmp/nginx-micro && chmod 700 /tmp/nginx-micro
    #
    # Your /tmp is on /dev/loop0 (RAM-ish), so this is fast.
    proxy_cache_path /tmp/nginx-micro
        levels=1:2
        keys_zone=cfm_micro:64m
        max_size=3g
        inactive=10m
        use_temp_path=off;

    # Avoid thundering herd for same key
    proxy_cache_lock on;
    proxy_cache_lock_timeout 5s;
    proxy_cache_lock_age 10s;

    # Serve stale during spikes / origin hiccups
    proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;

    # Cache key (vhost aware + scheme)
    proxy_cache_key "$scheme|$host|$request_uri";

    # Cache only GET/HEAD
    map $request_method $cacheable_method {
        default 0;
        GET     1;
        HEAD    1;
    }

    # If any cookie exists, bypass (safe default for shared hosting)
    map $http_cookie $has_cookie {
        default 0;
        "~."    1;
    }

    # Exclude sensitive paths
    map $request_uri $nocache_path {
        default 0;
        "~^/__cfm_verify$" 1;
        "~^/wp-admin"      1;
        "~^/wp-login\.php" 1;
        "~^/admin"         1;
        "~^/api"           1;
    }

    # Combine flags (fail-safe: bypass)
    map "$cacheable_method$has_cookie$nocache_path" $bypass_cache {
        default 1;
        "100"   0;   # GET/HEAD + no cookie + not excluded => cache OK
    }

    # ── Upstreams ──────────────────────────────────────────────────────────
    upstream cfm_challenge {
        server 127.0.0.1:9098;
        keepalive 8;
    }

    upstream cfm_apache {
        server 157.90.128.246:80;
        keepalive 32;
    }

    # ── HTTP ───────────────────────────────────────────────────────────────
    server {
        listen 9080;
        server_name _;

        set $cfm_upstream "cfm_apache";
        access_by_lua_file /usr/local/openresty/nginx/lua/cfm.lua;

        # Bypass Lua for verify (Go must handle /verify)
        location = /__cfm_verify {
            access_by_lua_block { return; }
            proxy_pass         http://cfm_challenge;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $realip_remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto http;

            add_header X-Cache-Status BYPASS always;
        }

        # ---- Static/assets cache (big win, safe) ----
        location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|webp|woff2?|ttf|eot|mp4|mp3)$ {
            proxy_cache cfm_micro;

            # For assets, typically ok to ignore query args (optional).
            # If you have versioned query strings (?ver=), you can keep $request_uri instead.
            proxy_cache_key "$host|$uri";

            proxy_cache_valid 200 301 302 30m;
            proxy_cache_valid 404 1m;

            proxy_ignore_headers Set-Cookie;
            proxy_hide_header    Set-Cookie;

            add_header Cache-Control "public, max-age=1800" always;
            add_header X-Cache-Status $upstream_cache_status always;

            proxy_pass         http://$cfm_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $realip_remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto http;
        }

        # Everything else: microcache with tiny TTL (safe-ish default)
        location / {
            proxy_cache cfm_micro;

proxy_cache_bypass $bypass_cache $upstream_http_set_cookie;
proxy_no_cache     $bypass_cache $upstream_http_set_cookie;

            # Micro TTLs for HTML/dynamic GETs (you can tune 1s..10s)
            proxy_cache_valid 200 301 302 5s;
            proxy_cache_valid 404 1s;

            add_header X-Cache-Status $upstream_cache_status always;

            proxy_pass         http://$cfm_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $realip_remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto http;
        }

        location = /__ssl_debug {
            allow 127.0.0.1;
            deny all;
            content_by_lua_block {
                local d = ngx.shared.sslcache
                ngx.say("ready=", d:get("meta:ready") or "0")
                ngx.say("version=", d:get("meta:version") or "-")

                ngx.say("has e:pemcert:quic.myip.gr=", d:get("e:pemcert:quic.myip.gr") and "yes" or "no")
                ngx.say("has e:pemkey:quic.myip.gr=",  d:get("e:pemkey:quic.myip.gr") and "yes" or "no")

                ngx.say("has w:pemcert:myip.gr=", d:get("w:pemcert:myip.gr") and "yes" or "no")
                ngx.say("has w:pemkey:myip.gr=",  d:get("w:pemkey:myip.gr") and "yes" or "no")
            }
        }
    }

    # ── HTTPS ──────────────────────────────────────────────────────────────
    server {
        listen 9043 ssl;             # TCP
        http2 on;                    # enable HTTP/2 on TCP listener

        listen 9043 quic reuseport;  # UDP QUIC
        http3 on;

        ssl_protocols TLSv1.2 TLSv1.3;  # TCP can do 1.2+1.3; QUIC uses 1.3
        add_header Alt-Svc 'h3=":443"; ma=86400' always;

        server_name _;

        ssl_certificate     /usr/local/openresty/nginx/conf/selfsigned/fullchain.pem;
        ssl_certificate_key /usr/local/openresty/nginx/conf/selfsigned/privkey.pem;

        ssl_certificate_by_lua_block {
            local sc = require "sslcollector"
            sc.set_cert()
        }

        set $cfm_upstream "cfm_apache";
        access_by_lua_file /usr/local/openresty/nginx/lua/cfm.lua;

        location = /__cfm_verify {
            access_by_lua_block { return; }
            proxy_pass         http://cfm_challenge;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $realip_remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;

            add_header X-Cache-Status BYPASS always;
        }

        # ---- Static/assets cache (big win, safe) ----
        location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|webp|woff2?|ttf|eot|mp4|mp3)$ {
            proxy_cache cfm_micro;
            proxy_cache_key "$host|$uri";

            proxy_cache_valid 200 301 302 30m;
            proxy_cache_valid 404 1m;

            proxy_ignore_headers Set-Cookie;
            proxy_hide_header    Set-Cookie;

            add_header Cache-Control "public, max-age=1800" always;
            add_header X-Cache-Status $upstream_cache_status always;

            proxy_pass         http://$cfm_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $realip_remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
        }

        location / {
            proxy_cache cfm_micro;

proxy_cache_bypass $bypass_cache $upstream_http_set_cookie;
proxy_no_cache     $bypass_cache $upstream_http_set_cookie;

            proxy_cache_valid 200 301 302 5s;
            proxy_cache_valid 404 1s;

            add_header X-Cache-Status $upstream_cache_status always;

            proxy_pass         http://$cfm_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $realip_remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
        }
    }
}
