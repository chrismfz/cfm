# /etc/rsyslog.d/99-cfm-lsm.conf
#
# Route cfm-lsm dmesg lines (tagged `CFM-LSM:`) into a dedicated log
# file instead of the system log catch-all. Without this file, lines
# emitted by `cfm lsm` (ALIVE / ADOPT / STATE / DETECT / ISSUE) land
# in:
#
#   - dmesg                (always — kernel printk ring buffer)
#   - journalctl -k        (always)
#   - /var/log/messages    (RHEL family — *.info catch-all)
#   - /var/log/syslog      (Debian / Ubuntu)
#
# That's fine for many operators. But if you'd rather have CFM-LSM
# events in their own file (cleaner audit trail, easier rotation,
# avoids polluting /var/log/messages with high-frequency DETECT
# lines during an attack), drop this file into /etc/rsyslog.d/ and
# reload rsyslog:
#
#   cp /usr/share/cfm/configs/rsyslog/cfm-lsm.conf /etc/rsyslog.d/99-cfm-lsm.conf
#   systemctl reload rsyslog
#
# The `stop` directive at the end suppresses further processing,
# which keeps these lines out of /var/log/messages and /var/log/syslog.
# Remove it if you want CFM-LSM events in BOTH places.

# Match the brand prefix that internal/lsm/kmsg.go always emits.
:msg, contains, "CFM-LSM:" /var/log/cfm/cfm.lsm.log
& stop

# Notes on log rotation: /var/log/cfm/ rotation is governed by
# /etc/logrotate.d/cfm (shipped by the cfm package). If you create
# /var/log/cfm/cfm.lsm.log here, you may want to add it to the
# rotate stanza too — see configs/logrotate/cfm for the template.
