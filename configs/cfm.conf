# NFTables hook priority for the base INPUT chain (inet cfm input).
# This controls WHEN CFM runs relative to iptables-nft (CSF/Imunify360),
# which both live at priority "filter" (= 0) in table ip/ip6.
#
# Integer, typical range: -300..+300
#   Negative  -> earlier than CSF/Imunify (CFM runs first)
#   Zero (0)  -> same level as iptables-nft (not recommended; ordering undefined)
#   Positive  -> later than CSF/Imunify (they run first)
#
# Recommended:
#   -50  : CFM runs before CSF/Imunify; CFM ALLOWs override their DROPs.
#   50   : CSF/Imunify run before CFM; their DROPs override CFM ALLOWs.
#
# Default: -50
NFT_INPUT_PRIORITY = -50

