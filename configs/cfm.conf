###############################################################################
# --- Outbound Abuse Sentinel (phase 1: observe + warn) ---
#
# Watches new outbound TCP connections per uid via NFLOG and
# warns when a uid bursts on SMTP / scan / HTTP or fans out across
# many distinct destinations within OUTBOUND_WINDOW_SECONDS. Phase 1 is
# observe-only — nothing is throttled or suspended; events are logged to the
# SMTP log file (cfm.smtp.log) with a forensic line that includes the user,
# process, cwd, cmdline, peer sample, and an exim queue snapshot.
#
# Required: OUTBOUND_NFLOG must differ from SMTP_LOG_NFLOG so the two
# collectors do not stomp each other.
#
# Responder pivot (only when needed):
#   docs/admin-notes/ad-hoc-dns-forensics.md
###############################################################################
OUTBOUND_ENABLED                 = 0
OUTBOUND_NFLOG                   = 0      # NFLOG group ; 0 = disabled. Pick a value
                                          # in 1..65535 that does NOT collide with
                                          # SMTP_LOG_NFLOG or any other NFLOG
                                          # consumer (ulogd2, suricata, …) on this
                                          # host. Convention: 100 = SMTP, 101 =
                                          # outbound. Low numbers (1, 2, 3) are
                                          # commonly used by other daemons.

OUTBOUND_WINDOW_SECONDS          = 60
OUTBOUND_SMTP_CONN_PER_MIN       = 30     # outbound 25/465/587 (per uid per window)
OUTBOUND_SCAN_UNIQUE_DST_PER_MIN = 50     # distinct destination IPs (any port)
OUTBOUND_HTTP_RATE_PER_MIN       = 200    # outbound 80/443/8080/8443
OUTBOUND_SCAN_PORTS              = 22,23,3389
OUTBOUND_SMTP_PORTS              = 25,465,587
OUTBOUND_HTTP_PORTS              = 80,443,8080,8443
OUTBOUND_LOG_DEDUP_SECONDS       = 300    # don't re-warn within this window
OUTBOUND_NOTIFY_SEVERITY         = warning
OUTBOUND_QUEUE_SAMPLES           = 5      # exim msgid/sender lines per warning
OUTBOUND_LOG_ENRICH              = 1      # GeoIP/ASN on destination IP

# HTTP/HTTPS alerts from the phase-1 NFLOG collector report destination IP/port
# samples only, not URL/path/Host, because the collector observes connection
# metadata rather than application request payloads.
#
# Optional richer HTTP attribution must be implemented as a separate opt-in
# component and is disabled by default. When enabled in a future attribution
# component, treat results as best-effort/privacy-sensitive: cleartext :80 may
# sample first request bytes for Host, while :443 generally requires DNS/SNI
