# --- Hardening options ---
#
BLOCK_BAD_TCP_FLAGS=1
#   Enable dropping of packets with invalid or suspicious TCP flag
#   combinations (e.g. SYN+FIN, SYN+RST, NULL, XMAS). Helps mitigate
#   stealth scans and malformed TCP flood attempts.
#
NEW_RATE=200
#   Global per-IP rate limit for new TCP connections (conntrack state NEW).
#   Value = allowed new connections per second.
#   If a source exceeds this rate, it is throttled/dropped.
#
NEW_BURST=250
#   Burst size allowed for NEW_RATE before throttling kicks in.
#   Lets short spikes of new connections through, but sustained high
#   rates will be limited.
#
