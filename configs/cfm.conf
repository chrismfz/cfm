# NFTables hook priority for the base INPUT chain (inet cfm input).
# This controls WHEN CFM runs relative to iptables-nft (CSF/Imunify360),
# which both live at priority "filter" (= 0) in table ip/ip6.
#
# Integer, typical range: -300..+300
#   Negative  -> earlier than CSF/Imunify (CFM runs first)
#   Zero (0)  -> same level as iptables-nft (not recommended; ordering undefined)
#   Positive  -> later than CSF/Imunify (they run first)
#
# Recommended:
#   -50  : CFM runs before CSF/Imunify; CFM ALLOWs override their DROPs.
#   50   : CSF/Imunify run before CFM; their DROPs override CFM ALLOWs.
#
# Default: -50
NFT_INPUT_PRIORITY = -50

# Firewall engine selector (Phase 1 internal wiring).
# - nft    : default production backend (shells out to nft binary).
# - nftlib : reserved for future native nftables backend (not built yet).
# - pf     : reserved for future PF backend (not built yet).
# If unset, CFM defaults to "nft" to preserve current behavior.

# DNAT prerouting priority for table inet cfm_redirect.
# Imunify/WebShield commonly uses -100 (dstnat).
# Recommended:
#   -99  Imunify/WebShield first, CFM fallback
#   -101 CFM first
# Avoid -100 (same-priority ordering ambiguity).
NFT_DNAT_PRIORITY = -99
CFM_FIREWALL_ENGINE = "nft"

