#; ---------------------------------------------------------------------------
#; SSLCollector Unix Socket API (for OpenResty dynamic SNI cert loading)
#;
#; Purpose:
#;   Exposes a local HTTP API over a Unix socket so OpenResty can fetch the
#;   correct TLS cert+key (PEM) per SNI during handshake via ssl_certificate_by_lua*.
#;
#; Endpoints (HTTP over unix socket):
#;   GET  /cert?host=example.com    -> JSON { cert_pem, key_pem, not_after, fingerprint, source, ... }
#;   GET  /stats                   -> JSON stats
#;   POST /refresh                 -> triggers immediate refresh/rescan
#;
#; Security:
#;   - Socket is local-only (unix), but you can require a token header:
#;       Header: X-SSLCollector-Token: <token>
#;   - Recommended: keep privkeys unreadable by OpenResty user; only CFM reads them
#;     and serves them in-memory through this socket.
#;
#; Quick test (from shell):
#;   curl --unix-socket /var/run/sslcollector.sock \
#;        -H 'X-SSLCollector-Token: supersecret' \
#;        'http://localhost/cert?host=example.com' | head
#;
#; OpenResty (lua-resty-http) example:
#;   local http = require "resty.http"
#;   local ssl  = require "ngx.ssl"
#;   local sni  = ssl.server_name()
#;   local httpc = http.new()
#;   httpc:set_timeouts(100, 200, 200) -- ms
#;   local res, err = httpc:request_uri("http://unix:/var/run/sslcollector.sock:/cert", {
#;       method  = "GET",
#;       query   = { host = sni },
#;       headers = {
#;           ["Host"] = "localhost",
#;           ["X-SSLCollector-Token"] = "supersecret",
#;       },
#;   })
#;   -- then ssl.clear_certs(); ssl.parse_pem_cert(res.body.cert_pem); ssl.set_cert(...); etc.
#;
#; DNAT “invisible front” tip:
#;   With edge DNAT on (public :443 -> edge proxy :9043), the proxy sees real SNI
#   and can fetch the correct cert from this socket even with no local cert files.
# ---------------------------------------------------------------------------
SSLCOLLECTOR_SOCK_ENABLE  = 1
SSLCOLLECTOR_SOCK_PATH    = /var/run/sslcollector.sock
SSLCOLLECTOR_SOCK_TOKEN   = supersecret
SSLCOLLECTOR_SOCK_PEM_TTL = 10m
SSLCOLLECTOR_SOCK_PEM_MAX = 50000
#; SSLCOLLECTOR_OFFLINE_CACHE = 1
#; Write/read a disk snapshot of cert+key pairs so nginx workers survive cfm-offline
#; restarts without falling back to the default certificate.  Default: 1 (enabled).
#; Set to 0 to disable the on-disk snapshot entirely — workers will use only the
#; live /dumpall socket and fall back to the default cert if cfm is unreachable at
#; startup.  See docs/ssl-collector.md for the security tradeoffs.



# --- ClamAV / clamd ---
# CLAMD_ENABLED is the pipeline/infra switch: the scanner manager runs and
# connects to clamd. Must be on for ANY upload scanning.
CLAMD_ENABLED = 1
CLAMD_NETWORK = unix
CLAMD_SOCKET = /run/cfm-clamd.sock
CLAMD_TIMEOUT = 10s
CLAMD_MAX_WORKERS = 2
CLAMD_QUEUE_SIZE = 256

# Global upload-scan POLICY (default ON). Effective per host:
#   scan(host) = CLAMD_ENABLED && (CLAM_SCAN_DEFAULT XOR host-in-override)
# The async (notify-only) scanner has run fleet-wide for months, so this ships
# ON: with CLAMD_ENABLED every upload is scanned unless a vhost is opted OUT
#   cfm clam override add <host>      (or the cfm-admin vhost-controls grid)
# To disable scanning server-wide instead:
#   cfm clam scan off                 (sets CLAM_SCAN_DEFAULT = 0)
# When the global default is OFF, a per-vhost override instead OPTS A VHOST IN.
# NOTE: scanning here is async/notify-only (non-blocking); inline blocking is a
# separate future knob that will default OFF.
CLAM_SCAN_DEFAULT = 1

# Which upload file types are worth clamd's time, decided by MAGIC BYTES in the
# scanner (extensions are forgeable).
#   archives (default): scan only container formats — zip (incl. docx/xlsx/jar),
#                       gzip, rar, 7z, xz, bzip2. The one class the WAF's
#                       signature layer genuinely can't inspect; skips the
#                       high-volume/low-value image/video/pdf traffic.
#   all:                scan every multipart file part (full coverage).
# Toggle from CLI with:  cfm clam scope archives|all
CLAM_SCAN_SCOPE = archives

# Signature verdicts to DOWNGRADE to log-only: still written to cfm.clam.log
# and the scoped history (flagged sig_ignored), but no CLAM/INFECTED
# notification and no quarantine copy. Comma-separated case-insensitive globs
# matched against the signature name. Default ignores hunting-grade YARA rules
# (signature-base "Hunting" sigs are FP-prone BY DESIGN — observed FP:
# YARA.SIGNATURE_BASE_Brooxml_Hunting.UNOFFICIAL on a legitimate .docx).
# Set an explicit empty value (CLAM_SIG_IGNORE =) to act on every verdict.
# Runtime per-signature/per-vhost excludes (no reload needed) live in the
# cfm-admin ClamAV page and `cfm clam sigignore …` — this key is the baseline.
CLAM_SIG_IGNORE = *_Hunting.UNOFFICIAL

# Scan MODE: notify-only vs block-on-infection.
#   async (default): enqueue, return immediately, notify on infection —
#                    the months-proven pipeline. Uploads are never delayed.
#   inline:          the edge WAITS (bounded) for the verdict and returns 403
#                    on an infected upload. FAIL-OPEN by contract: clamd
#                    down/hung, breaker open, timeout, oversize stream — all
#                    ALLOW the upload and degrade to an async scan, so a clamd
#                    outage can never take down uploads. Honours the scope
#                    gate and signature excludes (a sig-ignored verdict never
#                    blocks). Burn a vhost in with CLAM_INLINE_DRY_RUN first.
# Per-vhost flips (opt one vhost in/out of the global mode):
#   cfm clam mode add <host>          (or the cfm-admin vhost-controls grid)
# Toggle globally:  cfm clam mode inline|async
CLAM_SCAN_MODE = async
CLAM_INLINE_TIMEOUT = 3s
# 1 = scan inline + record what WOULD block (log/history/counters), never
# actually block. Measure latency + FP rate before arming a vhost.
CLAM_INLINE_DRY_RUN = 0

# Lua-side upload interception (cfm_clamav.lua → bridge → clamd).
# Default 1 (on). Set to 0 to keep the on-demand `cfm clam scan` CLI
# working while disabling per-request multipart inspection in Angie —
# useful when a noisy admin CRUD generates many multipart POSTs that
# you trust and don't want scanned synchronously. Toggle from CLI with
#   cfm clam hook enable | disable
# (writes here, daemon picks up via fsnotify, no restart needed).
CLAMD_NGINX_HOOK_ENABLED = 1

# --- Clam log sink ---
CLAM_LOG_STDOUT = 0
CLAM_LOG_FILE = /var/log/cfm/cfm.clam.log

CLAMD_PENDING_DIR  = "/var/lib/cfm/scanner/pending"
CLAMD_INFECTED_DIR = "/var/lib/cfm/scanner/infected"

#If your distro uses TCP instead:
#CLAMD_ENABLED = 1
#CLAMD_NETWORK = tcp
#CLAMD_SOCKET = 127.0.0.1:3310
