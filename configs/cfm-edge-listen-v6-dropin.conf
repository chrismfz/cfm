# CFM: run cfm-edge-listen-v6.service (configs/cfm-edge-listen-v6.service)
# before every start of the edge. Installed by the package
# (package-proxy-config-deploy.sh) as
#   /etc/systemd/system/openresty.service.d/cfm-listen-v6.conf
#   /etc/systemd/system/angie.service.d/cfm-listen-v6.conf
# Wants=, not Requires=: the edge starts even if that unit fails.
[Unit]
Wants=cfm-edge-listen-v6.service
After=cfm-edge-listen-v6.service
