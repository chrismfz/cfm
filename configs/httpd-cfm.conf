# Seconds.six-microsecond-fraction since epoch (Apache 2.4+)
# %{%s}t.%{usec_frac}t → like nginx $msec (float)
# %a  : client IP
# %v  : server name (vhost)
# %m  : method
# %U%q: path + query string
# %H  : protocol
# %>s : final status code
# %B  : bytes sent
# %{us}T : request time (microseconds)  [we'll divide to seconds in parser]
# "-" : upstream rt placeholder (Apache doesn't have it)
# Referer / User-Agent

LogFormat "%{%s}t.%{usec_frac}t\t%a\t%v\t%m\t%U%q\t%H\t%>s\t%B\t%{us}T\t-\t%{Referer}i\t%{User-Agent}i" cfm_tsv
CustomLog /var/log/apache2/access_cfm_combined.log cfm_tsv
