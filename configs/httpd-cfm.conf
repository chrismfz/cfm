# CFM Apache integration — cPanel servers
# Drop into: /etc/apache2/conf.d/httpd-cfm.conf
#
# DO NOT edit i360.remoteip.conf or http2.conf — they are managed by Imunify360/cPanel.
# This file is designed to coexist with both without conflict.

# ── Real IP ───────────────────────────────────────────────────────────────────
# i360.remoteip.conf already owns "RemoteIPHeader X-Forwarded-For".
# We only register the loopback (OpenResty on the same host, DNAT mode) as a
# trusted internal proxy so mod_remoteip accepts the X-Forwarded-For value.
# RemoteIPInternalProxy silently replaces the proxy IP with the forwarded IP
# (no Received-For chain appended, no spoofing risk from localhost).
#
# If OpenResty lives on a separate host, use RemoteIPTrustedProxy <proxy-ip>
# instead — it validates the chain but exposes the proxy IP to the client record.
<IfModule remoteip_module>
    RemoteIPInternalProxy 127.0.0.1
    RemoteIPInternalProxy ::1
</IfModule>

# ── Strip Upgrade / Alt-Svc headers ──────────────────────────────────────────
# mod_http2 appends "Upgrade: h2,h2c" to every HTTP/1.1 response to hint
# cleartext HTTP/2. When OpenResty forwards this to an HTTP/2 client the
# response is illegal (RFC 9113 §8.6 bans hop-by-hop headers in HTTP/2):
#
#   curl: (92) Invalid HTTP header field was received:
#         frame type: 1, stream: 1, name: [upgrade], value: [h2,h2c]
#
# "Upgrade: h2,h2c" is a single header; unsetting it drops both h2 and h2c.
# Removing it here is safe: TLS clients already negotiate HTTP/2 via ALPN;
# they never need the Upgrade hint.
# Alt-Svc (QUIC/h3 advertisement) is stripped for the same reason — those
# hints are meaningful only for direct clients, not for OpenResty's upstream.
<IfModule headers_module>
    Header always unset Upgrade
    Header always unset Alt-Svc
</IfModule>

# ── CFM TSV log ───────────────────────────────────────────────────────────────
# Field order MUST match CFM webdetector TSV schema:
#   ts | ip | vhost | method | uri | proto | status | bytes | req_time_us | upstream_rt | referer | ua
#
# %a        real client IP after mod_remoteip resolves X-Forwarded-For
# %v        canonical ServerName (vhost)
# %{us}T    request time in microseconds  (webdetector divides by 1e6)
# "-"       upstream_rt stub (Apache has no upstream concept)
#
# cPanel log path: /usr/local/apache/logs/access_cfm_tsv.log
LogFormat "%{%s}t.%{usec_frac}t\t%a\t%v\t%m\t%U%q\t%H\t%>s\t%B\t%{us}T\t-\t%{Referer}i\t%{User-Agent}i" cfm_tsv
CustomLog /usr/local/apache/logs/access_cfm_tsv.log cfm_tsv
