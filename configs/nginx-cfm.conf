# CFM nginx integration — cPanel nginx-only and nginx+Apache servers
# Drop into: /etc/nginx/conf.d/cfm-nginx.conf
#
# Designed to coexist with cPanel-managed nginx configs. Does not override
# server blocks or upstream definitions — only adds real_ip trust and TSV log.
#
# For cPanel ea-nginx servers: also deploy nginx-cpanel-server-realip.conf
# to /etc/nginx/conf.d/server-includes/cfm-realip.conf — that file adds
# set_real_ip_from 127.0.0.1 at server-block level (additive to cloudflare.conf).

# ── Real IP ───────────────────────────────────────────────────────────────────
# Trust OpenResty as the forwarding proxy.
# proxy_bind 127.0.0.1 in openresty.conf forces all backend connections to
# originate from 127.0.0.1 regardless of server/dedicated IPs.
# These http-level directives are the fallback for server blocks that do not
# include cloudflare.conf (non-CF vhosts or pure nginx-standalone setups).
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;

# X-Real-IP is set by OpenResty to the resolved client IP (single value, not a
# chain). For cPanel ea-nginx, cloudflare.conf overrides this at server-block
# level with real_ip_header CF-Connecting-IP — openresty.conf sends the real
# IP in that header too (proxy_set_header CF-Connecting-IP $remote_addr).
real_ip_header    X-Real-IP;
real_ip_recursive off;

# ── CFM TSV log ───────────────────────────────────────────────────────────────
# Field order MUST match CFM webdetector TSV schema:
#   ts | ip | vhost | method | uri | proto | status | bytes | req_time | upstream_rt | referer | ua
#
# $cfm_client_ip reads the raw X-Real-IP header (always the real client IP set
# by OpenResty) with a fallback to $remote_addr for direct connections when
# DNAT is off. Belt-and-suspenders: works even if ngx_http_realip_module is
# unavailable or the server-includes/cfm-realip.conf is not yet deployed.
#
# $upstream_response_time is "-" for requests served without an upstream
# (e.g. nginx static files, 404s). The webdetector handles "-" safely.

map $http_x_real_ip $cfm_client_ip {
    default $http_x_real_ip;
    ""      $remote_addr;
}

log_format cfm_tsv escape=none
    '$msec\t$cfm_client_ip\t$host\t$request_method\t$request_uri\t$server_protocol\t'
    '$status\t$body_bytes_sent\t$request_time\t$upstream_response_time\t'
    '$http_referer\t$http_user_agent';

# Single http-level access_log covers all vhosts in one file for the webdetector.
access_log /var/log/nginx/access_cfm_tsv.log cfm_tsv;
