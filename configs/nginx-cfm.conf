# /etc/nginx/conf.d/cfm-nginx.conf

# ── Real IP resolution (trust OpenResty upstream) ──────────────────────────
set_real_ip_from  127.0.0.1;
set_real_ip_from  ::1;
set_real_ip_from  84.54.49.202;
real_ip_header    X-Real-IP;
real_ip_recursive on;

# ── Forward resolved real IP to Apache ─────────────────────────────────────
proxy_set_header  X-Real-IP        $remote_addr;
proxy_set_header  X-Forwarded-For  $remote_addr;

# ── Logging ─────────────────────────────────────────────────────────────────
log_format cfm_tsv escape=none
    '$msec\t$remote_addr\t$host\t$request_method\t$request_uri\t$server_protocol\t'
    '$status\t$body_bytes_sent\t$request_time\t$upstream_response_time\t'
    '$http_referer\t$http_user_agent';

access_log /var/log/nginx/access_cfm_combined.log cfm_tsv;
