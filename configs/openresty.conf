# /usr/local/openresty/nginx/conf/nginx.conf
#
# OpenResty in-path WAF mode (NO CACHE) - Option A (universal, dedicated-IP safe)
#
# REQUIREMENT (IMPORTANT):
#   nftables DNAT must be PORT-ONLY (keep destination IP):
#     tcp dport 80  dnat to :9080
#     tcp dport 443 dnat to :9043
#     udp dport 443 dnat to :9043
#
# ROUTING MODEL (IMPORTANT):
#   cfm.lua sets:
#     - $cfm_pass     (actual proxy target URL)
#     - $cfm_upstream (for logging/debug only)
#
#   Examples:
#     allow (http)  -> $cfm_pass = "http://$server_addr:80"
#     allow (https) -> $cfm_pass = "https://$server_addr:443"
#     challenge     -> $cfm_pass = "http://cfm_challenge"
#     block         -> cfm.lua exits 403
#   With detectors.conf [webdetector] ORIGIN_KEEPALIVE = 1 the allow targets
#   become the pooled upstreams http://cfm_origin_http / https://cfm_origin_https
#   instead (see the upstream blocks + docs/proxy-performance.md).
#
# Origin routing:
#   - HTTP  (9080): http://$server_addr:80
#   - HTTPS (9043): https://$server_addr:443 with SNI=$host
#
# Challenge:
#   - always http://127.0.0.1:9098
#
# SSL:
#   - fallback self-signed cert
#   - per-host dynamic certs from sslcollector
#
# BUFFERING NOTE (IMPORTANT):
#   proxy_buffering is ON globally (correct default for most traffic).
#   PHP scripts and admin directories override this to OFF via a dedicated
#   location block. Reasons:
#     - Long-running scripts stream output progressively; buffering would hold
#       the entire response in memory/disk before forwarding it to the client,
#       making the browser appear hung for the full duration.
#     - With buffering ON, if the client disconnects mid-request, nginx does
#       not propagate that signal to PHP promptly — the script keeps running
#       blind, wasting resources and potentially causing duplicate side effects.
#   Matched paths (case-insensitive):
#     *.php            → any PHP file on any path
#     /admin/*         → generic admin panel
#     /sysadmin/*      → system admin area
#     /administrator/* → Joomla-style admin
#     /wp-admin/*      → WordPress admin
#
# BOT THROTTLE NOTE (IMPORTANT):
#   Meta/SEO crawlers get soft per-vhost rate + connection limits.
#   Both limit_req (requests/sec) and limit_conn (concurrent connections)
#   are applied. limit_req prevents sustained floods; limit_conn prevents
#   burst-pileups where 40+ crawler connections saturate PHP-FPM on one
#   vhost even though the per-second rate is within bounds.
#   Normal visitors and non-crawler bots are completely unaffected (empty
#   limit keys are ignored by nginx). Per-vhost exemptions are supported
#   via the $meta_throttle_exempt_host map.

user cfm;
worker_processes 4;

error_log /usr/local/openresty/nginx/logs/error.log warn;
pid       /usr/local/openresty/nginx/logs/nginx.pid;


# Pass env vars to workers (must be set in master env before start)
env OPENRESTY_SOCK;
env OPENRESTY_TOKEN;
env CFM_DECISION_TIMEOUT_MS;
env CFM_POST_RESUME_ENABLE;
env CFM_POST_RESUME_MAX_LEN;
env CFM_POST_RESUME_TTL_SEC;

events { worker_connections 1024; }

http {
    lua_package_path '/var/lib/cfm/lua/?.lua;/usr/local/openresty/nginx/lua/?.lua;;';

    include /usr/local/openresty/nginx/conf/mime.types;
    default_type  application/octet-stream;

    # Don't leak the proxy version in the Server header or error pages (F61).
    server_tokens off;

# Temp dirs under /var/lib/cfm so the cfm worker user owns them.
# The default paths (/usr/local/openresty/nginx/*_temp) are created by
# the OpenResty package as root-owned, causing Permission Denied when
# workers run as cfm.  Post-install scripts create these dirs as cfm:cfm.
client_body_temp_path /var/lib/cfm/nginx/client_body_temp;
proxy_temp_path        /var/lib/cfm/nginx/proxy_temp;


    lua_shared_dict cfm_decisions 64m;
    lua_shared_dict sslcache      256m;

    # Resilient sslcollector bootstrap. See configs/angie.conf for the full
    # rationale — short version: a bare `require` here permanently cripples
    # the worker if the lua file is briefly unreadable at startup, because
    # start_background() (which schedules the only timers that populate
    # _store) never runs. pcall + retry timer recovers automatically.
    init_worker_by_lua_block {
        local function bootstrap(premature)
            if premature then return end
            local ok, sc = pcall(require, "sslcollector")
            if not ok or type(sc) ~= "table" then
                ngx.log(ngx.WARN,
                    "[sslcollector-bootstrap] require failed, retrying in 2s: ",
                    tostring(sc))
                local ok2, terr = ngx.timer.at(2, bootstrap)
                if not ok2 then
                    ngx.log(ngx.ERR,
                        "[sslcollector-bootstrap] reschedule failed: ", terr)
                end
                return
            end
            local ok3, serr = pcall(sc.start_background)
            if not ok3 then
                ngx.log(ngx.ERR,
                    "[sslcollector-bootstrap] start_background error: ", serr)
            end
        end
        local ok, err = ngx.timer.at(0, bootstrap)
        if not ok then
            ngx.log(ngx.ERR,
                "[sslcollector-bootstrap] initial timer failed: ", err)
        end
    }

    map $http_x_forwarded_proto $cf_xfp {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    # CFM admin allowlisting via map has been removed. Access control is now
    # handled by upstream Go auth/session logic and per-location policy.

    # DNAT mode terminates externally on :443 while nginx listens on :9043.
    # Keep redirects on canonical ports so clients never see internal :9043.
    port_in_redirect off;

    # --- Upload / buffering / timeouts ---
    client_max_body_size         8g;
    client_body_buffer_size      1m;
    client_body_timeout          300s;

    # Per-request response buffer budget held in memory. Anything larger
    # than (proxy_buffers count * size) spills to proxy_temp on disk and
    # nginx logs:
    #   "an upstream response is buffered to a temporary file
    #    /var/lib/cfm/nginx/proxy_temp/... while reading upstream"
    # The spill is harmless — the client still gets the full response
    # streamed from the temp file — but it's wasteful for medium-sized
    # responses (large HTML, JSON bundles, fonts, smaller PDFs/images)
    # where they could just stay in RAM. 4 MB covers most of those.
    # Genuinely large media (mp4/webm/zip/iso/...) will still exceed
    # this budget; for those we disable buffering entirely in a
    # dedicated location below so they stream straight through with
    # zero spill and zero warning.
    proxy_buffer_size            128k;
    proxy_buffers                64 64k;     # 4 MB per request
    proxy_busy_buffers_size      512k;
    proxy_max_temp_file_size     2048m;      # disk cap when spill is unavoidable

    large_client_header_buffers  8 64k;

    # Bigger variables hash so OpenResty's bundled vars + the per-listener
    # `set $cfm_*` directives in cfm-panel-listeners.conf don't overflow
    # the upstream-default 1024 slots. Without this, error.log emits:
    #   "could not build optimal variables_hash, you should increase
    #    either variables_hash_max_size: 1024 or variables_hash_bucket_size: 64"
    # Cost is a few KB per worker; no behavioural change.
    variables_hash_max_size      4096;
    variables_hash_bucket_size   256;

    send_timeout                 300s;
    keepalive_timeout            65s;

    # --- Client TLS session resumption ---
    # Without a shared session cache every reconnecting client pays a full
    # TLS handshake. 20 MB caches roughly 80k sessions across all listeners
    # (the DNAT 9043 server and the HTTPS panel listeners inherit this).
    # Session resumption skips ssl_certificate_by_lua on the abbreviated
    # handshake, so it composes cleanly with sslcollector's dynamic certs.
    # Tickets stay at the nginx default (on); ticket keys rotate on reload.
    ssl_session_cache            shared:cfm_ssl:20m;
    ssl_session_timeout          4h;

    proxy_connect_timeout        30s;
    proxy_send_timeout           600s;
    proxy_read_timeout           600s;

    # Keep on for origin. PHP/admin location blocks override to off.
    proxy_request_buffering      on;
    proxy_buffering              on;

    # --- Real IP (Cloudflare) ---
    # After this:
    #   $remote_addr        = real visitor IP
    #   $realip_remote_addr = Cloudflare edge IP (original peer)
    real_ip_header    CF-Connecting-IP;
    real_ip_recursive on;
    include /usr/local/openresty/nginx/conf/trusted_proxies.conf;

    # --- Challenge/WAF bypass IPs ---
    geo $cfm_bypass_ip {
        default 0;
        include /usr/local/openresty/nginx/conf/challenge_waf_bypass.conf;
    }

    # --- Logging ---
    log_format cfm_meta_throttle
      'ts="$time_local" msec=$msec '
      'client=$remote_addr peer=$realip_remote_addr host=$host '
      'method=$request_method uri="$request_uri" status=$status '
      'reason=meta_throttle_429 limit_req_status=$limit_req_status '
      'ua="$http_user_agent" req_time=$request_time';

    # Treat malformed/aborted request classes as invalid for CFM-routing logs.
    # These statuses are emitted for parse/timeout/header-size/client-abort cases.
    map $status $is_malformed_or_aborted {
        default 0;
        400     1;
        408     1;
        414     1;
        431     1;
        494     1;
        499     1;
    }
    map $is_malformed_or_aborted $request_valid_for_cfm_log {
        default 1;
        1       0;
    }

    # Keep log variables always-defined to avoid noisy
    # "using uninitialized variable while logging request" warnings.
    # Gate cfm_* source variable access behind request_valid_for_cfm_log so
    # malformed/aborted requests never force request-phase variable evaluation.
    map $request_valid_for_cfm_log $cfm_upstream_safe {
        default "-";
        1       $cfm_upstream;
    }
    map $request_valid_for_cfm_log $cfm_pass_safe {
        default "-";
        1       $cfm_pass;
    }
    map $request_valid_for_cfm_log $cfm_lua_ms_safe {
        default "-";
        1       $cfm_lua_ms;
    }

    # Latency split fields (see docs/proxy-performance.md):
    #   uct   = $upstream_connect_time — TCP connect + upstream TLS handshake
    #           to Apache. The direct measure of what origin keepalive saves.
    #   uht   = $upstream_header_time  — uct + request send + Apache TTFB.
    #   sslr  = $ssl_session_reused    — client TLS resumption ("r" = reused).
    #   luams = $cfm_lua_ms            — access-phase (cfm.lua) time in ms,
    #           stamped on origin-allow paths; "-" for challenge/block/bypass
    #           locations that skip cfm.lua.
    log_format cfm
      'ts="$time_local" msec=$msec '
      'client=$remote_addr peer=$realip_remote_addr cf="$http_cf_connecting_ip" '
      'host=$host method=$request_method uri=$request_uri proto="$server_protocol" status=$status '
      'rt=$request_time urt="$upstream_response_time" '
      'uct="$upstream_connect_time" uht="$upstream_header_time" '
      'sslr="$ssl_session_reused" luams=$cfm_lua_ms_safe '
      'ust=$upstream_status uaddr=$upstream_addr uloc="$upstream_http_location" '
      'sch=$scheme xfp_in="$http_x_forwarded_proto" xfp_out="$cf_xfp" '
      'up=$cfm_upstream_safe pass=$cfm_pass_safe dst=$server_addr:$server_port ua="$http_user_agent" ';

    # escape=json ensures control/non-UTF8 bytes are encoded in a log-safe way.
    # Keep request details in split fields (method/uri/proto) and include
    # request_line for triage without writing raw bytes directly.
    log_format cfm_bad_request escape=json
      'ts="$time_local" msec=$msec '
      'client=$remote_addr peer=$realip_remote_addr cf="$http_cf_connecting_ip" '
      'host=$host method="$request_method" uri="$request_uri" proto="$server_protocol" '
      'req_line="$request" status=$status bytes=$body_bytes_sent req_len=$request_length '
      'sch=$scheme dst=$server_addr:$server_port ua="$http_user_agent"';


# TSV log for webdetector — DEPRECATED in favor of the Unix socket path.
# CFM now receives log lines directly over /run/cfm/ingest.sock via
# configs/lua/log-cfm.lua (loaded from log_by_lua by install-openresty.sh).
# Left here commented for reference and as a fallback: if the socket path
# is unavailable, re-enable these two directives and webdetector will
# auto-fall back to tailing the file (see `cfm webtop source`).
#log_format cfm_tsv escape=none
#    '$msec\t$remote_addr\t$host\t$request_method\t$request_uri\t$server_protocol\t'
#    '$status\t$body_bytes_sent\t$request_time\t$upstream_response_time\t'
#    '$http_referer\t$http_user_agent';
#
#access_log /usr/local/openresty/nginx/logs/access_cfm_tsv.log cfm_tsv;

# Forward every request to CFM webdetector over /run/cfm/ingest.sock.
# The Lua module swallows connect/send failures, so workers never block
# and the response path is unaffected if CFM is down or restarting.
log_by_lua_block {
    local ok, m = pcall(require, "log-cfm")
    if ok and m and m.log then m.log() end
}




    # 1) detect challenge routing via cfm_pass (already safely gated above)
    map $cfm_pass_safe $is_challenge {
        default           0;
        "~*cfm_challenge" 1;
    }

    # 2) log if upstream says challenge OR pass says challenge OR uri is verify
    map "$cfm_upstream_safe|$is_challenge|$uri" $log_cfm {
        default                   0;
        "~^cfm_challenge\|"       1;  # normal path
        "~\|1\|"                  1;  # fallback: pass contains cfm_challenge
        "~\|/__cfm_verify$"       1;  # verify endpoint
        "~^cfm_block\|"           1;  # blocks (if you ever set it)
    }
    map "$request_valid_for_cfm_log|$log_cfm" $log_cfm_nonempty {
        default    0;
        "~^1\|1$"  1;
    }

    # Route malformed/aborted requests away from main cfm access logs.
    map $is_malformed_or_aborted $log_bad_request {
        default 0;
        1       1;
    }
    map $is_malformed_or_aborted $log_main_request {
        default 1;
        1       0;
    }

    # -------------------------------------------------------------------------
    # Meta / SEO crawler throttling (per-vhost, safe for shared hosting)
    # -------------------------------------------------------------------------
    map $http_user_agent $is_meta_crawler {
        default 0;

        # Explicit pass-through for in-app browsers FIRST
        # (these are real users clicking FB/IG ads — never throttle)
        "~*FB_IAB"        0;
        "~*FBAV"          0;
        "~*Instagram"     0;
        "~*IABMV"         0;

        # Social / preview bots
        "~*meta-externalagent"   1;
        "~*facebookexternalhit"  1;
        "~*facebookcatalog"      1;

        # SEO / crawler bots
        "~*dotbot"      1;
        "~*mj12bot"     1;
        "~*semrushbot"  1;
        "~*barkrowler"  1;

        # Amazon
        "~*amazonbot" 1;

        # Other safe-but-chatty crawlers worth throttling
        "~*ahrefsbot" 1;
    }

    # Optional per-vhost exemptions from Meta throttling.
    map $host $meta_throttle_exempt_host {
        default 0;
        nixpal.com 1;
        www.nixpal.com 1;
        "~*\.nixpal\.com$" 1;
    }

    # Throttle only when request is Meta crawler AND host is not exempt.
    map "$is_meta_crawler|$meta_throttle_exempt_host" $is_meta_crawler_throttled {
        default    0;
        "~^1\|0$"  1;
    }

    # Empty keys are ignored by limit_req/limit_conn — only throttled-meta
    # traffic is rate-limited; normal visitors and exempt hosts are unaffected.
    map "$host|$is_meta_crawler_throttled" $meta_host_limit_key {
        default "";
        "~^([^|]+)\|1$" "$1";
    }

    map "$host|$binary_remote_addr|$is_meta_crawler_throttled" $meta_host_ip_limit_key {
        default "";
        "~^([^|]+)\|(.+)\|1$" "$1|$2";
    }

    # Soft throttles for Meta crawler traffic.
    limit_req_zone  $meta_host_limit_key    zone=meta_host_rps:20m    rate=5r/s;
    limit_req_zone  $meta_host_ip_limit_key zone=meta_host_ip_rps:40m rate=60r/m;
    limit_conn_zone $meta_host_limit_key    zone=meta_host_conn:20m;

    limit_req_status  429;
    limit_conn_status 429;

    # Separate log switch for throttled Meta crawler requests.
    map "$is_meta_crawler_throttled|$status" $log_meta_throttle {
        default     0;
        "~^1\|429$" 1;
    }

    # Panel listener traffic split (dual-log rollout keeps main access.log active).
    # Match by explicit panel listener ports and as a fallback by upstream prefix.
    map $server_port $is_panel_listener_port {
        default 0;
        12082   1;
        12083   1;
        12086   1;
        12087   1;
        12095   1;
        12096   1;
        12222   1;
    }
    map $cfm_upstream_safe $is_panel_upstream {
        default         0;
        "~^cfm_panel_" 1;
    }
    map "$is_panel_listener_port|$is_panel_upstream" $is_panel_request {
        default     0;
        "~^1\|"   1;
        "~^0\|1$" 1;
    }
    map "$log_main_request|$is_panel_request" $log_main_request_nonpanel {
        default     0;
        "~^1\|0$" 1;
    }

    # Focused log (challenge/block traffic only)
    access_log /usr/local/openresty/nginx/logs/access.cfm.log cfm if=$log_cfm_nonempty;

    # Dedicated throttle log for Meta crawler requests rejected by limits.
    access_log /usr/local/openresty/nginx/logs/throttle.log cfm_meta_throttle if=$log_meta_throttle;

    # Full access log (exclude malformed/empty requests to avoid mixing with cfm_* traffic).
    access_log /usr/local/openresty/nginx/logs/access.log cfm if=$log_main_request;
    # Panel access log (kept alongside main access log during rollout).
    access_log /usr/local/openresty/nginx/logs/access-panel.log cfm if=$is_panel_request;
    # Dedicated malformed/empty request log.
    access_log /usr/local/openresty/nginx/logs/access.bad_request.log cfm_bad_request if=$log_bad_request;

    # --- Challenge upstream ---
    upstream cfm_challenge {
        server 127.0.0.1:9098;
        keepalive 8;
    }

    # --- Origin keepalive pools (OPT-IN; see docs/proxy-performance.md) ---
    # Only used when detectors.conf sets [webdetector] ORIGIN_KEEPALIVE = 1
    # (published to Lua via cfm_bridge_config.lua) AND this conf's
    # $cfm_origin_ka_conf sentinel is present — cfm.lua's origin_pass_for()
    # then routes allow-traffic here instead of the
    # default proxy_pass http(s)://$server_addr, which opens a fresh TCP
    # connection (plus a full upstream TLS handshake on 443) to Apache for
    # EVERY request. cfm_origin_ka.lua sets the real peer per request
    # ($server_addr keeps dedicated-IP routing intact) and pools:
    #   - port 80:  always pooled (HTTP/1.1 Host-header vhost routing).
    #   - port 443: pooled only when lua-resty-core supports SNI-keyed
    #     pools (OpenResty 1.27.1.1+); otherwise falls back to per-request
    #     connections so a connection handshaked for one SNI is never
    #     reused for another vhost (Apache 421 Misdirected Request).
    # With the knob off these blocks are never referenced.
    upstream cfm_origin_http {
        server 0.0.0.1;   # placeholder; real peer set in balancer_by_lua
        balancer_by_lua_block {
            local ok, ka = pcall(require, "cfm_origin_ka")
            if ok and ka and ka.balance then
                ka.balance(80)
            else
                ngx.log(ngx.ERR, "[cfm] cfm_origin_ka load failed: ", tostring(ka))
                require("ngx.balancer").set_current_peer(ngx.var.server_addr or "127.0.0.1", 80)
            end
        }
    }
    upstream cfm_origin_https {
        server 0.0.0.1;   # placeholder; real peer set in balancer_by_lua
        balancer_by_lua_block {
            local ok, ka = pcall(require, "cfm_origin_ka")
            if ok and ka and ka.balance then
                ka.balance(443)
            else
                ngx.log(ngx.ERR, "[cfm] cfm_origin_ka load failed: ", tostring(ka))
                require("ngx.balancer").set_current_peer(ngx.var.server_addr or "127.0.0.1", 443)
            end
        }
    }

    # -------------------------------------------------------------------------
    # HTTP listener (DNAT 80 -> 9080)
    # -------------------------------------------------------------------------
    server {
        listen 9080;
        server_name _;

        # Applied to all locations in this server; effective only when the
        # computed key is non-empty (Meta crawler UAs).
        limit_req  zone=meta_host_rps    burst=60 nodelay;
        limit_req  zone=meta_host_ip_rps burst=30 nodelay;
        limit_conn meta_host_conn 30;

        # cfm.lua will set these per-request
        set $cfm_pass     "";
        set $cfm_upstream "cfm_apache";
        # Opt-in flag for locations that should force the PoW challenge.
        set $cfm_force_challenge "";
        # Access-phase timing stamp written by cfm.lua (luams= in the cfm log).
        set $cfm_lua_ms "-";
        # Sentinel: this conf declares the cfm_origin_* upstream blocks, so
        # cfm.lua may route to them when ORIGIN_KEEPALIVE is armed. An older
        # live conf lacks this var; cfm.lua then keeps direct proxying
        # instead of proxy_pass-ing to a nonexistent upstream (502s).
        set $cfm_origin_ka_conf "1";
        access_by_lua_file /var/lib/cfm/lua/cfm.lua;

        # Suppress HTTP/2 upgrade hints from Apache backend.
        # Placed at server level so it applies to ALL locations in this block
        # (location /, PHP/admin no-buffer passthrough, and any future locations)
        # without per-location repetition — same pattern as /cpanelwebcall.
        # Upgrade: h2,h2c — illegal in HTTP/2 responses (RFC 9113 §8.6); causes:
        #   curl: (92) Invalid HTTP header field: name=[upgrade] value=[h2,h2c]
        # "Upgrade: h2,h2c" is one header; stripping by name drops both h2 and h2c.
        # Alt-Svc — QUIC/h3 advertisements belong to OpenResty, not the backend.
        proxy_hide_header Upgrade;
        proxy_hide_header Alt-Svc;

        # Force all outbound proxy connections to Apache to originate from 127.0.0.1.
        #
        # When OpenResty proxies to http://$server_addr:80, the OS routes the
        # packet locally but uses $server_addr as the TCP source IP (not 127.0.0.1).
        # Apache's mod_remoteip would then see the connection from the server's own
        # public/dedicated IP and reject the X-Forwarded-For header as untrusted —
        # logging OpenResty's IP instead of the real client.
        #
        # With proxy_bind 127.0.0.1, every backend connection originates from
        # loopback regardless of how many dedicated IPs the server has, so
        # "RemoteIPInternalProxy 127.0.0.1" in httpd-cfm.conf is sufficient and
        # needs no per-server IP maintenance.
        #
        # Safety: all upstreams in this config are local ($server_addr:80/443,
        # 127.0.0.1:9098 challenge, 127.0.0.1:6060 admin, 127.0.0.1:2082 cpsrvd).
        proxy_bind 127.0.0.1;

        # Challenge verification endpoint.
        #
        # This endpoint is public because browsers submit/redirect here to validate
        # a solved challenge and receive the clearance cookie. It must stay proxied
        # to the challenge service, not the origin application.
        #
        # Bypass cfm.lua intentionally:
        # - prevents verification requests from being re-challenged
        # - preserves challenge-service redirects and Set-Cookie headers
        # - avoids origin 404s or WordPress/Apache handling for CFM control paths
        #
        # Verification responses may include one-time state, redirects, errors, or
        # clearance-cookie updates. Keep them uncacheable, non-indexable, and avoid
        # leaking verification URLs through cross-site referrers.
        location = /__cfm_verify {
            access_by_lua_block { return; }

            proxy_pass         http://cfm_challenge;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";

            proxy_set_header   Host              $host;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   CF-Connecting-IP  $remote_addr;

            proxy_request_buffering off;
            proxy_buffering         off;

            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0, private" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
            add_header Referrer-Policy "same-origin" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Challenge page endpoint.
        #
        # This exact location must be reserved by CFM on normal web listeners.
        # Challenge rules redirect browsers here after the first protected request.
        # Without this block, /__cfm_challenge falls through to the generic origin
        # proxy path and applications such as WordPress return their own 404 page.
        #
        # Bypass cfm.lua here intentionally:
        # - prevents challenge-on-challenge loops
        # - prevents WAF/rule evaluation from proxying this endpoint to Apache
        # - lets the dedicated challenge service handle its own validation/rate logic
        #
        # This path is internal CFM control-plane UX, not site content. Keep it
        # uncacheable and non-indexable.
        location = /__cfm_challenge {
            access_by_lua_block { return; }

            proxy_pass         http://cfm_challenge;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";

            proxy_set_header   Host              $host;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   CF-Connecting-IP  $remote_addr;

            proxy_request_buffering off;
            proxy_buffering         off;

            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0, private" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Debug endpoint for sslcollector dict
        location = /__ssl_debug {
            allow 127.0.0.1;
            deny all;
            content_by_lua_block {
                local d = ngx.shared.sslcache
                ngx.say("ready=",   d:get("meta:ready")   or "0")
                ngx.say("version=", d:get("meta:version") or "-")
            }
        }

        # ------------------------------------------------------------------
        # NO-BUFFER PASSTHROUGH: PHP scripts + admin directories
        #
        # Must be listed BEFORE location / so nginx matches it first.
        # ------------------------------------------------------------------
        location ~* ^(?:/(?:admin|sysadmin|administrator|wp-admin)/|.*\.php(?:\?|$)) {
            proxy_pass         $cfm_pass;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $cf_xfp;
            proxy_set_header   CF-Connecting-IP  $remote_addr;

            proxy_request_buffering off;
            proxy_buffering         off;

            proxy_read_timeout 600s;
        }

        # ------------------------------------------------------------------
        # STATIC-ASSET BYPASS
        #
        # Skip cfm.lua entirely for extensions that have no HTTP-layer
        # inspection value: CSS, JS, fonts, images, source maps. Mirrors
        # origin_pass_for(scheme) in cfm.lua. .svg is intentionally NOT in
        # this list — SVG can carry script content and must continue
        # through WAF.
        #
        # Path-info guard (audit F06): the regex matches the URL *suffix*, not
        # the file actually served, so a bare `\.(css|js|…)$` also matched PHP
        # path-info like `/evil.php/x.css` — which Apache (cgi.fix_pathinfo)
        # executes as evil.php, giving a WAF/challenge blind spot. The leading
        # `(?!.*\.(?:phtml|pht|php[0-9]|php|phar)/)` negative-lookahead excludes
        # any URL containing a `.php…/` (also `.phtml/`/`.pht/`/`.php5/`/`.phar/`)
        # segment, so those fall through to the server-level cfm.lua and ARE
        # inspected. Genuine static (including `?v=` cache-busters — location
        # matching ignores the query) is unaffected.
        #
        # Deliberately scoped to the PHP suffix family (Option A), so three
        # narrower residuals stay on the fast path by design:
        #   1. a real `.css` that mod_rewrites to a front controller with a
        #      malicious query;
        #   2. a multi-extension name like `/evil.php.jpg/x.css` — executes as
        #      PHP only under the legacy `AddHandler …/x-httpd-php .php` form,
        #      NOT modern EA4 `<FilesMatch \.php$>`;
        #   3. non-PHP path-info handlers (`.cgi`/`.pl`/`.py`/`.shtml`).
        # All three are far narrower than the `.php/` case and remain visible to
        # the log-driven behavioural engine; the guard covers the universal
        # fix_pathinfo `.php/` vector that executes regardless of handler style.
        #
        # Future caching: this location block is the natural home for a
        # static cache. To enable, declare a proxy_cache_path in http {}
        # (e.g. proxy_cache_path /var/cache/cfm/static levels=1:2
        # keys_zone=cfm_static:100m max_size=10g inactive=7d;) and add
        # `proxy_cache cfm_static; proxy_cache_valid 200 1h;` here. The
        # bypass already routes here without Lua, so caching becomes a
        # pure nginx-side change. Per-vhost knobs (e.g. set $cfm_static_cache
        # 1; with proxy_cache_bypass $cfm_static_cache;) are the natural
        # extension if some sites need caching off.
        # ------------------------------------------------------------------
        location ~* "^(?!.*\.(?:phtml|pht|php[0-9]|php|phar)/).*\.(?:css|js|woff|woff2|ttf|eot|png|jpg|jpeg|gif|webp|ico|map)$" {
            access_by_lua_block { return; }

            set $cfm_upstream "cfm_apache_static";
            proxy_pass         http://$server_addr:80;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $cf_xfp;
            proxy_set_header   CF-Connecting-IP  $remote_addr;

            proxy_request_buffering off;
            proxy_buffering         off;

            # FUTURE: proxy_cache cfm_static; proxy_cache_valid 200 1h;
            # See header comment for the full enablement recipe.
        }

        # ------------------------------------------------------------------
        # STREAMING / LARGE-DOWNLOAD PASSTHROUGH
        #
        # Static media and archive responses are routinely larger than the
        # in-memory proxy_buffers budget; with buffering on, every one of
        # them spills to /var/lib/cfm/nginx/proxy_temp and triggers:
        #   "an upstream response is buffered to a temporary file ...
        #    while reading upstream"
        # The download still completes correctly, but the temp-file dance
        # is pointless for streaming media (the client consumes as fast as
        # the network allows) and noisy in error.log.
        #
        # Disable buffering for these so they stream straight through:
        # zero spill, zero warning, zero memory growth per request.
        # WAF and rules still run because access_by_lua_file is at the
        # server level — only the upstream-buffering stage is bypassed.
        # ------------------------------------------------------------------
        location ~* \.(?:mp4|m4v|m4a|webm|mov|avi|mkv|flv|ts|m3u8|mpd|ogv|ogg|aac|wav|flac|mp3|zip|tar|tar\.gz|tgz|tar\.bz2|tbz2|tar\.xz|txz|7z|rar|iso|img|dmg|exe|msi|bin|deb|rpm)(?:\?.*)?$ {
            proxy_pass         $cfm_pass;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $cf_xfp;
            proxy_set_header   CF-Connecting-IP  $remote_addr;

            proxy_request_buffering off;
            proxy_buffering         off;

            # Big files over slow links: don't kill the connection mid-stream.
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        # ------------------------------------------------------------------
        # cPanel Dynamic DNS — bypass cfm, proxy direct to cpsrvd :2082
        # $remote_addr is already the resolved real client IP here.
        # ------------------------------------------------------------------
        location /cpanelwebcall {
            access_by_lua_block { return; }

            proxy_pass http://127.0.0.1:2082/cpanelwebcall;

            proxy_hide_header Upgrade;
            proxy_set_header  Accept-Encoding    "";
            proxy_set_header  Connection         "";
            proxy_set_header  Host               $host;
            proxy_set_header  Proxy              "";
            proxy_set_header  Referer            $http_referer;

            proxy_set_header  X-Real-IP          $remote_addr;
            proxy_set_header  X-Forwarded-For    $remote_addr;
            proxy_set_header  X-Forwarded-Host   $host;
            proxy_set_header  X-Forwarded-Port   $server_port;
            proxy_set_header  X-Forwarded-Proto  $scheme;
            proxy_set_header  X-Forwarded-Server $host;
            proxy_set_header  CF-Connecting-IP   $remote_addr;
            proxy_set_header  CF-Visitor         $http_cf_visitor;

            proxy_connect_timeout 300s;
            proxy_read_timeout    300s;
            proxy_send_timeout    300s;
        }

        # ------------------------------------------------------------------
        # CFM Admin UI — all requests proxied to Go binary.
        # Go serves embedded HTML/JS/CSS, /login, /logout, and /api/*.
        # No auth_basic — goauth session handles auth inside Go.
        # OpenResty rewrites /cfm-admin/foo → /foo before forwarding.
        # ------------------------------------------------------------------
        location = /cfm-admin {
            access_by_lua_block { return; }
            return 301 /cfm-admin/;
        }

        # Login endpoints: routed through cfm.lua so WAF + forced PoW challenge
        # apply. Covers /cfm-admin/login, /cfm-admin/login/, /cfm-admin/login/verify,
        # and /cfm-admin/login/webauthn/*. Once solved, the cfm_ok cookie grants
        # a free pass for the full TTL so the admin UI isn't re-challenged.
        location ^~ /cfm-admin/login {
            set $cfm_force_challenge "1";

            rewrite ^/cfm-admin/(.*)$ /$1 break;
            # Keep login on Go apiserver directly (no challenge upstream hop).
            proxy_pass         http://127.0.0.1:6060;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-CFM-Base      /cfm-admin;
            proxy_set_header   X-Forwarded-Prefix /cfm-admin;
            # Only rewrite root redirects with query strings (e.g. /?next=...)
            # so challenge responses stay under /cfm-admin without touching
            # /login redirects that can trigger redirect loops.
            proxy_redirect     ~^(/\?.*)$ /cfm-admin$1;
            proxy_intercept_errors on;
            error_page         500 502 503 504 = @cfm_admin_upstream_error;
            add_header         Cache-Control   "no-store" always;
        }

        location ^~ /cfm-admin/ {
            access_by_lua_block { return; }

            rewrite ^/cfm-admin/(.*)$ /$1 break;
            proxy_pass         http://127.0.0.1:6060;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-CFM-Base      /cfm-admin;
            proxy_set_header   X-Forwarded-Prefix /cfm-admin;
            # Go now emits /cfm-admin-prefixed redirects when X-CFM-Base /
            # X-Forwarded-Prefix are present. Keep redirect rewriting off here
            # to avoid double-prefix locations like /cfm-admin/cfm-admin/login.
            proxy_redirect     off;
            proxy_intercept_errors on;
            error_page         500 502 503 504 = @cfm_admin_upstream_error;
            add_header         Cache-Control   "no-store" always;
        }

        # Embed bootstrap handshake endpoint used by plugin/browser.
        # Keep this under /cfm-admin/api to avoid taking over tenant apps
        # that may legitimately own /api/v1/embed/bootstrap on shared hosts.
        location = /cfm-admin/api/v1/embed/bootstrap {
            access_by_lua_block { return; }
            proxy_pass         http://127.0.0.1:6060/api/v1/embed/bootstrap$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-CFM-Base         /cfm-admin;
            proxy_set_header   X-Forwarded-Prefix /cfm-admin;
            add_header         Cache-Control       "no-store" always;
        }

        location @cfm_admin_upstream_error {
            internal;
            default_type application/json;
            add_header Cache-Control "no-store" always;
            content_by_lua_block {
                local cjson = require "cjson.safe"
                ngx.log(ngx.ERR,
                    "[cfm-admin] upstream failure status=", tostring(ngx.var.upstream_status or "-"),
                    " addr=", tostring(ngx.var.upstream_addr or "-"),
                    " host=", tostring(ngx.var.host or "-"),
                    " uri=", tostring(ngx.var.request_uri or "-"))

                ngx.status = ngx.HTTP_BAD_GATEWAY
                local accept = ngx.var.http_accept or ""
                if accept:find("application/json", 1, true) then
                    ngx.say(cjson.encode({ error = "CFM Admin is temporarily unavailable." }))
                    return
                end
                ngx.say("CFM Admin is temporarily unavailable. Please try again shortly.")
            }
        }

        # Internal auth gate for OpenResty-served admin endpoints.
        # Validates browser/session auth via Go API before serving lua-stats.
        # Must be ADMIN-only: /api/v1/admin/authcheck 403s scoped tokens. (Do NOT
        # point this at /api/v1/tokens/me — that endpoint is scoped-OR-admin, so a
        # scoped cPanel viewer would pass the gate and get fleet-wide stats. F01.)
        location = /__cfm_admin_auth_check {
            internal;
            access_by_lua_block { return; }

            proxy_pass              http://127.0.0.1:6060/api/v1/admin/authcheck;
            proxy_http_version      1.1;
            proxy_set_header        Connection "";
            proxy_set_header        Host               $host;
            proxy_set_header        X-Real-IP          $remote_addr;
            proxy_set_header        X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header        X-CFM-Base         /cfm-admin;
            proxy_set_header        X-Forwarded-Prefix /cfm-admin;
            proxy_pass_request_body off;
            proxy_set_header        Content-Length "";
        }

        # Lua stats — exact match wins over ^~ above.
        # Served directly by OpenResty (Go cannot access nginx internals).
        # Access is gated via internal auth_request above.
        location = /cfm-admin/lua-stats {
            access_by_lua_block { return; }
            auth_request /__cfm_admin_auth_check;

            add_header Cache-Control "no-store" always;
            add_header Content-Type  "application/json; charset=utf-8" always;

            content_by_lua_block {
                local ok, stats = pcall(require, "cfm_stats")
                local cjson = require "cjson.safe"
                if not ok then
                    ngx.status = 500
                    ngx.say(cjson.encode({ error = tostring(stats) }))
                    return
                end
                ngx.status = 200
                ngx.say(cjson.encode(stats.stats()))
            }
        }

        # Force-unblock: delete per-IP keys from the cfm_decisions shared dict
        # (throttle, decision cache, geo, ok-touch, waf-push, panel challenge).
        # Called by the cfm daemon (NginxBridge.purgeShared) over loopback
        # during a force unblock. Go cannot touch nginx shdicts, so this
        # Lua-served endpoint is the only way to clear that WAF state.
        #
        # Two independent gates enforced in Lua: (1) check_loopback() on
        # $realip_remote_addr (the real peer) and (2) the bridge token. The
        # static allow/deny below is only a coarse first filter: it sees the
        # real_ip-rewritten $remote_addr, which a Cloudflare-fronted request
        # can forge via CF-Connecting-IP — so check_loopback() is what actually
        # enforces loopback.
        location = /cfm-admin/purge-ip {
            allow 127.0.0.1;
            allow ::1;
            deny all;

            add_header Cache-Control "no-store" always;
            add_header Content-Type  "application/json; charset=utf-8" always;

            content_by_lua_block {
                local cjson    = require "cjson.safe"
                local ok, purge = pcall(require, "cfm_purge")
                if not ok then
                    ngx.status = 500
                    ngx.say(cjson.encode({ error = "cfm_purge load: " .. tostring(purge) }))
                    return
                end
                if not purge.check_loopback() or not purge.check_token() then
                    ngx.status = 403
                    ngx.say(cjson.encode({ error = "forbidden" }))
                    return
                end
                local ip = ngx.req.get_headers()["X-CFM-Purge-IP"] or ""
                if ip == "" then
                    ngx.status = 400
                    ngx.say(cjson.encode({ error = "missing ip" }))
                    return
                end
                ngx.status = 200
                ngx.say(cjson.encode(purge.purge_ip(ip)))
            }
        }

        # Single proxy path: cfm.lua sets $cfm_pass to challenge or origin
        location / {
            proxy_pass         $cfm_pass;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $cf_xfp;
            proxy_set_header   CF-Connecting-IP  $remote_addr;
        }
    }

    # -------------------------------------------------------------------------
    # HTTPS listener (DNAT 443 -> 9043)
    # -------------------------------------------------------------------------
    server {
        listen 9043 ssl;             # TCP
        http2 on;

        listen 9043 quic reuseport;  # UDP QUIC
        http3 on;

        ssl_protocols TLSv1.2 TLSv1.3;
        # HTTP/3 listener stays on, but Alt-Svc is NOT advertised by default.
        # Per-vhost opt-in via cfm-admin / `cfm webtop http3 enable <host>`
        # populates the list consumed by cfm_h3_config.lua below. Default
        # remains "no Alt-Svc" → browsers stay on HTTP/2.
        #
        # header_filter phase runs for EVERY response (allow / cleared /
        # bypass / proxied / challenge), so the opt-in is honored regardless
        # of which access-phase Step decided to serve. pcall keeps this
        # fail-safe: a Lua module load error silently degrades to "no H3".
        header_filter_by_lua_block {
            local ok, h3 = pcall(require, "cfm_h3_config")
            if ok and h3 and h3.maybe_set_alt_svc then
                h3.maybe_set_alt_svc()
            end
        }

        server_name _;

        # Applied to all locations in this server; effective only when the
        # computed key is non-empty (Meta crawler UAs).
        limit_req  zone=meta_host_rps    burst=60 nodelay;
        limit_req  zone=meta_host_ip_rps burst=30 nodelay;
        limit_conn meta_host_conn 30;

        # Fallback cert (used if sslcollector has not loaded yet)
        ssl_certificate     /var/lib/cfm/certs/selfsigned/fullchain.pem;
        ssl_certificate_key /var/lib/cfm/certs/selfsigned/privkey.pem;

        # Dynamic per-host certs from sslcollector
        ssl_certificate_by_lua_block {
            local sc = require "sslcollector"
            sc.set_cert()
        }

        # cfm.lua will set these per-request
        set $cfm_pass     "";
        set $cfm_upstream "cfm_apache";
        # Opt-in flag for locations that should force the PoW challenge.
        set $cfm_force_challenge "";
        # Access-phase timing stamp written by cfm.lua (luams= in the cfm log).
        set $cfm_lua_ms "-";
        # Sentinel: this conf declares the cfm_origin_* upstream blocks, so
        # cfm.lua may route to them when ORIGIN_KEEPALIVE is armed. An older
        # live conf lacks this var; cfm.lua then keeps direct proxying
        # instead of proxy_pass-ing to a nonexistent upstream (502s).
        set $cfm_origin_ka_conf "1";
        access_by_lua_file /var/lib/cfm/lua/cfm.lua;

        # Suppress HTTP/2 upgrade hints from Apache backend (same rationale as HTTP block).
        # Server-level placement covers all locations: location /, PHP/admin passthrough, etc.
        proxy_hide_header Upgrade;
        proxy_hide_header Alt-Svc;

        # Force loopback source for all backend connections (same rationale as HTTP block).
        proxy_bind 127.0.0.1;

        # Challenge verification endpoint.
        #
        # This endpoint is public because browsers submit/redirect here to validate
        # a solved challenge and receive the clearance cookie. It must stay proxied
        # to the challenge service, not the origin application.
        #
        # Bypass cfm.lua intentionally:
        # - prevents verification requests from being re-challenged
        # - preserves challenge-service redirects and Set-Cookie headers
        # - avoids origin 404s or WordPress/Apache handling for CFM control paths
        #
        # Verification responses may include one-time state, redirects, errors, or
        # clearance-cookie updates. Keep them uncacheable, non-indexable, and avoid
        # leaking verification URLs through cross-site referrers.
        location = /__cfm_verify {
            access_by_lua_block { return; }

            proxy_pass         http://cfm_challenge;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";

            proxy_set_header   Host              $host;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   CF-Connecting-IP  $remote_addr;

            proxy_request_buffering off;
            proxy_buffering         off;

            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0, private" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
            add_header Referrer-Policy "same-origin" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Challenge page endpoint.
        #
        # This exact location must be reserved by CFM on normal web listeners.
        # Challenge rules redirect browsers here after the first protected request.
        # Without this block, /__cfm_challenge falls through to the generic origin
        # proxy path and applications such as WordPress return their own 404 page.
        #
        # Bypass cfm.lua here intentionally:
        # - prevents challenge-on-challenge loops
        # - prevents WAF/rule evaluation from proxying this endpoint to Apache
        # - lets the dedicated challenge service handle its own validation/rate logic
        #
        # This path is internal CFM control-plane UX, not site content. Keep it
        # uncacheable and non-indexable.
        location = /__cfm_challenge {
            access_by_lua_block { return; }

            proxy_pass         http://cfm_challenge;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";

            proxy_set_header   Host              $host;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   CF-Connecting-IP  $remote_addr;

            proxy_request_buffering off;
            proxy_buffering         off;

            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0, private" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Debug endpoint for sslcollector dict
        location = /__ssl_debug {
            allow 127.0.0.1;
            deny all;
            content_by_lua_block {
                local d = ngx.shared.sslcache
                ngx.say("ready=",   d:get("meta:ready")   or "0")
                ngx.say("version=", d:get("meta:version") or "-")
            }
        }

        # ------------------------------------------------------------------
        # NO-BUFFER PASSTHROUGH: PHP scripts + admin directories
        # See HTTP block above for full explanation.
        # ------------------------------------------------------------------
        location ~* ^(?:/(?:admin|sysadmin|administrator|wp-admin)/|.*\.php(?:\?|$)) {
            proxy_pass $cfm_pass;

            # Send correct SNI when proxying to https://origin:443
            proxy_ssl_server_name on;
            proxy_ssl_name        $host;

            proxy_http_version 1.1;
            proxy_set_header   Connection "";

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $cf_xfp;
            proxy_set_header   CF-Connecting-IP  $remote_addr;

            proxy_request_buffering off;
            proxy_buffering         off;

            proxy_read_timeout 600s;
        }

        # ------------------------------------------------------------------
        # STATIC-ASSET BYPASS (HTTPS)
        # See HTTP block above for full explanation, including the future-
        # caching enablement recipe.
        # ------------------------------------------------------------------
        location ~* "^(?!.*\.(?:phtml|pht|php[0-9]|php|phar)/).*\.(?:css|js|woff|woff2|ttf|eot|png|jpg|jpeg|gif|webp|ico|map)$" {
            access_by_lua_block { return; }

            set $cfm_upstream "cfm_apache_static";
            proxy_pass         https://$server_addr:443;

            proxy_ssl_server_name on;
            proxy_ssl_name        $host;

            proxy_http_version 1.1;
            proxy_set_header   Connection "";

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $cf_xfp;
            proxy_set_header   CF-Connecting-IP  $remote_addr;

            proxy_request_buffering off;
            proxy_buffering         off;

            # FUTURE: proxy_cache cfm_static; proxy_cache_valid 200 1h;
        }

        # ------------------------------------------------------------------
        # STREAMING / LARGE-DOWNLOAD PASSTHROUGH (HTTPS)
        # See HTTP block above for full explanation.
        # ------------------------------------------------------------------
        location ~* \.(?:mp4|m4v|m4a|webm|mov|avi|mkv|flv|ts|m3u8|mpd|ogv|ogg|aac|wav|flac|mp3|zip|tar|tar\.gz|tgz|tar\.bz2|tbz2|tar\.xz|txz|7z|rar|iso|img|dmg|exe|msi|bin|deb|rpm)(?:\?.*)?$ {
            proxy_pass $cfm_pass;

            proxy_ssl_server_name on;
            proxy_ssl_name        $host;

            proxy_http_version 1.1;
            proxy_set_header   Connection "";

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $cf_xfp;
            proxy_set_header   CF-Connecting-IP  $remote_addr;

            proxy_request_buffering off;
            proxy_buffering         off;

            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        # ------------------------------------------------------------------
        # cPanel Dynamic DNS — bypass cfm, proxy direct to cpsrvd :2082
        # Mirrors cpanel-proxy.conf headers exactly so cpsrvd sees the real
        # client IP in X-Real-IP / X-Forwarded-For, not 127.0.0.1.
        # ------------------------------------------------------------------
        location /cpanelwebcall {
            access_by_lua_block { return; }

            proxy_pass http://127.0.0.1:2082/cpanelwebcall;

            proxy_hide_header Upgrade;
            proxy_set_header  Accept-Encoding    "";
            proxy_set_header  Connection         "";
            proxy_set_header  Host               $host;
            proxy_set_header  Proxy              "";
            proxy_set_header  Referer            $http_referer;

            proxy_set_header  X-Real-IP          $remote_addr;
            proxy_set_header  X-Forwarded-For    $remote_addr;
            proxy_set_header  X-Forwarded-Host   $host;
            proxy_set_header  X-Forwarded-Port   $server_port;
            proxy_set_header  X-Forwarded-Proto  $scheme;
            proxy_set_header  X-Forwarded-Server $host;
            proxy_set_header  CF-Connecting-IP   $remote_addr;
            proxy_set_header  CF-Visitor         $http_cf_visitor;

            proxy_connect_timeout 300s;
            proxy_read_timeout    300s;
            proxy_send_timeout    300s;
        }

        # ------------------------------------------------------------------
        # CFM Admin UI — all requests proxied to Go binary.
        # Go serves embedded HTML/JS/CSS, /login, /logout, and /api/*.
        # No auth_basic — goauth session handles auth inside Go.
        # OpenResty rewrites /cfm-admin/foo → /foo before forwarding.
        # ------------------------------------------------------------------
        location = /cfm-admin {
            access_by_lua_block { return; }
            return 301 /cfm-admin/;
        }

        # Login endpoints: routed through cfm.lua so WAF + forced PoW challenge
        # apply. Covers /cfm-admin/login, /cfm-admin/login/, /cfm-admin/login/verify,
        # and /cfm-admin/login/webauthn/*. Once solved, the cfm_ok cookie grants
        # a free pass for the full TTL so the admin UI isn't re-challenged.
        location ^~ /cfm-admin/login {
            set $cfm_force_challenge "1";

            rewrite ^/cfm-admin/(.*)$ /$1 break;
            # Keep login on Go apiserver directly (no challenge upstream hop).
            proxy_pass         http://127.0.0.1:6060;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-CFM-Base      /cfm-admin;
            proxy_set_header   X-Forwarded-Prefix /cfm-admin;
            # Only rewrite root redirects with query strings (e.g. /?next=...)
            # so challenge responses stay under /cfm-admin without touching
            # /login redirects that can trigger redirect loops.
            proxy_redirect     ~^(/\?.*)$ /cfm-admin$1;
            proxy_intercept_errors on;
            error_page         500 502 503 504 = @cfm_admin_upstream_error;
            add_header         Cache-Control   "no-store" always;
        }

        location ^~ /cfm-admin/ {
            access_by_lua_block { return; }

            rewrite ^/cfm-admin/(.*)$ /$1 break;
            proxy_pass         http://127.0.0.1:6060;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-CFM-Base      /cfm-admin;
            proxy_set_header   X-Forwarded-Prefix /cfm-admin;
            # Go now emits /cfm-admin-prefixed redirects when X-CFM-Base /
            # X-Forwarded-Prefix are present. Keep redirect rewriting off here
            # to avoid double-prefix locations like /cfm-admin/cfm-admin/login.
            proxy_redirect     off;
            proxy_intercept_errors on;
            error_page         500 502 503 504 = @cfm_admin_upstream_error;
            add_header         Cache-Control   "no-store" always;
        }

        # Embed bootstrap handshake endpoint used by plugin/browser.
        # Keep this under /cfm-admin/api to avoid taking over tenant apps
        # that may legitimately own /api/v1/embed/bootstrap on shared hosts.
        location = /cfm-admin/api/v1/embed/bootstrap {
            access_by_lua_block { return; }
            proxy_pass         http://127.0.0.1:6060/api/v1/embed/bootstrap$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-CFM-Base         /cfm-admin;
            proxy_set_header   X-Forwarded-Prefix /cfm-admin;
            add_header         Cache-Control       "no-store" always;
        }

        location @cfm_admin_upstream_error {
            internal;
            default_type application/json;
            add_header Cache-Control "no-store" always;
            content_by_lua_block {
                local cjson = require "cjson.safe"
                ngx.log(ngx.ERR,
                    "[cfm-admin] upstream failure status=", tostring(ngx.var.upstream_status or "-"),
                    " addr=", tostring(ngx.var.upstream_addr or "-"),
                    " host=", tostring(ngx.var.host or "-"),
                    " uri=", tostring(ngx.var.request_uri or "-"))

                ngx.status = ngx.HTTP_BAD_GATEWAY
                local accept = ngx.var.http_accept or ""
                if accept:find("application/json", 1, true) then
                    ngx.say(cjson.encode({ error = "CFM Admin is temporarily unavailable." }))
                    return
                end
                ngx.say("CFM Admin is temporarily unavailable. Please try again shortly.")
            }
        }

        # Internal auth gate for OpenResty-served admin endpoints.
        # Validates browser/session auth via Go API before serving lua-stats.
        # Must be ADMIN-only: /api/v1/admin/authcheck 403s scoped tokens. (Do NOT
        # point this at /api/v1/tokens/me — that endpoint is scoped-OR-admin, so a
        # scoped cPanel viewer would pass the gate and get fleet-wide stats. F01.)
        location = /__cfm_admin_auth_check {
            internal;
            access_by_lua_block { return; }

            proxy_pass              http://127.0.0.1:6060/api/v1/admin/authcheck;
            proxy_http_version      1.1;
            proxy_set_header        Connection "";
            proxy_set_header        Host               $host;
            proxy_set_header        X-Real-IP          $remote_addr;
            proxy_set_header        X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header        X-CFM-Base         /cfm-admin;
            proxy_set_header        X-Forwarded-Prefix /cfm-admin;
            proxy_pass_request_body off;
            proxy_set_header        Content-Length "";
        }

        # Lua stats — exact match wins over ^~ above.
        # Served directly by OpenResty (Go cannot access nginx internals).
        # Access is gated via internal auth_request above.
        location = /cfm-admin/lua-stats {
            access_by_lua_block { return; }
            auth_request /__cfm_admin_auth_check;

            add_header Cache-Control "no-store" always;
            add_header Content-Type  "application/json; charset=utf-8" always;

            content_by_lua_block {
                local ok, stats = pcall(require, "cfm_stats")
                local cjson = require "cjson.safe"
                if not ok then
                    ngx.status = 500
                    ngx.say(cjson.encode({ error = tostring(stats) }))
                    return
                end
                ngx.status = 200
                ngx.say(cjson.encode(stats.stats()))
            }
        }

        # Force-unblock: delete per-IP keys from the cfm_decisions shared dict
        # (throttle, decision cache, geo, ok-touch, waf-push, panel challenge).
        # Called by the cfm daemon (NginxBridge.purgeShared) over loopback
        # during a force unblock. Go cannot touch nginx shdicts, so this
        # Lua-served endpoint is the only way to clear that WAF state.
        #
        # Two independent gates enforced in Lua: (1) check_loopback() on
        # $realip_remote_addr (the real peer) and (2) the bridge token. The
        # static allow/deny below is only a coarse first filter: it sees the
        # real_ip-rewritten $remote_addr, which a Cloudflare-fronted request
        # can forge via CF-Connecting-IP — so check_loopback() is what actually
        # enforces loopback.
        location = /cfm-admin/purge-ip {
            allow 127.0.0.1;
            allow ::1;
            deny all;

            add_header Cache-Control "no-store" always;
            add_header Content-Type  "application/json; charset=utf-8" always;

            content_by_lua_block {
                local cjson    = require "cjson.safe"
                local ok, purge = pcall(require, "cfm_purge")
                if not ok then
                    ngx.status = 500
                    ngx.say(cjson.encode({ error = "cfm_purge load: " .. tostring(purge) }))
                    return
                end
                if not purge.check_loopback() or not purge.check_token() then
                    ngx.status = 403
                    ngx.say(cjson.encode({ error = "forbidden" }))
                    return
                end
                local ip = ngx.req.get_headers()["X-CFM-Purge-IP"] or ""
                if ip == "" then
                    ngx.status = 400
                    ngx.say(cjson.encode({ error = "missing ip" }))
                    return
                end
                ngx.status = 200
                ngx.say(cjson.encode(purge.purge_ip(ip)))
            }
        }

        # Single proxy path: cfm.lua sets $cfm_pass to challenge or origin
        location / {
            proxy_pass $cfm_pass;

            # Send correct SNI when proxying to https://origin:443
            proxy_ssl_server_name on;
            proxy_ssl_name        $host;

            proxy_http_version 1.1;
            proxy_set_header   Connection "";

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $cf_xfp;
            proxy_set_header   CF-Connecting-IP  $remote_addr;
        }
    }

    # Optional CFM panel listener blocks (12082/12083/12086/12087/12095/12096/12222).
    # HTTPS panel listeners in the included file require explicit fallback ssl_certificate/ssl_certificate_key.
    # These use cfm_panel.lua and are intended for `cfm dnat cpanel`.
    include /usr/local/openresty/nginx/conf/cfm-panel-listeners.conf;
}
