# CFM real IP — server block level for cPanel nginx (ea-nginx)
# Deploy to: /etc/nginx/conf.d/server-includes/cfm-realip.conf
#
# WHY THIS FILE EXISTS
# ─────────────────────────────────────────────────────────────────────────────
# cPanel's ea-nginx includes cloudflare.conf in every user vhost server block:
#
#   set_real_ip_from <cloudflare-ipv4-ranges>;
#   set_real_ip_from <cloudflare-ipv6-ranges>;
#   real_ip_header CF-Connecting-IP;
#
# nginx's real_ip_header at server-block level completely overrides the
# http-level real_ip_header X-Real-IP set by nginx-cfm.conf. So nginx uses
# CF-Connecting-IP from Cloudflare source IPs only — 127.0.0.1 (OpenResty
# with proxy_bind) is not in that list, so $remote_addr stays 127.0.0.1.
#
# HOW THE FIX WORKS
# ─────────────────────────────────────────────────────────────────────────────
# set_real_ip_from IS additive within the same context. Adding this file to
# server-includes/ (which every vhost server block includes) appends 127.0.0.1
# to cloudflare.conf's ranges — no ordering conflict, no cPanel config edits.
#
# openresty.conf sends "CF-Connecting-IP: $remote_addr" (OpenResty's resolved
# real client IP) instead of the raw $http_cf_connecting_ip. nginx now finds:
#   - source 127.0.0.1 → trusted (this file)
#   - header CF-Connecting-IP → contains real client IP (openresty.conf)
#   → $remote_addr = real client IP ✓
#
# SIDE EFFECT (nginx+Apache mode)
# ─────────────────────────────────────────────────────────────────────────────
# cPanel's cpanel-proxy.conf then forwards to Apache:
#   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  ← real IP
#   proxy_set_header X-Real-IP       $remote_addr;               ← real IP
# Apache's i360.remoteip.conf (RemoteIPHeader X-Forwarded-For) receives
# the correct IP automatically — no separate Apache fix needed.
#
# UPGRADE SAFETY
# ─────────────────────────────────────────────────────────────────────────────
# ea-nginx rebuilds only regenerate its own named files in server-includes/
# (e.g. cpanel-static-locations.conf). Arbitrary files like cfm-realip.conf
# are preserved through cPanel and ea-nginx package upgrades.

set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
