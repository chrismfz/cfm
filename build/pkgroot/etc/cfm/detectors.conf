[webdetector]
ENABLED      = 1
MODE         = file
LOG_PATH     = "/var/log/apache2/access_cfm_tsv.log"
; LOG_PATH = "/var/log/nginx/access_cfm_combined.log"

EVERY        = "5s"
WINDOW       = "120s"
COOLDOWN     = "10m"
SAMPLE_LIMIT = 20

# Enrichment
ENRICH       = 1
PTR          = 1
ENRICH_DIRS  = "/var/lib/cfm/maxmind"

# New
API_LISTEN   = "127.0.0.1:9070"
LONG_FACTOR  = 10
MIN_SCORE    = 0.60

IP404_COUNT = 250
IP403_COUNT = 150
AGENT_LIST  = "curl,wget,python-requests,Go-http-client,spider,FacebookExternalHit"
AGENT_COUNT = 20

BLOCK = 2h
BLOCK_COOLDOWN = 30m

# new
MALPATH_COUNT = 20
MALPATH_FILE = /etc/cfm/webdetector_malpaths.txt

IP40X_COMBO = 120
IP40X_UNIQUE_PATHS = 20
# optional:
IGNORE40X_PREFIXES = "/.well-known/,/robots.txt,/favicon.ico,/sitemap"


; ── Challenge server (standalone DNAT mode, mutually exclusive with OpenResty) ─
; Use this OR the OPENRESTY_* block below, not both.
CHALLENGE_HTTP_LISTEN  = 127.0.0.1:9098
CHALLENGE_HTTPS_LISTEN = 127.0.0.1:9099
CHALLENGE_ACCESS_LOG = /var/log/cfm/challenge.access.log

CHALLENGE_LOG=1
CHALLENGE_NOTIFY=0

; Stubborn stupid bots may abuse our challenge server. Block them in our Firewall
CHALLENGE_ABUSE_ENABLED = 1
CHALLENGE_ABUSE_WINDOW = 10s
CHALLENGE_ABUSE_BAD_N = 18
CHALLENGE_ABUSE_BLOCK_TTL = 4h
CHALLENGE_ABUSE_COOLDOWN = 30m

; ── OpenResty in-path mode ────────────────────────────────────────────────────
; When enabled, cfm pushes decisions to OpenResty via unix socket instead of
; managing per-IP nftables DNAT rules. OpenResty challenges browsers directly.
;
; Socket API endpoints (served by cfm, consumed by cfm_decisions.lua):
;
;   GET  /nginx/decision?ip=1.2.3.4&host=example.com
;        → {"ip_action":"allow|challenge|block","vhost_action":"allow|challenge"}
;
;   POST /nginx/ip          {"ip":"1.2.3.4","action":"challenge|block","ttl_sec":600}
;   POST /nginx/ip/clear    {"ip":"1.2.3.4"}
;   POST /nginx/vhost       {"host":"example.com","action":"challenge","ttl_sec":600}
;   POST /nginx/vhost/clear {"host":"example.com"}
;   GET  /nginx/status      → active IPs/vhosts + push stats (debug)
;
; All requests require header:  X-CFM-Token: <OPENRESTY_TOKEN>
;
OPENRESTY_MODE          = 1
OPENRESTY_SOCK          = /var/run/cfm_nginx.sock
OPENRESTY_TOKEN         = cfm

; Global cooldown per IP:
; If an IP was challenged recently, do NOT challenge it again until this expires.
CHALLENGE_COOLDOWN = 45m
CHALLENGE_COOKIE_LIFE  = 45m
OPENRESTY_OK_IP_TTL = 45



; ---------------------------------------------------------------------------
; WebDetector Challenge Rules
; Purpose: Send suspicious clients through the challenge page (not a hard block)
; Notes:
;   - Challenge is meant to slow down / validate bots while keeping false-positives low.
;   - Use CHALLENGE_COOLDOWN to avoid looping the same IP through repeated challenges.
; ---------------------------------------------------------------------------

; ---------------------------------------------------------------------------
; Path-based challenge (high-signal)
; If a request path matches any entry in CHALLENGE_PATHS_FILE, challenge the IP.
; Typical use: known exploit filenames, dotfiles, scanners, webshell paths, etc.
; ---------------------------------------------------------------------------

; Enable/disable path-based challenge rules (1=on, 0=off)
CHALLENGE_PATHS = 1

; File containing one path substring per line to trigger a challenge
CHALLENGE_PATHS_FILE = /etc/cfm/webdetector_challenge_paths.txt

; How many hits (within the window) are required before challenging
; Example: 1 means "first hit triggers challenge"
CHALLENGE_PATHS_COUNT = 1

; How long the IP stays in "challenge set" after being triggered (per rule TTL)
; (You can keep it small since global cooldown already prevents re-challenges)
CHALLENGE_PATHS_TTL = 10m

; ---------------------------------------------------------------------------
; Threshold-based triggers (tune carefully)
; These trigger challenge based on request rate and behavior per IP
; within the detector window (e.g. your WINDOW setting).
; Set any value to 0 to disable that trigger.
; ---------------------------------------------------------------------------

; Total request rate per IP (requests/sec) required to trigger challenge
CHALLENGE_RPS_TOTAL_MIN = 20.0
; 4xx-only request rate per IP (requests/sec), useful for probing/scanning
CHALLENGE_RPS_4XX_MIN   = 10.0
; 5xx-only request rate per IP (requests/sec), useful for exploit/stress patterns
CHALLENGE_RPS_5XX_MIN   = 0.9
; Error ratio threshold per IP (4xx+5xx divided by total requests), 0.00–1.00
; Example: 0.80 means ">=80% of requests are errors" → very bot-like
CHALLENGE_ERR_RATIO_MIN = 0.80
; POST ratio threshold per IP (POST requests divided by total), 0.00–1.00
; Useful for login brute force / spam submissions / API abuse
CHALLENGE_POST_RATIO_MIN = 0
; Challenge if the IP sends this many requests with an empty or "-" User-Agent
CHALLENGE_NO_UA_MIN      = 5
; Challenge if the IP uses HTTP/1.0 this many times (real browsers almost never do)
CHALLENGE_HTTP10_MIN     = 1



; per-IP unique paths
CHALLENGE_IP_UNIQPATHS_ENABLED = 1
CHALLENGE_IP_UNIQPATHS_MIN = 200
CHALLENGE_IP_UNIQPATHS_TTL = 20m
CHALLENGE_IP_UNIQPATHS_CAP = 512

; per-IP unique hosts
CHALLENGE_IP_UNIQHOSTS_ENABLED = 1
CHALLENGE_IP_UNIQHOSTS_MIN = 10
CHALLENGE_IP_UNIQHOSTS_TTL = 30m
CHALLENGE_IP_UNIQHOSTS_CAP = 128

; per-vhost unique paths (bridge)
CHALLENGE_VHOST_UNIQPATHS_ENABLED = 1
CHALLENGE_VHOST_UNIQPATHS_MIN = 1500
CHALLENGE_VHOST_UNIQPATHS_OFF = 900        ; optional (default 60% of MIN)
CHALLENGE_VHOST_UNIQPATHS_TTL = 20m
CHALLENGE_VHOST_UNIQPATHS_CAP = 5000       ; early-stop



; Malformed request burst (400 + 414 + 431)
CHALLENGE_MALFORMED_MIN = 15
CHALLENGE_MALFORMED_TTL = 30m

; UA churn (too many distinct User-Agents from one IP)
CHALLENGE_UNIQUA_MIN = 8
CHALLENGE_UNIQUA_TTL = 20m
CHALLENGE_UNIQUA_CAP = 64


; ---------------------------------------------------------------------------
; PER VHOST MODE
; ---------------------------------------------------------------------------
; manual panic mode
CHALLENGE_VHOST = victim.com, *.victim.com, www.nixpal.com
CHALLENGE_VHOST_IGNORE = api.mybank.gr,

; Absolute: never challenge these hosts (wins over all challenge triggers)
CHALLENGE_HOST_BYPASS = api.mybank.gr, koullaras.gr, www.koullaras.gr


; auto under-attack mode based on long-window score
CHALLENGE_SUSPICIOUS_VHOST = 1
CHALLENGE_SUSPICIOUS_VHOST_SCORE_ON  = 0.68
CHALLENGE_SUSPICIOUS_VHOST_SCORE_OFF = 0.64
CHALLENGE_SUSPICIOUS_VHOST_MIN_UNIQIP = 35
CHALLENGE_SUSPICIOUS_VHOST_HOLDDOWN = 15m

; Enable uniqIP-based auto mode
CHALLENGE_SUSPICIOUS_VHOST_UNIQIP = 1

; Hysteresis thresholds
CHALLENGE_SUSPICIOUS_VHOST_UNIQIP_ON  = 100
CHALLENGE_SUSPICIOUS_VHOST_UNIQIP_OFF = 80

; Optional hard cap (instant ON + keep ON while exceeded)
CHALLENGE_SUSPICIOUS_VHOST_UNIQIP_MAX = 150

CHALLENGE_EXCLUDE = 1
CHALLENGE_EXCLUDE_FILE = /etc/cfm/webdetector_challenge_exclude.txt

