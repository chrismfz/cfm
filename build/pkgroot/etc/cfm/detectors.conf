# =============================================================================
# MYSQL — brute-force / login detector
# =============================================================================
# Watches the MySQL/MariaDB error log for failed authentication attempts.
# Fires when the per-IP or per-user failure count exceeds a threshold within
# the rolling WINDOW.  Optionally blocks the offending IP via nft.
#
# Required MySQL grants: none — reads log file only, no DB connection needed.
#
# Supported log formats:
#   MariaDB / MySQL 5.7+ error log (text, one event per line)
#   LOG_PATH = auto   → auto-detect from /etc/my.cnf, /etc/mysql/my.cnf,
#                        /var/log/mysql/error.log, /var/lib/mysql/*.err …
# -----------------------------------------------------------------------------

[mysql]
ENABLED = 1

; How often to scan new lines appended to the error log.
EVERY   = 20s
; Sliding window over which failure counts are accumulated.
WINDOW  = 10m
; Minimum time between two alerts for the same IP (deduplication).
COOLDOWN = 20m
; Path to the MySQL/MariaDB error log.  Use "auto" to let CFM find it.
LOG_PATH = auto
; Maximum log lines included in the alert body (for context).
SAMPLE_LIMIT = 15
; ---- Thresholds ----
; Fire when a single remote IP causes >= N "Access denied" events in WINDOW.
DENIED_IP   = 8
; Fire when a single username causes >= N "Access denied" events in WINDOW
; (catches credential-stuffing across many IPs).
DENIED_USER = 8
; Tighter threshold for root login attempts — any IP that fails root auth
; >= N times is treated as high-priority.
ROOT_IP = 3
; Unauthenticated / aborted connections per IP (port-scan / banner-grab probe).
SCAN_IP = 10
; ---- Hygiene ----
; Don't alert on failures from 127.0.0.1 / localhost (internal apps, cron…).
IGNORE_LOCALHOST = 1
; Don't alert on the cPanel internal user 'Cpanel::MysqlUtils::Unprivileged'.
IGNORE_CPANEL_UTIL = 1
; ---- Block policy ----
; What to do when a threshold is crossed:
;   no        → log + notify only
;   dryrun    → log "would block" without touching nft
;   permanent → add to nft block set permanently
;   <duration> e.g. 24h, 7d → add with TTL
BLOCK = permanent
; Don't re-block the same IP more often than this (prevents log flooding).
BLOCK_COOLDOWN = 30m



# =============================================================================
# MYSQL GOVERNOR — processlist monitor & runaway-query kill engine
# =============================================================================
# Polls information_schema.PROCESSLIST every POLL_EVERY seconds.
# Detects:
#   • Runaway queries holding table locks (cascades that kill entire sites)
#   • Lock fan-out: one query blocking many others
#   • Connection pressure (approaching max_connections)
#   • Sleeping connection leaks (Magento, WordPress plugins)
#
# This section is read by the governor that was wired into the daemon in
# main.go.  At the moment the config values are hardcoded in main.go and
# this section is documentation / future wiring.  Keys marked [TODO] will
# be read automatically once the config struct gains a MySQLGovernor field.
#
# Modes:
#   monitor  → observe & log "WOULD_KILL …" but never issue KILL  ← safe default
#   enforce  → actually issue KILL QUERY / KILL CONNECTION
#
# Credentials (auto-detected in this order, no config required for standard setups):
#   1. DSN = user:pass@tcp(127.0.0.1:3306)/   ← explicit (optional)
#   2. /root/.my.cnf                           ← standard cPanel / server root file
#   3. /etc/cfm/mysql_governor.cnf             ← CFM-specific credential file
#   4. /usr/local/directadmin/conf/mysql.conf  ← DirectAdmin
#
# Required MySQL grants (create once, then forget):
#   CREATE USER 'cfm_governor'@'localhost' IDENTIFIED BY 'strongpassword';
#   GRANT PROCESS ON *.* TO 'cfm_governor'@'localhost';
#   -- MySQL 8.0+ also needs:
#   GRANT CONNECTION_ADMIN ON *.* TO 'cfm_governor'@'localhost';
#   -- MariaDB: PROCESS covers KILL; no extra grant needed.
# -----------------------------------------------------------------------------

[mysql_governor]
ENABLED = 1

; [TODO] Explicit DSN — leave empty for auto-detection (recommended).
; DSN = cfm_governor:strongpassword@tcp(127.0.0.1:3306)/

; How often to snapshot information_schema.PROCESSLIST.
; Lower = faster reaction, slightly more DB load (negligible at 5s).
POLL_EVERY = 5s

; Operating mode.
;   monitor  → safe for production day-1: logs actions without killing anything.
;              Review the GOVERNOR ACTIONS section of `cfm mysqltop` for a week,
;              then switch to enforce once you are confident in the thresholds.
;   enforce  → live kills.  Requires PROCESS + CONNECTION_ADMIN (MySQL 8) grants.
MODE = monitor

; ---- Connection pressure ----
; Alert (notify) when total connections exceed this % of @@max_connections.
CONN_WARN_PCT = 70

; Act (kill sleepers, escalate rules) when connections exceed this %.
; At this level the sleep reaper also activates (if enabled).
CONN_ACT_PCT  = 85

; ---- Lock fan-out kill ----
; If a single query is blocking >= N others AND has been running for >= TTL,
; it is treated as a blocker regardless of the per-user rules below.
; This is the "mathematica.gr cascade" rule — 207 waiters at 03:32 would have
; been killed within 30 seconds with MODE = enforce.
LOCK_FANOUT_KILL = 20
LOCK_FANOUT_TTL  = 60s

; ---- Per-user query kill rules ----
; Format (one rule per line, evaluated top-to-bottom, first match wins):
;
;   <user_pattern> : <max_runtime> : <action> [: condition]
;
;   user_pattern  exact username, prefix wildcard (*), or * for everyone
;   max_runtime   0 = ignore (never touch this user)
;   action        notify | kill_query | kill_connection
;   condition     lock_fanout=N  (only act if blocking >= N others)
;                 conn_pct=N     (only act if connection pressure >= N %)
;
; Rules are evaluated most-specific to least-specific within the list.
; Use multiple rules for the same user to build an escalation ladder:
;   first rule  → notify at 45s
;   second rule → kill  at 90s  (if also blocking others)
;   third rule  → kill  unconditionally at 2m
;
; Examples (commented out — uncomment and adjust for your tenants):
;
; Never touch internal cron users (safety):
;   *_cron : 0 : ignore
;
; Specific tenant — tight leash (known phpBB full-text-search problem):
;   user_db : 45s  : notify
;   user_db : 90s  : kill_query  : lock_fanout=5
;   other_db : 120s : kill_query
;
; Magento tenant — more lenient (Magento runs long reindex queries legitimately):
;   mydigitg_tonis : 120s : notify
;   mydigitg_tonis : 300s : kill_query
;
; Dead-man's switch for everyone else:
;   * : 300s : notify
;   * : 600s : kill_query
;
; QUERY_RULES =
;     *_cron          : 0      : ignore
;     mathemat_db     : 45s    : notify
;     mathemat_db     : 90s    : kill_query  : lock_fanout=5
;     mathemat_db     : 120s   : kill_query
;     *               : 300s   : notify
;     *               : 600s   : kill_query

; ---- Sleep reaper ----
; Kills idle sleeping connections older than SLEEP_REAPER_AGE when connection
; pressure exceeds CONN_ACT_PCT.  Fixes WordPress/Magento connection-pool leaks
; without touching wait_timeout in my.cnf (which affects all tenants).
;
; Safety: a sleeping connection is NEVER killed if it has an open InnoDB
; transaction (checked via information_schema.INNODB_TRX before any kill).
SLEEP_REAPER     = 1
SLEEP_REAPER_AGE = 180s

; Comma-separated users whose sleeping connections are never reaped.
; proxysql_monitor uses persistent connections by design; killing them causes
; ProxySQL health-check failures.
SLEEP_REAPER_EXEMPT = proxysql_monitor, root

; ---- Kill rate limits ----
; Hard cap on how many kills the governor may issue within KILL_WINDOW.
; This is the last line of defence against a misconfigured rule wiping out
; a tenant's entire connection pool.
KILL_COOLDOWN           = 3    ; max kills for one DB within KILL_WINDOW
KILL_PER_DB_PER_WINDOW  = 5    ; max kills for one DB within KILL_WINDOW
KILL_TOTAL_PER_WINDOW   = 20   ; max kills globally within KILL_WINDOW
KILL_WINDOW             = 10m




