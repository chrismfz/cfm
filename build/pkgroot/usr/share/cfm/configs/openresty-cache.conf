# /usr/local/openresty/nginx/conf/nginx.conf
#
# OpenResty in-path WAF mode (WITH CACHE) - Option A (universal, dedicated-IP safe)
#
# REQUIREMENT (IMPORTANT):
#   nftables DNAT must be PORT-ONLY (keep destination IP):
#     tcp dport 80  dnat to :9080
#     tcp dport 443 dnat to :9043
#     udp dport 443 dnat to :9043
#
# ROUTING MODEL (IMPORTANT):
#   cfm.lua sets:
#     - $cfm_pass     (actual proxy target URL)
#     - $cfm_upstream (for logging/debug only)
#
#   Examples:
#     allow (http)  -> $cfm_pass = "http://$server_addr:80"
#     allow (https) -> $cfm_pass = "https://$server_addr:443"
#     challenge     -> $cfm_pass = "http://cfm_challenge"
#     block         -> cfm.lua exits 403
#
# Origin routing:
#   - HTTP  (9080): http://$server_addr:80
#   - HTTPS (9043): https://$server_addr:443 with SNI=$host
#
# Challenge:
#   - always http://127.0.0.1:9098
#
# SSL:
#   - fallback self-signed cert
#   - per-host dynamic certs from sslcollector
#
# CACHE NOTES (IMPORTANT):
#   - Challenge traffic is NEVER cached (bypass/no_cache when $is_challenge=1).
#   - Static assets  -> cfm_static zone (5m TTL; safe conservative default).
#   - PHP scripts + admin dirs -> NO CACHE, direct passthrough, no buffering.
#     Matched by: *.php (any path) and /admin/ /sysadmin/ /administrator/ /wp-admin/
#     Reason: PHP scripts may be long-running or state-mutating (DB writes, crons).
#             proxy_cache_background_update would silently re-execute them → double runs.
#   - Everything else -> cfm_micro zone (2s TTL) BUT bypassed when any Cookie
#     is present (safe default, no extra maps needed).
#
# proxy_cache_background_update NOTE (IMPORTANT):
#   This directive is intentionally NOT set globally.
#   It is only enabled inside the static assets location blocks (css/js/images etc.)
#   where background refresh is safe because static files have no side effects.
#   Enabling it globally caused background subrequests to silently re-execute PHP
#   scripts, resulting in double DB writes on long-running cron/script requests.
#
# BEFORE FIRST START:
#   mkdir -p /var/cache/nginx/cfm_static /var/cache/nginx/cfm_micro

user root;
worker_processes 2;

error_log /usr/local/openresty/nginx/logs/error.log warn;
pid       /usr/local/openresty/nginx/logs/nginx.pid;

# Pass env vars to workers (must be set in master env before start)
env OPENRESTY_SOCK;
env OPENRESTY_TOKEN;
env CFM_DECISION_TIMEOUT_MS;
env CFM_DECISION_TTL_MS;
env CFM_POST_RESUME_ENABLE;
env CFM_POST_RESUME_MAX_LEN;
env CFM_POST_RESUME_TTL_SEC;

events { worker_connections 1024; }

http {
    lua_package_path '/usr/local/openresty/nginx/lua/?.lua;;';

    include       mime.types;
    default_type  application/octet-stream;

    lua_shared_dict cfm_decisions 64m;
    lua_shared_dict sslcache      256m;

    init_worker_by_lua_block {
        local sc = require "sslcollector"
        sc.start_background()
    }

    map $http_x_forwarded_proto $cf_xfp {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    # Restrict CFM Admin UI/API exposure to approved hostnames only.
    # Replace "orion.yourdomain.com" with your real management FQDN.
    #
    # Notes:
    # - map keys are static strings/regex (not dynamic variable expansion),
    #   so we do dynamic checks using a second map over a composed key.
    map $host $cfm_admin_allowed_static {
        default               0;
        orion.yourdomain.com  1;
    }

    # Allow CFM admin when:
    # 1) host is explicitly allowlisted above, OR
    # 2) host equals runtime $hostname, OR
    # 3) host equals runtime $server_addr (IP access).
    map "$cfm_admin_allowed_static:$host:$hostname:$server_addr" $cfm_admin_allowed {
        default                     0;
        "~^1:"                     1;
        "~^0:([^:]+):\1:"        1;
        "~^0:([^:]+):[^:]*:\1$"  1;
    }

    # DNAT mode terminates externally on :443 while nginx listens on :9043.
    # Keep redirects on canonical ports so clients never see internal :9043.
    port_in_redirect off;

    # --- Upload / buffering / timeouts ---
    client_max_body_size         2g;
    client_body_buffer_size      1m;
    client_body_timeout          300s;

    proxy_buffer_size            128k;
    proxy_buffers                32 64k;
    proxy_busy_buffers_size      256k;
    proxy_max_temp_file_size     2048m;

    large_client_header_buffers  8 64k;

    send_timeout                 300s;
    keepalive_timeout            65s;

    proxy_connect_timeout        30s;
    proxy_send_timeout           600s;
    proxy_read_timeout           600s;

    # Keep on for origin. Verify location overrides these to off.
    proxy_request_buffering      on;
    proxy_buffering              on;

    # --- Real IP (Cloudflare) ---
    # After this:
    #   $remote_addr        = real visitor IP
    #   $realip_remote_addr = Cloudflare edge IP (original peer)
    real_ip_header    CF-Connecting-IP;
    real_ip_recursive on;
    include /usr/local/openresty/nginx/conf/trusted_proxies.conf;

    # --- Logging ---
    log_format cfm_meta_throttle
      'ts="$time_local" msec=$msec '
      'client=$remote_addr peer=$realip_remote_addr host=$host '
      'method=$request_method uri="$request_uri" status=$status '
      'reason=meta_throttle_429 limit_req_status=$limit_req_status '
      'ua="$http_user_agent" req_time=$request_time';

    log_format cfm
      'ts="$time_local" msec=$msec '
      'client=$remote_addr peer=$realip_remote_addr cf="$http_cf_connecting_ip" '
      'host=$host method=$request_method uri=$request_uri status=$status '
      'rt=$request_time urt="$upstream_response_time" '
      'ust=$upstream_status uaddr=$upstream_addr uloc="$upstream_http_location" '
      'sch=$scheme xfp_in="$http_x_forwarded_proto" xfp_out="$cf_xfp" '
      'up=$cfm_upstream pass=$cfm_pass dst=$server_addr:$server_port ua="$http_user_agent" ';








log_format cfm_429_debug
  'ts="$time_local" msec=$msec '
  'client=$remote_addr peer=$realip_remote_addr host=$host '
  'method=$request_method uri="$request_uri" status=$status '
  'limit_req_status=$limit_req_status '
  'upstream_status=$upstream_status upstream_addr=$upstream_addr '
  'cfm_upstream=$cfm_upstream cfm_pass=$cfm_pass '
  'ua="$http_user_agent"';

map $status $log_429_debug {
    default 0;
    429 1;
}

access_log /usr/local/openresty/nginx/logs/429-debug.log cfm_429_debug if=$log_429_debug;











    # 1) detect challenge routing via cfm_pass
    map $cfm_pass $is_challenge {
        default           0;
        "~*cfm_challenge" 1;
    }

    # 2) log if upstream says challenge OR pass says challenge OR uri is verify
    map "$cfm_upstream|$is_challenge|$uri" $log_cfm {
        default                   0;
        "~^cfm_challenge\|"       1;  # normal path
        "~\|1\|"                  1;  # fallback: pass contains cfm_challenge
        "~\|/__cfm_verify$"       1;  # verify endpoint
        "~^cfm_block\|"           1;  # blocks (if you ever set it)
    }

    # Meta crawlers are useful for link previews/ads, but can generate very
    # high-cardinality query traffic that bypasses microcache and overloads
    # PHP/MySQL. We apply soft per-vhost throttles only to these UAs.
map $http_user_agent $is_meta_crawler {
    default 0;

    # Explicit pass-through for in-app browsers FIRST
    # (these are real users clicking FB/IG ads — never throttle)
    "~*FB_IAB"        0;
    "~*FBAV"          0;
    "~*Instagram"     0;
    "~*IABMV"         0;

    # Existing social / preview bots
    "~*meta-externalagent" 1;
    "~*facebookexternalhit" 1;
    "~*facebookcatalog" 1;

    # Existing SEO / crawler bots
    "~*dotbot" 1;
    "~*mj12bot" 1;
    "~*semrushbot" 1;
    "~*barkrowler" 1;

    # Amazon
    "~*amazonbot" 1;

    # Other safe-but-chatty crawlers worth throttling
    "~*ahrefsbot" 1;


}


    # Optional per-vhost exemptions from Meta throttling.
    # Examples below keep nixpal hosts fully exempt from bot throttles.
    map $host $meta_throttle_exempt_host {
        default 0;
        nixpal.com 1;
        www.nixpal.com 1;
        "~*\.nixpal\.com$" 1;
        "~*\.blancdeblanc\.gr$" 1;
        blancdeblanc.gr 1;
        www.blancdeblanc.gr 1;

    }

    # Throttle only when request is Meta crawler AND host is not exempt.
    map "$is_meta_crawler|$meta_throttle_exempt_host" $is_meta_crawler_throttled {
        default    0;
        "~^1\|0$" 1;
    }

    # Empty keys are ignored by limit_req/limit_conn, so only throttled-meta traffic is
    # rate-limited; normal visitors, other bots, and exempt hosts are unaffected.
    map "$host|$is_meta_crawler_throttled" $meta_host_limit_key {
        default "";
        "~^([^|]+)\|1$" "$1";
    }

    map "$host|$binary_remote_addr|$is_meta_crawler_throttled" $meta_host_ip_limit_key {
        default "";
        "~^([^|]+)\|(.+)\|1$" "$1|$2";
    }

    # Separate log switch for throttled Meta crawler requests.
        map "$is_meta_crawler_throttled|$status|$limit_req_status" $log_meta_throttle {
            default 0;
            "~^1\|429\|REJECTED$" 1;
            "~^1\|429\|DELAYED$"  1;
        }

    # Focused log (challenge/block traffic only)
    access_log /usr/local/openresty/nginx/logs/access.cfm.log cfm if=$log_cfm;

    # Dedicated throttle log for Meta crawler requests rejected by limits.
    access_log /usr/local/openresty/nginx/logs/throttle.log cfm_meta_throttle if=$log_meta_throttle;

    # Full access log (disable when not needed)
    access_log /usr/local/openresty/nginx/logs/access.log cfm;

    # --- Challenge upstream ---
    upstream cfm_challenge {
        server 127.0.0.1:9098;
        keepalive 8;
    }

    # -------------------------------------------------------------------------
    # CACHE ZONES
    # -------------------------------------------------------------------------
    # NOTE: cache keys include scheme+host+uri so vhosts won't cross-pollute.

    proxy_cache_path /var/cache/nginx/cfm_static
        levels=1:2
        keys_zone=cfm_static:200m
        max_size=10g
        inactive=24h
        use_temp_path=off;

    proxy_cache_path /var/cache/nginx/cfm_micro
        levels=1:2
        keys_zone=cfm_micro:200m
        max_size=10g
        inactive=60m
        use_temp_path=off;

    # Soft throttles for Meta crawler traffic.
    # - per vhost: protect each site from swarm spikes
    # - per vhost+IP: stop a single crawler worker from flooding
    limit_req_zone  $meta_host_limit_key    zone=meta_host_rps:20m    rate=2r/s;
    limit_req_zone  $meta_host_ip_limit_key zone=meta_host_ip_rps:40m rate=60r/m;
    limit_conn_zone $meta_host_limit_key    zone=meta_host_conn:20m;

    # Use a uniform status code for throttling so we can track it cleanly.
    limit_req_status  429;
    limit_conn_status 429;

    # Global cache behaviour — safe for all zones.
    # NOTE: proxy_cache_background_update is intentionally ABSENT here.
    #       It is only set inside the static assets location blocks below.
    proxy_cache_lock         on;
    proxy_cache_lock_timeout 5s;
    proxy_cache_revalidate   on;

    # ---------------------------------------------------------------------
    # HTTP listener (DNAT 80 -> 9080)
    # ---------------------------------------------------------------------
    server {
        listen 9080;
        server_name _;

        # Applied to all locations in this server; effective only when the
        # computed key is non-empty (Meta crawler UAs).
        limit_req  zone=meta_host_rps burst=40 nodelay;
        limit_req  zone=meta_host_ip_rps burst=30 nodelay;
        limit_conn meta_host_conn 30;

        # cfm.lua will set these per-request
        set $cfm_pass     "";
        set $cfm_upstream "cfm_apache";
        access_by_lua_file /usr/local/openresty/nginx/lua/cfm.lua;

        # ------------------------------------------------------------------
        # Verify endpoint: bypass Lua and ensure correct client identity
        # ------------------------------------------------------------------
        location = /__cfm_verify {
            access_by_lua_block { return; }

            proxy_pass         http://cfm_challenge;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";

            proxy_set_header   Host              $host;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   CF-Connecting-IP  $http_cf_connecting_ip;

            proxy_request_buffering off;
            proxy_buffering         off;

            # Never cache/store verify responses anywhere
            add_header Cache-Control "no-store" always;
        }

        # Debug endpoint for sslcollector dict
        location = /__ssl_debug {
            allow 127.0.0.1;
            deny all;
            content_by_lua_block {
                local d = ngx.shared.sslcache
                ngx.say("ready=",   d:get("meta:ready")   or "0")
                ngx.say("version=", d:get("meta:version") or "-")
            }
        }

        # ------------------------------------------------------------------
        # STATIC CACHE (assets)
        # Higher specificity than the no-cache block → matched first for assets.
        # proxy_cache_background_update is SAFE here: static files have no
        # side effects, background refresh just silently fetches a new copy.
        # ------------------------------------------------------------------
        location ~* \.(?:css|js|mjs|map|png|jpg|jpeg|gif|svg|ico|webp|avif|woff|woff2|ttf|eot|mp4)$ {
            proxy_pass         $cfm_pass;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $cf_xfp;
            proxy_set_header   CF-Connecting-IP  $http_cf_connecting_ip;

            # Never cache challenge traffic
            proxy_cache_bypass $is_challenge;
            proxy_no_cache     $is_challenge;

            proxy_cache        cfm_static;
            proxy_cache_key    "$scheme|$host|$request_uri";

            proxy_cache_valid  200  5m;
            proxy_cache_valid  404  1m;
            proxy_cache_background_update  on;

            # Safe for static: serve stale + silently refresh in background.
            proxy_cache_use_stale          updating;
            proxy_cache_lock_age     10s;

            # Ignore/strip Set-Cookie on assets so they can be cached
            proxy_ignore_headers Set-Cookie;
            proxy_hide_header    Set-Cookie;

            add_header X-CFM-Cache $upstream_cache_status always;
        }

        # ------------------------------------------------------------------
        # NO-CACHE PASSTHROUGH: PHP scripts + admin directories
        #
        # Matches (case-insensitive):
        #   *.php            → any PHP file anywhere (crons, scripts, APIs…)
        #   /admin/*         → generic admin panel
        #   /sysadmin/*      → system admin area
        #   /administrator/* → Joomla-style admin
        #   /wp-admin/*      → WordPress admin
        #
        # WHY before location /:
        #   Nginx picks the most specific matching location. A regex location
        #   listed before another regex is tried first, so this block wins
        #   over the microcache location / for these paths.
        #
        # WHY no buffering:
        #   Long-running scripts stream output progressively. Buffering would
        #   hold the entire response in memory before forwarding, causing
        #   apparent hangs and inflating nginx memory usage.
        # ------------------------------------------------------------------
        location ~* ^(?:/(?:admin|sysadmin|administrator|wp-admin)/|.*\.php(?:\?|$)) {
            proxy_pass         $cfm_pass;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $cf_xfp;
            proxy_set_header   CF-Connecting-IP  $http_cf_connecting_ip;

            # Absolute cache kill — no zone, no background updates, no stale serve
            proxy_cache        off;
            proxy_cache_bypass 1;
            proxy_no_cache     1;

            # Do not buffer — let long-running scripts stream directly to client
            proxy_request_buffering off;
            proxy_buffering         off;

            # Long timeout for heavy scripts (crons, importers, etc.)
            proxy_read_timeout 600s;

            add_header X-CFM-Cache "BYPASS" always;
        }

        # ------------------------------------------------------------------
        # cPanel Dynamic DNS — bypass cfm, proxy direct to cpsrvd :2082
        # Mirrors cpanel-proxy.conf headers exactly so cpsrvd sees the real
        # client IP in X-Real-IP / X-Forwarded-For, not 127.0.0.1.
        # $remote_addr is already the resolved real client IP here.
        # ------------------------------------------------------------------
        location /cpanelwebcall {
            access_by_lua_block { return; }

            proxy_pass http://127.0.0.1:2082/cpanelwebcall;

            proxy_hide_header Upgrade;
            proxy_set_header  Accept-Encoding    "";
            proxy_set_header  Connection         "";
            proxy_set_header  Host               $host;
            proxy_set_header  Proxy              "";
            proxy_set_header  Referer            $http_referer;

            proxy_set_header  X-Real-IP          $remote_addr;
            proxy_set_header  X-Forwarded-For    $remote_addr;
            proxy_set_header  X-Forwarded-Host   $host;
            proxy_set_header  X-Forwarded-Port   $server_port;
            proxy_set_header  X-Forwarded-Proto  $scheme;
            proxy_set_header  X-Forwarded-Server $host;
            proxy_set_header  CF-Connecting-IP   $http_cf_connecting_ip;
            proxy_set_header  CF-Visitor         $http_cf_visitor;

            proxy_connect_timeout 300s;
            proxy_read_timeout    300s;
            proxy_send_timeout    300s;

            proxy_cache        off;
            proxy_cache_bypass 1;
            proxy_no_cache     1;
        }

        # ------------------------------------------------------------------
        # CFM Admin UI (webtop MVP) + API proxy
        # ------------------------------------------------------------------
        location = /cfm-admin {
            if ($cfm_admin_allowed = 0) { return 404; }
            access_by_lua_block { return; }
            return 301 /cfm-admin/;
        }

        location = /cfm-admin/webdetector {
            if ($cfm_admin_allowed = 0) { return 404; }
            access_by_lua_block { return; }

            auth_basic           "CFM Admin";
            auth_basic_user_file /etc/cfm/cfm-admin.htpasswd;

            return 301 /cfm-admin/webdetector/;
        }

        location = /cfm-admin/governor {
            if ($cfm_admin_allowed = 0) { return 404; }
            access_by_lua_block { return; }

            auth_basic           "CFM Admin";
            auth_basic_user_file /etc/cfm/cfm-admin.htpasswd;

            return 301 /cfm-admin/governor/;
        }

        # CFM Nginx/Lua introspection — served directly by nginx,
        # no Go backend involved. Exact-match (=) beats ^~ /cfm-admin/api/.
        location = /cfm-admin/lua-stats {
            if ($cfm_admin_allowed = 0) { return 404; }
            access_by_lua_block { return; }

            auth_basic           "CFM Admin";
            auth_basic_user_file /etc/cfm/cfm-admin.htpasswd;

            add_header Cache-Control "no-store" always;
            add_header Content-Type  "application/json; charset=utf-8" always;
            proxy_cache        off;
            proxy_cache_bypass 1;
            proxy_no_cache     1;

            content_by_lua_block {
                local ok, stats = pcall(require, "cfm_stats")
                local cjson = require "cjson.safe"
                if not ok then
                    ngx.status = 500
                    ngx.say(cjson.encode({ error = tostring(stats) }))
                    return
                end
                ngx.status = 200
                ngx.say(cjson.encode(stats.stats()))
            }
        }

        location ^~ /cfm-admin/api/ {
            if ($cfm_admin_allowed = 0) { return 404; }
            access_by_lua_block { return; }

            auth_basic           "CFM Admin";
            auth_basic_user_file /etc/cfm/cfm-admin.htpasswd;

            proxy_pass http://127.0.0.1:6060/api/;

            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_cache        off;
            proxy_cache_bypass 1;
            proxy_no_cache     1;

            add_header Cache-Control "no-store" always;
            add_header X-CFM-Cache "BYPASS" always;
        }

        location = /cfm-admin/ {
            if ($cfm_admin_allowed = 0) { return 404; }
            access_by_lua_block { return; }

            auth_basic           "CFM Admin";
            auth_basic_user_file /etc/cfm/cfm-admin.htpasswd;

            root /usr/share/cfm/html;
            try_files /index.html =404;

            add_header Cache-Control "no-store" always;
            add_header X-CFM-Cache "BYPASS" always;
        }

        location ^~ /cfm-admin/ {
            if ($cfm_admin_allowed = 0) { return 404; }
            access_by_lua_block { return; }

            auth_basic           "CFM Admin";
            auth_basic_user_file /etc/cfm/cfm-admin.htpasswd;

            rewrite ^/cfm-admin/(.*)$ /$1 break;
            root /usr/share/cfm/html;
            try_files $uri $uri/index.html /index.html;

            add_header Cache-Control "no-store" always;
            add_header X-CFM-Cache "BYPASS" always;
        }

        location ^~ /cfm-admin/assets/ {
            if ($cfm_admin_allowed = 0) { return 404; }
            access_by_lua_block { return; }

            auth_basic           "CFM Admin";
            auth_basic_user_file /etc/cfm/cfm-admin.htpasswd;

            rewrite ^/cfm-admin/assets/(.*)$ /$1 break;
            root /usr/share/cfm/html/assets;
            try_files $uri =404;

            add_header Cache-Control "no-store" always;
            add_header X-CFM-Cache "BYPASS" always;
        }

        # ------------------------------------------------------------------
        # MICROCACHE (everything else)
        # proxy_cache_background_update intentionally OFF — see notes above.
        # ------------------------------------------------------------------
        location / {
            proxy_pass $cfm_pass;

            proxy_http_version 1.1;
            proxy_set_header   Connection "";

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $cf_xfp;
            proxy_set_header   CF-Connecting-IP  $http_cf_connecting_ip;

            # Never cache challenge traffic; cookie traffic also bypasses cache.
            # Both variables are evaluated together (any non-empty/non-zero => bypass).
            proxy_cache_bypass $is_challenge $http_cookie;
            proxy_no_cache     $is_challenge $http_cookie;

            proxy_cache        cfm_micro;
            proxy_cache_key    "$scheme|$host|$request_uri";

            proxy_cache_valid  200 2s;
            proxy_cache_valid  404 1s;

            # Serve stale on upstream errors/timeouts — but NO background update.
            proxy_cache_use_stale updating;

            add_header X-CFM-Cache $upstream_cache_status always;
        }
    }

    # ---------------------------------------------------------------------
    # HTTPS listener (DNAT 443 -> 9043)
    # ---------------------------------------------------------------------
    server {
        listen 9043 ssl;             # TCP
        http2 on;

        listen 9043 quic reuseport;  # UDP QUIC
        http3 on;

        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Alt-Svc 'h3=":443"; ma=86400' always;

        server_name _;

        # Applied to all locations in this server; effective only for Meta
        # crawler requests due to empty-key maps above.
        limit_req  zone=meta_host_rps burst=40 nodelay;
        limit_req  zone=meta_host_ip_rps burst=30 nodelay;
        limit_conn meta_host_conn 30;

        # Fallback cert (used if sslcollector has not loaded yet)
        ssl_certificate     /usr/local/openresty/nginx/conf/selfsigned/fullchain.pem;
        ssl_certificate_key /usr/local/openresty/nginx/conf/selfsigned/privkey.pem;

        # Dynamic per-host certs from sslcollector
        ssl_certificate_by_lua_block {
            local sc = require "sslcollector"
            sc.set_cert()
        }

        # cfm.lua will set these per-request
        set $cfm_pass     "";
        set $cfm_upstream "cfm_apache";
        access_by_lua_file /usr/local/openresty/nginx/lua/cfm.lua;

        # Verify endpoint: bypass Lua and ensure correct client identity
        location = /__cfm_verify {
            access_by_lua_block { return; }

            proxy_pass         http://cfm_challenge;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";

            proxy_set_header   Host              $host;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   CF-Connecting-IP  $http_cf_connecting_ip;

            proxy_request_buffering off;
            proxy_buffering         off;

            add_header Cache-Control "no-store" always;
        }

        # Debug endpoint for sslcollector dict
        location = /__ssl_debug {
            allow 127.0.0.1;
            deny all;
            content_by_lua_block {
                local d = ngx.shared.sslcache
                ngx.say("ready=",   d:get("meta:ready")   or "0")
                ngx.say("version=", d:get("meta:version") or "-")
            }
        }

        # ------------------------------------------------------------------
        # STATIC CACHE (assets)
        # See HTTP block above for full explanation.
        # ------------------------------------------------------------------
        location ~* \.(?:css|js|mjs|map|png|jpg|jpeg|gif|svg|ico|webp|avif|woff|woff2|ttf|eot|mp4)$ {
            proxy_pass $cfm_pass;

            # Send correct SNI when proxying to https://origin:443
            proxy_ssl_server_name on;
            proxy_ssl_name        $host;

            proxy_http_version 1.1;
            proxy_set_header   Connection "";

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $cf_xfp;
            proxy_set_header   CF-Connecting-IP  $http_cf_connecting_ip;

            # Never cache challenge traffic
            proxy_cache_bypass $is_challenge;
            proxy_no_cache     $is_challenge;

            proxy_cache        cfm_static;
            proxy_cache_key    "$scheme|$host|$request_uri";

            proxy_cache_valid  200   5m;
            proxy_cache_valid  404   1m;
            proxy_cache_lock_age     10s;

            # Safe for static: serve stale + silently refresh in background.
            proxy_cache_use_stale          updating;
            proxy_cache_background_update  on;

            # Ignore/strip Set-Cookie on assets so they can be cached
            proxy_ignore_headers Set-Cookie;
            proxy_hide_header    Set-Cookie;

            add_header X-CFM-Cache $upstream_cache_status always;
        }

        # ------------------------------------------------------------------
        # NO-CACHE PASSTHROUGH: PHP scripts + admin directories
        # See HTTP block above for full explanation.
        # ------------------------------------------------------------------
        location ~* ^(?:/(?:admin|sysadmin|administrator|wp-admin)/|.*\.php(?:\?|$)) {
            proxy_pass $cfm_pass;

            # Send correct SNI when proxying to https://origin:443
            proxy_ssl_server_name on;
            proxy_ssl_name        $host;

            proxy_http_version 1.1;
            proxy_set_header   Connection "";

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $cf_xfp;
            proxy_set_header   CF-Connecting-IP  $http_cf_connecting_ip;

            proxy_cache        off;
            proxy_cache_bypass 1;
            proxy_no_cache     1;

            # Do not buffer — let long-running scripts stream directly to client
            proxy_request_buffering off;
            proxy_buffering         off;

            # Long timeout for heavy scripts
            proxy_read_timeout 600s;

            add_header X-CFM-Cache "BYPASS" always;
        }

        # ------------------------------------------------------------------
        # cPanel Dynamic DNS — bypass cfm, proxy direct to cpsrvd :2082
        # See HTTP block above for full explanation.
        # ------------------------------------------------------------------
        location /cpanelwebcall {
            access_by_lua_block { return; }

            proxy_pass http://127.0.0.1:2082/cpanelwebcall;

            proxy_hide_header Upgrade;
            proxy_set_header  Accept-Encoding    "";
            proxy_set_header  Connection         "";
            proxy_set_header  Host               $host;
            proxy_set_header  Proxy              "";
            proxy_set_header  Referer            $http_referer;

            proxy_set_header  X-Real-IP          $remote_addr;
            proxy_set_header  X-Forwarded-For    $remote_addr;
            proxy_set_header  X-Forwarded-Host   $host;
            proxy_set_header  X-Forwarded-Port   $server_port;
            proxy_set_header  X-Forwarded-Proto  $scheme;
            proxy_set_header  X-Forwarded-Server $host;
            proxy_set_header  CF-Connecting-IP   $http_cf_connecting_ip;
            proxy_set_header  CF-Visitor         $http_cf_visitor;

            proxy_connect_timeout 300s;
            proxy_read_timeout    300s;
            proxy_send_timeout    300s;

            proxy_cache        off;
            proxy_cache_bypass 1;
            proxy_no_cache     1;
        }

        # ------------------------------------------------------------------
        # CFM Admin UI (webtop MVP) + API proxy
        # ------------------------------------------------------------------
        location = /cfm-admin {
            if ($cfm_admin_allowed = 0) { return 404; }
            access_by_lua_block { return; }
            return 301 /cfm-admin/;
        }

        location = /cfm-admin/webdetector {
            if ($cfm_admin_allowed = 0) { return 404; }
            access_by_lua_block { return; }

            auth_basic           "CFM Admin";
            auth_basic_user_file /etc/cfm/cfm-admin.htpasswd;

            return 301 /cfm-admin/webdetector/;
        }

        location = /cfm-admin/governor {
            if ($cfm_admin_allowed = 0) { return 404; }
            access_by_lua_block { return; }

            auth_basic           "CFM Admin";
            auth_basic_user_file /etc/cfm/cfm-admin.htpasswd;

            return 301 /cfm-admin/governor/;
        }

        # CFM Nginx/Lua introspection — served directly by nginx,
        # no Go backend involved. Exact-match (=) beats ^~ /cfm-admin/api/.
        location = /cfm-admin/lua-stats {
            if ($cfm_admin_allowed = 0) { return 404; }
            access_by_lua_block { return; }

            auth_basic           "CFM Admin";
            auth_basic_user_file /etc/cfm/cfm-admin.htpasswd;

            add_header Cache-Control "no-store" always;
            add_header Content-Type  "application/json; charset=utf-8" always;
            proxy_cache        off;
            proxy_cache_bypass 1;
            proxy_no_cache     1;

            content_by_lua_block {
                local ok, stats = pcall(require, "cfm_stats")
                local cjson = require "cjson.safe"
                if not ok then
                    ngx.status = 500
                    ngx.say(cjson.encode({ error = tostring(stats) }))
                    return
                end
                ngx.status = 200
                ngx.say(cjson.encode(stats.stats()))
            }
        }

        location ^~ /cfm-admin/api/ {
            if ($cfm_admin_allowed = 0) { return 404; }
            access_by_lua_block { return; }

            auth_basic           "CFM Admin";
            auth_basic_user_file /etc/cfm/cfm-admin.htpasswd;

            proxy_pass http://127.0.0.1:6060/api/;

            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_cache        off;
            proxy_cache_bypass 1;
            proxy_no_cache     1;

            add_header Cache-Control "no-store" always;
            add_header X-CFM-Cache "BYPASS" always;
        }

        location = /cfm-admin/ {
            if ($cfm_admin_allowed = 0) { return 404; }
            access_by_lua_block { return; }

            auth_basic           "CFM Admin";
            auth_basic_user_file /etc/cfm/cfm-admin.htpasswd;

            root /usr/share/cfm/html;
            try_files /index.html =404;

            add_header Cache-Control "no-store" always;
            add_header X-CFM-Cache "BYPASS" always;
        }

        location ^~ /cfm-admin/ {
            if ($cfm_admin_allowed = 0) { return 404; }
            access_by_lua_block { return; }

            auth_basic           "CFM Admin";
            auth_basic_user_file /etc/cfm/cfm-admin.htpasswd;

            rewrite ^/cfm-admin/(.*)$ /$1 break;
            root /usr/share/cfm/html;
            try_files $uri $uri/index.html /index.html;

            add_header Cache-Control "no-store" always;
            add_header X-CFM-Cache "BYPASS" always;
        }

        location ^~ /cfm-admin/assets/ {
            if ($cfm_admin_allowed = 0) { return 404; }
            access_by_lua_block { return; }

            auth_basic           "CFM Admin";
            auth_basic_user_file /etc/cfm/cfm-admin.htpasswd;

            rewrite ^/cfm-admin/assets/(.*)$ /$1 break;
            root /usr/share/cfm/html/assets;
            try_files $uri =404;

            add_header Cache-Control "no-store" always;
            add_header X-CFM-Cache "BYPASS" always;
        }

        # ------------------------------------------------------------------
        # MICROCACHE (everything else)
        # proxy_cache_background_update intentionally OFF — see HTTP block.
        # ------------------------------------------------------------------
        location / {
            proxy_pass $cfm_pass;

            # Send correct SNI when proxying to https://origin:443
            proxy_ssl_server_name on;
            proxy_ssl_name        $host;

            proxy_http_version 1.1;
            proxy_set_header   Connection "";

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $cf_xfp;
            proxy_set_header   CF-Connecting-IP  $http_cf_connecting_ip;

            # Never cache challenge traffic; cookie traffic also bypasses cache.
            # Both variables are evaluated together (any non-empty/non-zero => bypass).
            proxy_cache_bypass $is_challenge $http_cookie;
            proxy_no_cache     $is_challenge $http_cookie;

            proxy_cache        cfm_micro;
            proxy_cache_key    "$scheme|$host|$request_uri";

            proxy_cache_valid  200 2s;
            proxy_cache_valid  404 1s;

            # Serve stale on upstream errors/timeouts — but NO background update.
            proxy_cache_use_stale updating;

            add_header X-CFM-Cache $upstream_cache_status always;
        }
    }
}

