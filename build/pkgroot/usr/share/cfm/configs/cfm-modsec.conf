# /etc/modsecurity.d/cfm-modsec.conf

# 1) We want access to the request body (needed for uploads)
SecRequestBodyAccess On

# 2) Where ModSecurity stores temporary data and upload files
SecTmpDir /tmp
SecUploadDir /tmp
SecUploadKeepFiles RelevantOnly

# 3) Only bother for POST/PUT requests
SecRule REQUEST_METHOD "^(POST|PUT)$" \
    "id:950000,phase:1,pass,nolog,ctl:requestBodyAccess=On"

# 4) When there is a tmp file for an upload, call our CFM wrapper
SecRule FILES_TMPNAMES "@inspectFile /usr/bin/cfm-scan.sh" \
    "id:950010,phase:2,pass,log,t:none, \
     setenv:CFM_REMOTE_ADDR=%{REMOTE_ADDR}, \
     setenv:CFM_XFF=%{REQUEST_HEADERS:X-Forwarded-For}, \
     setenv:CFM_REQUEST_URI=%{REQUEST_URI}, \
     setenv:CFM_REQUEST_METHOD=%{REQUEST_METHOD}, \
     setenv:CFM_HOST=%{REQUEST_HEADERS.Host}, \
     setenv:CFM_USER_AGENT=%{REQUEST_HEADERS.User-Agent}, \
     setenv:CFM_REFERER=%{REQUEST_HEADERS.Referer}, \
     setenv:CFM_UNIQUE_ID=%{UNIQUE_ID}, \
     setenv:CFM_FILENAME=%{FILES_NAMES}, \
     setenv:CFM_FILESIZE=%{FILES_SIZES}, \
     setenv:CFM_SCRIPT_PATH=%{SCRIPT_FILENAME}, \
     setenv:CFM_CONTENT_TYPE=%{REQUEST_HEADERS:Content-Type}"
