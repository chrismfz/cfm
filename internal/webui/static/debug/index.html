<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CFM Debug Console</title>
  <link rel="stylesheet" href="/cfm-admin/assets/style.css" />
  <script>document.documentElement.dataset.theme=(function(){try{return localStorage.getItem("cfm-theme")||"dark"}catch(e){return"dark"}})();</script>
  <script type="module" src="/cfm-admin/assets/shared/nav.js"></script>
  <script src="/cfm-admin/assets/vendor/echarts-5.6.0.min.js"></script>
  <script type="module" src="/cfm-admin/assets/debug.js"></script>
</head>
<body>
<div class="shell">
<aside class="sidebar" data-shared-nav></aside>
<div class="main">
<div class="landing-shell">
    <header class="topbar">
      <button class="nav-burger" type="button" data-nav-burger aria-label="Toggle navigation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <h1>CFM Admin</h1>
      <div class="meta">
        <button id="refreshBtn" class="btn-quiet">Refresh now</button>
        <label for="durationSec" class="muted">Capture</label>
        <select id="durationSec" class="input input-small">
          <option value="20">20s</option>
          <option value="30">30s</option>
          <option value="60">60s</option>
        </select>
        <button id="startCaptureBtn" class="btn-quiet">Start capture</button>
        <input id="captureID" class="input" type="text" placeholder="capture id" />
        <button id="loadCaptureBtn" class="btn-quiet">Load</button>
        <button id="exportJSONBtn" class="btn-quiet">Export JSON</button>
        <button id="exportTextBtn" class="btn-quiet">Export text</button>
      </div>
    </header>
    <p id="captureMsg" class="statusline"></p>

    <main class="layout">
      <section class="card wide">
        <h2>Live telemetry snapshot</h2>
        <div id="liveKpiCards" class="chips"></div>
        <h3>Live detector table</h3>
        <div id="liveDetectorTable" class="table-wrap">Loading...</div>
        <details class="raw-json">
          <summary>Raw JSON (for regression/debug)</summary>
          <pre id="livePayload">Loading...</pre>
        </details>
      </section>

      <section class="card wide">
        <h2>Capture status</h2>
        <div id="captureKpiCards" class="chips"></div>
        <div id="captureSummary" class="summary-grid"></div>
        <div class="toolbar wrap">
          <input id="detectorFilterInput" class="input input-wide" type="text" placeholder="filter detector name" />
          <label class="toolbar-toggle">
            <input id="nonZeroOnlyToggle" type="checkbox" />
            show non-zero failures/timeouts only
          </label>
          <label for="topNSelect">Top-N by avg latency</label>
          <select id="topNSelect" class="input">
            <option value="0">All</option>
            <option value="5">Top 5</option>
            <option value="10">Top 10</option>
            <option value="20">Top 20</option>
          </select>
        </div>
        <div class="toolbar">
          <label for="captureDetectorSelect">Detector</label>
          <select id="captureDetectorSelect" class="input input-wide"></select>
        </div>
        <div class="live-chart-grid">
          <div id="captureAvgMsChart" class="spark echart-box"></div>
          <div id="captureRunsChart" class="spark echart-box"></div>
          <div id="captureWebdetectorChart" class="spark echart-box"></div>
        </div>
        <h3>Capture snapshot detector table</h3>
        <div id="captureDetectorTable" class="table-wrap">No capture loaded.</div>
        <details class="raw-json">
          <summary>Raw JSON (for regression/debug)</summary>
          <pre id="capturePayload">No capture loaded.</pre>
        </details>
      </section>
    </main>
  </div>
</div><!-- /.main -->
</div><!-- /.shell -->
</body>
</html>
