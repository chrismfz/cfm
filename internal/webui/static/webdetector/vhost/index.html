<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CFM — Vhost</title>
  <link rel="stylesheet" href="/cfm-admin/assets/style.css" />
  <style>
    /* Vhost page profile tabs (feature-vhost-profile.js). */
    .vp-dom { display: flex; flex-wrap: wrap; gap: .75rem; align-items: flex-start; justify-content: space-between; }
    .vp-host { margin: 0; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 1.2rem; word-break: break-all; }
    .vp-sub { margin: .2rem 0 .4rem; }
    .vp-posture { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: .6rem; margin-top: .6rem; }
    .vp-tile { border: 1px solid var(--border-soft); border-radius: 10px; background: var(--bg-inset); padding: .65rem .7rem; display: flex; flex-direction: column; gap: .35rem; min-width: 0; }
    .vp-tile.inherit { border-style: dashed; border-color: var(--border); }
    .vp-k { font-size: .7rem; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
    .vp-v { display: flex; flex-wrap: wrap; gap: .25rem; }
    .vp-v .pill { margin-right: 0; }
    .vp-why { font-size: .78rem; color: var(--muted); line-height: 1.4; }
    .vp-edit { margin-top: auto; font-size: .78rem; }
    .vp-note { font-size: .76rem; margin: .6rem 0 0; }
    .vp-tabs { display: flex; gap: .25rem; padding: .35rem; overflow-x: auto; }
    .vp-tab { background: transparent; color: var(--muted); border: 1px solid transparent; font-weight: 600; white-space: nowrap; }
    .vp-tab:hover { color: var(--fg); filter: none; }
    .vp-tab.on { color: var(--accent-strong); border-color: var(--accent); background: var(--accent-soft); }
    .vp-tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .6rem; margin-bottom: .8rem; }
    .vp-big { font-size: 1.25rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .vp-bar-row { display: grid; grid-template-columns: 7rem minmax(0, 1fr); gap: .6rem; align-items: center; margin: .35rem 0; font-size: .8rem; }
    .vp-bar { display: flex; height: 20px; border-radius: 6px; overflow: hidden; background: var(--border-soft); gap: 2px; }
    .vp-bar span { display: block; height: 100%; flex-grow: 0; flex-shrink: 0; }
    .vp-legend { display: flex; flex-wrap: wrap; gap: .8rem; font-size: .76rem; color: var(--muted); margin-top: .5rem; }
    .vp-legend i, .vp-cls i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: .3rem; vertical-align: -1px; }
    .vp-cls { white-space: nowrap; }
    .vp-r { text-align: right; font-variant-numeric: tabular-nums; }
    .vp-client { max-width: 34ch; word-break: break-all; }
    .vp-minibar-cell { min-width: 120px; }
    .vp-minibar-cell .muted { font-size: .74rem; }
    .vp-minibar { height: 6px; border-radius: 3px; background: var(--accent); opacity: .8; }
    .vp-series { width: 100%; overflow: hidden; }
    .vp-series svg { display: block; max-width: 100%; height: auto; }
    .vp-series text { fill: var(--muted); font-size: 10px; }
    .vp-grid { stroke: var(--border-soft); stroke-width: 1; }
    .vp-dim td { opacity: .65; }
    .vpk { position: relative; flex: 1 1 22rem; max-width: 34rem; min-width: 0; }
    .vpk .input { width: 100%; }
    .vpk-list { position: absolute; z-index: 30; left: 0; right: 0; top: calc(100% + 4px); margin: 0; padding: .25rem; list-style: none; max-height: 420px; overflow-y: auto;
      background: var(--card); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); }
    .vpk-head { font-size: .74rem; padding: .3rem .5rem .4rem; }
    .vpk-opt { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .3rem .6rem; padding: .4rem .5rem; border-radius: 7px; cursor: pointer; }
    .vpk-opt.on { background: var(--accent-soft); }
    .vpk-opt.current .vpk-host { font-weight: 700; }
    .vpk-host { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .86rem; word-break: break-all; }
    .vpk-chips { display: flex; flex-wrap: wrap; gap: .2rem; }
    .vpk-chips .pill { margin-right: 0; }
    .vpk-empty { padding: .5rem; font-size: .8rem; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .85em; }
    @media (max-width: 1300px) { .vp-posture { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    /* The shared .layout grid keeps a 280px column floor that overflows a
       phone; one fluid column here. */
    @media (max-width: 700px) { .layout { grid-template-columns: minmax(0, 1fr); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); } .vp-posture { grid-template-columns: repeat(2, minmax(0, 1fr)); } .vp-bar-row { grid-template-columns: 1fr; gap: .2rem; } }
    @media (max-width: 420px) { .vp-posture { grid-template-columns: 1fr; } }
  </style>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%2032%2032%27%3E%3Crect%20width=%2732%27%20height=%2732%27%20rx=%277%27%20fill=%27%23141b2d%27/%3E%3Cpath%20d=%27M16%206l8.7%205v10L16%2026l-8.7-5V11z%27%20fill=%27none%27%20stroke=%27%234da3ff%27%20stroke-width=%272.4%27/%3E%3C/svg%3E" />
  <script>document.documentElement.dataset.theme=(function(){try{return localStorage.getItem("cfm-theme")||"dark"}catch(e){return"dark"}})();</script>
  <script type="module" src="/cfm-admin/assets/shared/nav.js"></script>
  <script src="/cfm-admin/assets/vendor/vue-3.5.13.global.prod.js" defer></script>
  <script src="/cfm-admin/assets/vendor/echarts-5.6.0.min.js"></script>
  <script type="module" src="/cfm-admin/assets/webdet/pages/vhost.js"></script>
</head>
<body>
<div class="shell">
<aside class="sidebar" data-shared-nav></aside>
<div class="main">
<div id="app" v-cloak>
    <div data-wd-section="topbar"></div>
    <main class="layout">
      <div data-wd-section="pageheadervhost"></div>
      <div data-wd-section="vhostprofile"></div>
      <div v-show="vpShowLive" style="display: contents"><div data-wd-section="drilldownlive"></div></div>
    </main>
  </div>
</div><!-- /.main -->
</div><!-- /.shell -->
</body>
</html>
