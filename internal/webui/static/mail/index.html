<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CFM — Mail</title>
  <link rel="stylesheet" href="/cfm-admin/assets/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%2032%2032%27%3E%3Crect%20width=%2732%27%20height=%2732%27%20rx=%277%27%20fill=%27%23141b2d%27/%3E%3Cpath%20d=%27M16%206l8.7%205v10L16%2026l-8.7-5V11z%27%20fill=%27none%27%20stroke=%27%234da3ff%27%20stroke-width=%272.4%27/%3E%3C/svg%3E" />
  <script>document.documentElement.dataset.theme=(function(){try{return localStorage.getItem("cfm-theme")||"dark"}catch(e){return"dark"}})();</script>
  <script type="module" src="/cfm-admin/assets/shared/nav.js"></script>
  <script type="module">
    import "../assets/shared/constants.js";
    import "../assets/shared/auth-context.js";
    import "../assets/shared/auth-mode.js";
    import "../assets/shared/api-client.js";
    import "../assets/shared/controller-bootstrap.js";
    import "../assets/shared/ui-scope.js";
    import "../assets/mail.js";
  </script>
</head>
<body>
<div class="shell">
<aside class="sidebar" data-shared-nav></aside>
<div class="main">
<div id="app">
    <header class="topbar">
      <button class="nav-burger" type="button" data-nav-burger aria-label="Toggle navigation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <h1>Mail</h1>
      <div class="meta">
        <label class="muted">Counters over
          <select id="hoursSel" aria-label="Window of the mail counters"></select>
        </label>
        <span class="muted">Auto-refresh: <strong id="autoState">ON</strong></span>
        <button id="refreshBtn" class="btn-quiet">Refresh now</button>
        <button id="toggleAutoBtn" class="btn-quiet">Stop</button>
      </div>
    </header>

    <main class="layout">
      <section class="card wide">
        <div id="tiles" class="ml-tiles"></div>
        <p id="actionMsg" class="statusline" role="status" style="display:none"></p>
        <div id="tabs" class="vp-tabs" role="tablist" aria-label="Mail views"></div>
      </section>

      <section class="card wide" id="anomalyCard" hidden>
        <h2>Suspected compromise <span class="top-hint">senders far above their own 7-day history in the last 2 hours, or new senders suddenly sending a lot: the earliest sign of a hacked mailbox</span></h2>
        <div class="table-wrap">
          <table class="mini-table"><thead><tr><th>Sender</th><th>Signal</th><th class="pt-r">Last 2h</th><th class="pt-r">Usual per hour</th><th class="pt-r">Times above</th></tr></thead><tbody id="anomalyBody"></tbody></table>
        </div>
      </section>

      <section class="card wide" id="tabPanel" role="tabpanel">
        <p id="panelHead" class="muted ml-head"></p>
        <p id="panelNote" class="ml-note" hidden></p>
        <div id="ageBar" class="ml-age" hidden></div>
        <div id="tables" class="ml-grid"></div>
      </section>
    </main>
  </div>
</div><!-- /.main -->
</div><!-- /.shell -->
</body>
</html>
