<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CFM — Mail</title>
  <script>
    // This page moved: /cfm-admin/mail/ holds the Mail Monitor's tables now,
    // next to the queue. The query (a window, an embedded session's
    // parameters) travels along; tab= is set only when the link named none.
    (function () {
      var q = new URLSearchParams(window.location.search);
      if (!q.get("tab")) q.set("tab", "outbound");
      window.location.replace("/cfm-admin/mail/?" + q.toString());
    })();
  </script>
</head>
<body>
  <p>This page moved to <a href="/cfm-admin/mail/?tab=outbound">/cfm-admin/mail/</a>.</p>
</body>
</html>
