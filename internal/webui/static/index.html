<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CFM Admin Dashboard</title>
  <link rel="stylesheet" href="/cfm-admin/assets/style.css" />
  <script type="module" src="/cfm-admin/assets/shared/nav.js"></script>
  <link rel="icon" href="data:," />
  <script type="module">
    import "./assets/shared/constants.js";
    import "./assets/shared/auth-context.js";
    import "./assets/shared/auth-mode.js";
    import "./assets/shared/api-client.js";
    import "./assets/shared/controller-bootstrap.js";
    import "./assets/shared/ui-scope.js";
    import "./assets/dashboard.js";
  </script>
</head>
<body>
  <div id="app" class="landing-shell" v-cloak>
    <header class="topbar">
      <h1>CFM Admin Dashboard</h1>
           <nav class="top-nav" data-shared-nav></nav>
      <div class="meta">
        <button id="refreshBtn" class="btn-quiet">Refresh now</button>
      </div>
    </header>
    <noscript><p class="statusline" style="padding:0 1rem;">JavaScript is required for live dashboard data.</p></noscript>

    <main class="layout">
      <section class="card wide">
        <h2>Quick controls</h2>
        <div class="toolbar">
          <input id="targetIP" class="input input-wide" type="text" placeholder="IP address" />
          <input id="ttl" class="input" type="text" placeholder="TTL (e.g. 1h)" value="1h" />
          <input id="reason" class="input input-wide" type="text" placeholder="reason" value="webui manual block" />
          <button id="blockBtn">Block</button>
          <button id="unblockBtn" class="btn-quiet">Unblock</button>
        </div>
        <p id="actionMsg" class="statusline" style="display:none"></p>
      </section>

      <section class="card">
        <h2>Health quick stats</h2>
        <div id="healthGrid" class="kpi-grid"></div>
      </section>

      <section class="card">
        <h2>Nginx overview</h2>
        <div id="nginxOverviewGrid" class="kpi-grid"></div>
      </section>

      <section class="card wide">
        <h2>Cache overview</h2>
        <div id="cacheOverview" class="table-wrap"></div>
      </section>
<section class="card">
  <h2>Bot / throttle overview</h2>
  <div id="throttleOverview" class="kpi-grid"></div>
</section>

      <section class="card wide">
        <h2>
          Nginx internals
          <span class="pill" style="margin-left:.4rem;vertical-align:middle;font-size:.7rem">live · lua</span>
        </h2>
        <div id="nginxStatsGrid" class="kpi-grid" style="grid-template-columns:repeat(auto-fill,minmax(220px,1fr))">
          <p class="muted">Loading…</p>
        </div>
      </section>


      <section class="card">
        <h2>DNAT status</h2>
        <pre id="dnatText">Loading...</pre>
      </section>

      <section class="card">
        <h2>SSL stats</h2>
        <pre id="sslText">Loading...</pre>
      </section>
    </main>
  </div>

</body>
</html>
