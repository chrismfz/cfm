name: Semgrep (OSS)

on:
  push: { branches: [ main ] }
  pull_request: { branches: [ main ] }
  schedule: [ { cron: '16 8 * * 4' } ]

permissions:
  contents: read

jobs:
  semgrep:
    name: Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24.6' }

      # Run with public rulepacks (no semgrep.dev account needed)
      - uses: returntocorp/semgrep-action@fcd5ab7459e8d91cb1777481980d1b18b4fc6735
        with:
          config: >
            p/ci
            p/security-audit
            p/go
          generateSarif: "1"
          auditOn: push
          junitXml: "1"
          # fail only on high/critical to reduce PR noise (optional)
          severity: WARNING

      - name: Upload SARIF file
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
