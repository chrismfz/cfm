name: Semgrep (OSS)

on:
  push: { branches: [ main ] }
  pull_request: { branches: [ main ] }
  schedule: [ { cron: '16 8 * * 4' } ]

permissions:
  contents: read

jobs:
  semgrep:
    name: Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      # Public rulepacks — no semgrep.dev account needed. Replaces the retired
      # returntocorp/semgrep-action@v1 (unmaintained; its junitXml/severity inputs
      # are no longer valid). The old `p/go` pack now 404s and is dropped — Go is
      # covered by p/security-audit plus Semgrep's language auto-detection.
      - name: Install Semgrep
        run: pip install --quiet semgrep

      # Non-blocking: findings are advisory (they surface in the job log and, if
      # code scanning is enabled, in the SARIF upload below). `|| true` keeps a
      # finding — or a registry hiccup — from failing the PR check.
      - name: Semgrep scan
        run: |
          semgrep scan \
            --config p/ci \
            --config p/security-audit \
            --sarif --output=semgrep.sarif \
            --metrics=off || true

      # Best-effort: if GitHub code scanning is not enabled on the repository the
      # upload returns "Resource not accessible by integration" — that must not
      # fail the check. continue-on-error makes it a no-op until code scanning is
      # turned on (at which point findings start populating the Security tab).
      - name: Upload SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
