name: Security & Quality (OSS)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * *' # Every day at 03:00 UTC
  workflow_dispatch: {}   # Run manually from the Actions tab

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: '1.25'

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go version
      - run: go mod tidy
      - name: Enforce CLI transport guardrail
        run: ./scripts/tests/check_cli_transport.sh
      - run: go build ./...
      - run: go test -race -v ./...

  govulncheck:
    name: govulncheck (Go official)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: ${{ env.GO_VERSION }}
          directory: .

  gosec:
    name: gosec (static analyzer)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # for SARIF upload
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # Pin or use latest; we'll sanitize SARIF either way
      - run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      - name: Run gosec (produce SARIF)
        run: |
          gosec -no-fail -exclude-dir=vendor -fmt sarif -out gosec.sarif ./...
      - name: Sanitize SARIF for GitHub (remove problematic 'fixes' nodes)
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          jq '.runs = (.runs | map(.results = (.results // [] | map(del(.fixes)))))' \
            gosec.sarif > gosec.cleaned.sarif
      - name: Upload SARIF (gosec)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gosec.cleaned.sarif
