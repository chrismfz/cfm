name: Security & Quality (OSS)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * *' # Every day at 03:00 UTC
  workflow_dispatch: {}   # Run manually from the Actions tab

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: '1.25'

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go version
      - run: go mod tidy
      # OpenResty/Angie embed LuaJIT, so Lua-side regression checks run
      # against luajit to match production semantics (see the "lua" rule in
      # Makefile). ubuntu-latest doesn't ship luajit; install it explicitly.
      - name: Install luajit (Lua interpreter for CI checks)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends luajit
      - name: Enforce CLI transport guardrail
        run: ./scripts/tests/check_cli_transport.sh
      - name: Enforce Lua clearance module load check
        run: ./scripts/tests/check_cfm_clearance_require.sh
      - name: Validate challenge/WAF bypass list + generator safety bounds
        run: ./scripts/tests/check_bypass_list.sh
      - name: Enforce logrotate coverage for every CFM log path
        run: ./scripts/tests/check_logrotate_coverage.sh
      # Lua syntax check + unit tests. luajit was installed above; both
      # targets bail out with a clear message if it ever goes missing.
      - name: Lua syntax check (configs/lua)
        run: make lua
      - name: Lua unit tests (scripts/tests/*_test.lua)
        run: make test-lua
      # go vet catches mutex copies, duplicate JSON tags, atomic copies,
      # and similar correctness issues at no cost.
      - name: go vet
        run: go vet ./...
      - run: go build ./...
      - run: go test -race -v ./...

  govulncheck:
    name: govulncheck (Go official)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: ${{ env.GO_VERSION }}
          directory: .

  gosec:
    name: gosec (static analyzer)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # for SARIF upload
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # Pin or use latest; we'll sanitize SARIF either way
      - run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      - name: Run gosec (produce SARIF)
        run: |
          gosec -no-fail -exclude-dir=vendor -fmt sarif -out gosec.sarif ./...
      - name: Sanitize SARIF for GitHub (remove problematic 'fixes' nodes)
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          jq '.runs = (.runs | map(.results = (.results // [] | map(del(.fixes)))))' \
            gosec.sarif > gosec.cleaned.sarif
      # Best-effort: gosec runs with -no-fail and produces SARIF regardless.
      # The upload only works when GitHub code scanning is enabled on the repo;
      # otherwise it returns "Resource not accessible by integration / Code
      # scanning is not enabled" and must NOT fail the check. Once code scanning
      # is enabled this becomes a real upload with no further change needed.
      - name: Upload SARIF (gosec)
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gosec.cleaned.sarif
