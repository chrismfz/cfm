name: Security & Quality (OSS)

# The per-PR correctness gate — kept deliberately lean so it can run on every
# PR without burning Actions minutes. The heavier security scanners (CodeQL,
# govulncheck) moved to a weekly schedule (see codeql.yml) instead of running on
# every PR/push; gosec and Semgrep were dropped (CodeQL covers the same ground).
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}   # Run manually from the Actions tab

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: '1.25'

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go version
      - run: go mod tidy
      # OpenResty/Angie embed LuaJIT, so Lua-side regression checks run
      # against luajit to match production semantics (see the "lua" rule in
      # Makefile). ubuntu-latest doesn't ship luajit; install it explicitly.
      #
      # ripgrep is likewise a hard dependency of several guardrail scripts, and
      # likewise absent from the runner (the edge installers apt/dnf-install it
      # on real hosts for the same reason). Without it check_cli_transport.sh
      # piped `rg … || true`, read zero matches and printed OK while a real
      # violation sat in the tree — a guardrail reporting success for months
      # without ever running. Those scripts now refuse to run without it; this
      # step is what makes them able to.
      - name: Install luajit + ripgrep (CI check dependencies)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends luajit ripgrep
      - name: Enforce CLI transport guardrail
        run: ./scripts/tests/check_cli_transport.sh
      - name: Enforce Lua clearance module load check
        run: ./scripts/tests/check_cfm_clearance_require.sh
      - name: Validate challenge/WAF bypass list + generator safety bounds
        run: ./scripts/tests/check_bypass_list.sh
      - name: Enforce logrotate coverage for every CFM log path
        run: ./scripts/tests/check_logrotate_coverage.sh
      - name: Enforce origin-keepalive 443 SNI-safety config invariant
        run: ./scripts/tests/check_origin_ka_config.sh
      - name: Enforce shared-Lua layout + installer manifest parity
        run: ./scripts/tests/check_shared_lua_layout.sh
      - name: Enforce package Lua delivery invariants
        run: ./scripts/tests/check_package_lua_delivery.sh
      - name: Reject unescaped RPM macros in spec comments; require build-dated top %changelog
        run: ./scripts/tests/check_rpm_spec_macros.sh
      - name: Enforce Site Cache bypass-by-default config invariant
        run: ./scripts/tests/check_site_cache_config.sh
      - name: CHANGELOG date-stamper regression test
        run: ./scripts/tests/stamp_changelog_test.sh
      - name: Release-notes extractor regression test
        run: ./scripts/tests/release_notes_test.sh
      - name: Enforce /preflight + CLAUDE.md §3 gate lists == this workflow
        run: ./scripts/tests/check_preflight_parity.sh
      # Lua syntax check + unit tests. luajit was installed above; both
      # targets bail out with a clear message if it ever goes missing.
      - name: Lua syntax check (configs/lua)
        run: make lua
      - name: Lua unit tests (scripts/tests/*_test.lua)
        run: make test-lua
      - name: cfm-admin JS unit tests (node --test)
        run: make test-js
      # go vet catches mutex copies, duplicate JSON tags, atomic copies,
      # and similar correctness issues at no cost.
      - name: go vet
        run: go vet ./...
      - run: go build ./...
      # The Go tests must never write CFM's live system dirs (they used to:
      # manual challenges, WAF excludes, the notifier history and live
      # notify.conf, kernsec rollback snapshots — see check_test_isolation.sh).
      # The runner isn't root, so such a write would fail silently and the test
      # still pass; creating the dirs writable for the runner makes it succeed,
      # and seeding them like a packaged node exposes a test that writes only
      # to a file that already exists. The guard then sees either.
      - name: Create CFM's system dirs, writable, for the test-isolation guard
        run: sudo install -d -o "$(id -u)" -g "$(id -g)" /var/lib/cfm /run/cfm /etc/cfm /var/log/cfm
      - name: Seed them like a packaged node (conffiles, Lua, logs)
        run: ./scripts/tests/ci_seed_cfm_dirs.sh
      - run: ./scripts/tests/check_test_isolation.sh arm
      - run: go test -race ./...
      # Also on a red run: a failing test can still have written the live dirs.
      - name: Fail if the Go tests wrote CFM's live system dirs
        if: ${{ !cancelled() }}
        run: ./scripts/tests/check_test_isolation.sh verify

  # CHANGELOG hygiene — a separate, tiny job (own checkout so it can diff the PR
  # against its base). Two guards: the CHANGELOG structure stays stampable, and
  # a PR that changes runtime code doesn't merge with an empty changelog.
  changelog:
    name: CHANGELOG hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need the merge-base with the PR base to diff changed files
      - name: CHANGELOG entry + structure guard
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: ./scripts/tests/check_changelog_entry.sh
