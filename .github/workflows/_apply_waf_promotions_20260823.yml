name: Finalize validated WAF promotion tests (one-shot)

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: waf/promote-validated-rules-20260823
          fetch-depth: 0

      - name: Update BAD_UA and promotion regressions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('scripts/tests/cfm_waf_severity_test.lua')
          s = p.read_text()

          # The old severity tests used sqlmap as their generic challenge fixture.
          # score=99 now intentionally blocks, so preserve those tests' original
          # purpose with an ordinary score-4/5 BAD_UA challenge instead.
          old = '    headers = { ["User-Agent"] = "sqlmap/1.5.0" },'
          n = s.count(old)
          if n != 3:
              raise SystemExit(f'expected exactly 3 old sqlmap challenge fixtures, got {n}')
          s = s.replace(old, '    method = "HEAD",\n    headers = { ["User-Agent"] = "" },')

          # Extend the fresh-default assertion with this promotion batch.
          old_list = '''    "rule_ip_host",
    "rule_ctrl_chars",
    "rule_debug_toggles",
    "rule_serialize",
    "rule_cmd_payload_backtick",
    "rule_header_flood",
    "rule_cmd_payload",  -- fallback default, kept aligned with sub-rules
  }'''
          new_list = '''    "rule_ip_host",
    "rule_ctrl_chars",
    "rule_debug_toggles",
    "rule_serialize",
    "rule_cmd_payload_backtick",
    "rule_header_flood",
    "rule_cmd_payload",  -- fallback default, kept aligned with sub-rules
    "rule_traversal",
    "rule_sqli_union_variant",
    "rule_ssrf",
  }'''
          if s.count(old_list) != 1:
              raise SystemExit('promotion challenge-default list did not match exactly once')
          s = s.replace(old_list, new_list, 1)

          challenge_loop = '''  for _, name in ipairs(must_be_challenge) do
    check(snap[name] == "challenge",
          "71: " .. name .. " ships as 'challenge' (got " .. tostring(snap[name]) .. ")")
  end
end'''
          challenge_plus_block = '''  for _, name in ipairs(must_be_challenge) do
    check(snap[name] == "challenge",
          "71: " .. name .. " ships as 'challenge' (got " .. tostring(snap[name]) .. ")")
  end

  local must_be_block = {
    "rule_sqli_blind_lexical",
    "rule_xmlrpc_multicall",
    "rule_xmlrpc_pingback",
    "rule_xmlrpc_post_burst",
  }
  for _, name in ipairs(must_be_block) do
    check(snap[name] == "block",
          "71: " .. name .. " ships as 'block' (got " .. tostring(snap[name]) .. ")")
  end
end'''
          if s.count(challenge_loop) != 1:
              raise SystemExit('promotion challenge assertion loop did not match exactly once')
          s = s.replace(challenge_loop, challenge_plus_block, 1)

          marker = '\nif fails > 0 then\n'
          if s.count(marker) != 1:
              raise SystemExit('final severity-test marker did not match exactly once')
          regression = r'''

-- ── Regression: BAD_UA score=99 hard-blocks, normal scoring stays challenge ──
do
  disable_all_rules()
  waf.set_rule("rule_bad_ua", "challenge")

  local hit, reason, ttl, action, hits, rule_id = waf.check(fresh_ctx({
    headers = { ["User-Agent"] = "sqlmap/1.5.0" },
  }))
  check(hit == true,                                "bad_ua score99 — hit=true")
  check(reason == "WAF_BAD_UA:UA_SQLMAP:score=99", "bad_ua score99 — exact reason")
  check(action == "block",                         "bad_ua score99 — action=block")
  check(ttl == waf.get_config().block_ttl_sec,      "bad_ua score99 — block ttl")
  check(rule_id == 201,                             "bad_ua score99 — rule id 201")
  check(hits and hits[1] and hits[1].action == "block", "bad_ua score99 — hit entry block")
end

-- Explicit logonly remains the operator's audit/kill-switch for rule 201.
do
  disable_all_rules()
  waf.set_rule("rule_bad_ua", "logonly")

  local hit, _reason, _ttl, action = waf.check(fresh_ctx({
    headers = { ["User-Agent"] = "sqlmap/1.5.0" },
  }))
  check(hit == true,         "bad_ua score99 logonly — hit=true")
  check(action == "logonly", "bad_ua score99 logonly — override preserved")
end
'''
          s = s.replace(marker, regression + marker, 1)
          p.write_text(s)
          PY

      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1

      - name: Run focused Lua regression suite
        run: lua5.1 scripts/tests/cfm_waf_severity_test.lua

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run Go WAF registry and detector tests
        run: |
          go test ./internal/webdetector
          go test ./internal/detectors/...

      - name: Commit test updates and remove one-shot scaffolding
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_apply_waf_promotions_20260823.yml
          git rm .github/_waf_patch_trigger_20260823
          git add scripts/tests/cfm_waf_severity_test.lua
          git commit -m "test: cover promoted WAF modes and BAD_UA score 99"
          git push origin HEAD:waf/promote-validated-rules-20260823
