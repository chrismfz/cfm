name: "Weekly Security Scans"

# Deep security scanners (CodeQL + govulncheck). These used to run on every PR
# and every push, which — CodeQL autobuilds the whole Go daemon — burned the
# repo's Actions-minute budget in a handful of PRs. They are advisory (the
# per-PR correctness gate is security.yml's build-test), so they now run on a
# weekly schedule plus on-demand (Actions tab → Run workflow). The scheduled
# run scans whatever is on main; trigger a manual run before a release or after
# a risky merge if you want an immediate scan.
on:
  schedule:
    - cron: '45 15 * * 1'   # Mondays 15:45 UTC
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (go)
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # required to upload results
      packages: read           # required to fetch internal/private CodeQL packs
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go
          build-mode: autobuild
      # analyze runs the queries AND uploads results to code scanning. When code
      # scanning is not enabled on the repo the upload fails ("Code scanning is
      # not enabled"); tolerate it so the check doesn't go red. Once code
      # scanning is enabled the upload succeeds unchanged.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        continue-on-error: true
        with:
          category: "/language:go"

  govulncheck:
    name: govulncheck (Go official)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: '1.25'
          directory: .
